ec4"}},{"name":"media_box","type":{"name":"Vec2","uid":"std::math::vector::Vec2"}},{"name":"owns_widget","type":{"name":"bool"}},{"name":"dirty","type":{"name":"DirtyFlags","uid":"cui::DirtyFlags"}},{"name":"watches","type":{"name":"Watch[4]","uid":"cui::Watch"}},{"name":"watch_count","type":{"name":"uint"}}],"docs":{"text":"One node of the retained tree: a widget's identity, its cached layout and its\n cached drawings. Elements are created by the node macros and recycled through\n a free-list, so an `Element*` stays valid for the lifetime of its Ui \u2014 holding\n one is CUI's equivalent of a Flutter GlobalKey. Widget code reaches everything\n else through it (`elem.ui`, `elem.parent`, `elem.children`)."}},{"name":"Ui","kind":"struct","uid":"cui::Ui","file":"src/core/ui.c3:455:8","members":[{"name":"root","type":{"name":"Element*","uid":"cui::Element"}},{"name":"canvas","type":{"name":"Canvas","uid":"cui::Canvas"}},{"name":"text","type":{"name":"TextSystem","uid":"cui::TextSystem"}},{"name":"size","type":{"name":"Vec2","uid":"std::math::vector::Vec2"}},{"name":"pixel_ratio","type":{"name":"float"}},{"name":"input","type":{"name":"Input","uid":"cui::Input"}},{"name":"cursor","type":{"name":"Cursor","uid":"cui::Cursor"}},{"name":"hovered","type":{"name":"Element*","uid":"cui::Element"}},{"name":"captured","type":{"name":"Element*","uid":"cui::Element"}},{"name":"capture_button","type":{"name":"MouseButton","uid":"cui::MouseButton"}},{"name":"focused","type":{"name":"Element*","uid":"cui::Element"}},{"name":"held_keys","type":{"name":"List{Key}","uid":"std::collections::list::List{Key}"}},{"name":"free_elements","type":{"name":"List{Element*}","uid":"std::collections::list::List{Element*}"}},{"name":"all_elements","type":{"name":"List{Element*}","uid":"std::collections::list::List{Element*}"}},{"name":"free_transform_slots","type":{"name":"List{uint}","uid":"std::collections::list::List{uint}"}},{"name":"build_stack","type":{"name":"List{Element*}","uid":"std::collections::list::List{Element*}"}},{"name":"scope_floor","type":{"name":"sz","uid":"std::core::sz"}},{"name":"scoped_root","type":{"name":"Element*","uid":"cui::Element"}},{"name":"context","type":{"name":"List{any}","uid":"std::collections::list::List{any}"}},{"name":"watcher","type":{"name":"Element*","uid":"cui::Element"}},{"name":"watch_kind","type":{"name":"WatchKind","uid":"cui::WatchKind"}},{"name":"build_pending","type":{"name":"bool"}},{"name":"layout_pending","type":{"name":"bool"}},{"name":"paint_pending","type":{"name":"bool"}},{"name":"frame_requested","type":{"name":"bool"}}],"docs":{"text":"One UI instance: the element tree, the canvas the renderer consumes, and the\n interactivity state. Created with `new_ui`, driven by `process_input` +\n `flush` once per frame (the reference renderer's `frame()` does both)."}},{"name":"RectStyle","kind":"struct","uid":"cui::RectStyle","file":"src/core/ui.c3:2000:8","members":[{"name":"color","type":{"name":"Color","uid":"cui::Color"}},{"name":"border_color","type":{"name":"Color","uid":"cui::Color"}},{"name":"border_width","type":{"name":"float"}},{"name":"border_radius","type":{"name":"Vec4","uid":"std::math::vector::Vec4"}},{"name":"texture","type":{"name":"Texture","uid":"cui::Texture"}}],"docs":{"text":"Style for `Painter.rect`. Corner radii run {top-left, top-right, bottom-right,\n bottom-left} and are clamped to what the shape can fit; the border is drawn\n inside the edge."}},{"name":"CircleStyle","kind":"struct","uid":"cui::CircleStyle","file":"src/core/ui.c3:2013:8","members":[{"name":"color","type":{"name":"Color","uid":"cui::Color"}},{"name":"border_color","type":{"name":"Color","uid":"cui::Color"}},{"name":"border_width","type":{"name":"float"}},{"name":"texture","type":{"name":"Texture","uid":"cui::Texture"}}],"docs":{"text":"Style for `Painter.circle` / `Painter.ellipse`. The border is drawn inside the\n edge; a texture is sampled across the shape's bounding box."}},{"name":"Painter","kind":"struct","uid":"cui::Painter","file":"src/core/ui.c3:2029:8","members":[{"name":"element","type":{"name":"Element*","uid":"cui::Element"}}],"docs":{"text":"What `Widget.paint` draws with. Positions are LOCAL to the element; the emit\n pass translates them to absolute coordinates, which is why a moved element does\n not repaint.\n\n All units are pixels; angles are radians with 0 = +x, increasing clockwise on\n screen (y points down)."}},{"name":"WatchKind","kind":"enum","uid":"cui::WatchKind","file":"src/core/ui.c3:166:6","base_type":{"name":"char"},"members":[{"name":"BUILD","type":{"name":"WatchKind","uid":"cui::WatchKind"},"docs":null},{"name":"LAYOUT","type":{"name":"WatchKind","uid":"cui::WatchKind"},"docs":null},{"name":"PAINT","type":{"name":"WatchKind","uid":"cui::WatchKind"},"docs":null}],"docs":{"text":"Which hook a watch was taken from, and therefore what `Ui.invalidate` asks for\n when the watched value changes. See `Element.watch`."}},{"name":"NOT_PROVIDED","kind":"fault","uid":"cui::NOT_PROVIDED","file":"src/core/ui.c3:561:10","members":[],"docs":null},{"name":"WIDGET_NOT_FOUND","kind":"fault","uid":"cui::WIDGET_NOT_FOUND","file":"src/core/ui.c3:825:10","members":[],"docs":null},{"name":"MouseEvent","kind":"struct","uid":"cui::MouseEvent","file":"src/core/input.c3:49:8","members":[{"name":"kind","type":{"name":"MouseEventKind","uid":"cui::MouseEventKind"}},{"name":"button","type":{"name":"MouseButton","uid":"cui::MouseButton"}},{"name":"pos","type":{"name":"Vec2","uid":"std::math::vector::Vec2"}},{"name":"absolute","type":{"name":"Vec2","uid":"std::math::vector::Vec2"}},{"name":"scroll","type":{"name":"float"}},{"name":"scroll_x","type":{"name":"float"}},{"name":"scroll_precise","type":{"name":"bool"}}],"docs":{"text":"One mouse event delivered to `Widget.on_mouse`. Hit-tested and bubbling: the\n deepest element under the pointer sees it first, and returning true consumes it\n (consuming a PRESS captures the pointer until that button releases)."}},{"name":"KeyEvent","kind":"struct","uid":"cui::KeyEvent","file":"src/core/input.c3:64:8","members":[{"name":"key","type":{"name":"Key","uid":"cui::Key"}},{"name":"down","type":{"name":"bool"}}],"docs":{"text":"One key edge delivered to `Widget.on_key` \u2014 press and release only; hold state\n lives in `Input.keys_down`."}},{"name":"Input","kind":"struct","uid":"cui::Input","file":"src/core/input.c3:225:8","members":[{"name":"mouse","type":{"name":"Vec2","uid":"std::math::vector::Vec2"}},{"name":"mouse_delta","type":{"name":"Vec2","uid":"std::math::vector::Vec2"}},{"name":"down","type":{"name":"bool[3]"}},{"name":"pressed","type":{"name":"bool[3]"}},{"name":"released","type":{"name":"bool[3]"}},{"name":"scroll","type":{"name":"float"}},{"name":"scroll_x","type":{"name":"float"}},{"name":"scroll_precise","type":{"name":"bool"}},{"name":"text","type":{"name":"String"}},{"name":"time","type":{"name":"float"}},{"name":"dt","type":{"name":"float"}},{"name":"keys_down","type":{"name":"Key[]","uid":"cui::Key"}}],"docs":{"text":"Per-frame input state, live on Ui as `ui.input` \u2014 readable from any widget via\n `elem.ui`. This is the \"context\" a widget polls in `update()`.\n\n Note that `paint()` output is cached: a widget reading this from `paint()` will\n not see it change. React in the event callbacks or in `update()`, then call\n `request_paint()`."}},{"name":"InputFrame","kind":"struct","uid":"cui::InputFrame","file":"src/core/input.c3:259:8","members":[{"name":"mouse","type":{"name":"Vec2","uid":"std::math::vector::Vec2"}},{"name":"buttons","type":{"name":"bool[3]"}},{"name":"scroll","type":{"name":"float"}},{"name":"scroll_x","type":{"name":"float"}},{"name":"scroll_precise","type":{"name":"bool"}},{"name":"text","type":{"name":"String"}},{"name":"keys_down","type":{"name":"Key[]","uid":"cui::Key"}}],"docs":{"text":"Everything the embedder knows about input this frame, in UI coordinates\n (top-left origin, pixels). Fill one per frame and hand it to\n `Ui.process_input`; the refer ind":"constant","uid":"cui::UNBOUNDED","file":"src/core/ui.c3:53:13","type":{"name":"float"},"is_const":true,"value":"1e+09","members":[],"docs":{"text":"\"Unbounded\" constraint for scrollable axes. Deliberately finite: `float.inf`\n would turn a fill-to-max widget (a Stack with size 0) into an infinite element\n and NaNs downstream; 1e9 keeps the arithmetic sane. Fill-parent widgets must\n not be unbounded-axis children of a Scroll."}},{"name":"MAX_WATCHES","kind":"constant","uid":"cui::MAX_WATCHES","file":"src/core/ui.c3:192:11","type":{"name":"usz","uid":"std::core::usz"},"is_const":true,"value":"4","members":[],"docs":{"text":"How many distinct (type, hook) pairs one element may watch.\n\n Inline on the Element rather than a list, so watching allocates nothing and a\n recycled element carries none of its predecessor's. Four is generous for what\n a single hook realistically reads \u2014 a camera, a theme \u2014 and overflowing it\n asserts rather than silently dropping a dependency, which would show up as a\n stale pane long after the call that caused it."}},{"name":"WHITE","kind":"constant","uid":"cui::WHITE","file":"src/core/ui.c3:203:13","type":{"name":"Color","uid":"cui::Color"},"is_const":true,"value":"{ 1.0, 1.0, 1.0, 1.0 }","members":[],"docs":{"text":"Opaque white."}},{"name":"BLACK","kind":"constant","uid":"cui::BLACK","file":"src/core/ui.c3:208:13","type":{"name":"Color","uid":"cui::Color"},"is_const":true,"value":"{ 0.0, 0.0, 0.0, 1.0 }","members":[],"docs":{"text":"Opaque black."}},{"name":"BLUE","kind":"constant","uid":"cui::BLUE","file":"src/core/ui.c3:213:13","type":{"name":"Color","uid":"cui::Color"},"is_const":true,"value":"{ 0.5, 0.5, 0.5, 1.0 }","members":[],"docs":{"text":"Opaque mid grey. Historical name \u2014 kept because demos reference it."}},{"name":"ambient_ui","kind":"global variable","uid":"cui::ambient_ui","file":"src/core/ui.c3:1167:12","visibility":"private","type":{"name":"Ui*","uid":"cui::Ui"},"members":[],"docs":null},{"name":"shader_spirv","kind":"global variable","uid":"cui::shader_spirv","file":"src/render/shader.c3:18:9","type":{"name":"char[*]"},"value":"$embed(\"../shaders/shader.spv\")","members":[],"docs":{"text":"Compiled SPIR-V of src/shaders/shader.slang, embedded so consumers create their\n VkShaderModule straight from the library with no file management. One module,\n two entry points (`SHADER_VERTEX_ENTRY` and `SHADER_FRAGMENT_ENTRY`)."}},{"name":"SHADER_VERTEX_ENTRY","kind":"constant","uid":"cui::SHADER_VERTEX_ENTRY","file":"src/render/shader.c3:23:15","type":{"name":"ZString","uid":"std::core::string::ZString"},"is_const":true,"value":"vertexMain","members":[],"docs":{"text":"Name of the vertex entry point in `shader_spirv`."}},{"name":"SHADER_FRAGMENT_ENTRY","kind":"constant","uid":"cui::SHADER_FRAGMENT_ENTRY","file":"src/render/shader.c3:28:15","type":{"name":"ZString","uid":"std::core::string::ZString"},"is_const":true,"value":"fragmentMain","members":[],"docs":{"text":"Name of the fragment entry point in `shader_spirv`."}},{"name":"NO_TEXTURE","kind":"constant","uid":"cui::NO_TEXTURE","file":"src/render/canvas.c3:31:15","type":{"name":"Texture","uid":"cui::Texture"},"is_const":true,"value":"0","members":[],"docs":{"text":"The untextured handle: a drawing carrying this samples no image."}},{"name":"NO_CLIP_ENTRY","kind":"constant","uid":"cui::NO_CLIP_ENTRY","file":"src/render/canvas.c3:80:17","type":{"name":"ClipEntry","uid":"cui::ClipEntry"},"is_const":true,"value":"{ .rect = { -1e9, -1e9, 1e9, 1e9 }, .radii = {} }","members":[],"docs":{"text":"Slot 0 = \"no clip\". The shader early-outs on `clip_id == 0`; the huge rect is\n belt and braces."}},{"name":"DEFAULT_TEXT_SIZE","kind":"constant","uid":"cui::DEFAULT_TEXT_SIZE","file":"src/render/text.c3:23:13","type":{"name":"float"},"is_const":true,"value":"16","members":[],"docs":{"text":"Em size used when a text style leaves `size` at 0."}},{"name":"TEXT_BAKE_PX","kind":"constant","uid":"cui::TEXT_BAKE_PX","file":"src/render/text.c3:30:13","type":{"name":"float"},"is_const":true,"value":"48","members":[],"docs":{"text":"Em size glyphs are baked at. One bake serves every displayed size: SDFs\n stay clean from roughly a fifth of this to several times it, which covers\n UI text comfortably."}},{"name":"TEXT_SPREAD","kind":"constant","uid":"cui::TEXT_SPREAD","file":"src/render/text.c3:37:13","type":{"name":"float"},"is_const":true,"value":"8","members":[],"docs":{"text":"SDF half-range in pixels at bake size, and the padding baked around each\n glyph bitmap. Bounds how far distance effects (and clean magnification)\n can reach."}},{"name":"ATLAS_SIZE","kind":"constant","uid":"cui::ATLAS_SIZE","file":"src/render/text.c3:39:12","type":{"name":"uint"},"is_const":true,"value":"1024","members":[],"docs":null},{"name":"ATLAS_GAP","kind":"constant","uid":"cui::ATLAS_GAP","file":"src/render/text.c3:40:12","type":{"name":"uint"},"is_const":true,"value":"1","members":[],"docs":null}]},"cui::vulkan":{"is_generic":false,"docs":{"text":"Where the Vulkan loader and the driver come from.\n\n Nothing links against Vulkan: the vk bindings resolve every command at runtime\n (see vk/loader.c3 in vulkan.c3l), so neither cui nor an app using it needs a\n Vulkan SDK to build \u2014 on any platform. What a program needs at runtime is a\n loader and a driver, and vulkan.c3l itself ships both for macOS \u2014 the one\n platform with no system Vulkan \u2014 in its `macos-aarch64/` directory: the LunarG\n loader, dlopened by `vk::init`, and the KosmicKrisp driver, handed to that\n loader through `VK_LUNARG_direct_driver_loading`. On Linux and Windows the\n machine's own loader and driver are used, since a driver is bound to the GPU\n and cannot be shipped.\n\n Finding those two files is vulkan.c3l's own job, and it needs no help: besides\n the executable directory and a system SDK, its last candidate is built from\n `$$FILEPATH` (`vk::c3l_root`), the compile-time path of its own source \u2014 so it\n locates its `macos-aarch64/` directory wherever the library ended up, whether\n that is a submodule under `lib/`, a downloaded `vulkan.c3l` c3c unpacked, or a\n plain clone. cui therefore ships no Vulkan binaries of its own; a consumer\n installs `vulkan.c3l` next to `cui.c3l` and both are found.\n\n All this file adds is the `$CUI_VULKAN_*` overrides, for pointing a build at a\n loader or driver of your own without rebuilding.\n\n See lib/vulkan.c3l/README.md."},"functions":[{"name":"init_loader","kind":"function","uid":"cui::vulkan::init_loader","file":"src/vulkan/vendored.c3:64:10","return_type":{"name":"void?"},"members":[],"docs":{"text":"No cui-specific candidates: either this is Linux or Windows, where the system\n loader is the only correct one, or SYSTEM_VULKAN asked cui to keep out of the\n way. `vk::init` opens the loader by its installed platform name."}},{"name":"find_bundled_driver","kind":"function","uid":"cui::vulkan::find_bundled_driver","file":"src/vulkan/vendored.c3:94:41","return_type":{"name":"PFN_vkGetInstanceProcAddrLUNARG?","uid":"vk::PFN_vkGetInstanceProcAddrLUNARG"},"members":[],"docs":{"text":"No driver to load: either this is Linux or Windows, or SYSTEM_VULKAN asked cui\n to keep out of the way. The loader then discovers an installed driver in the\n usual manner, which is the only correct thing to do in both cases."}},{"name":"new_canvas_pass","kind":"function","uid":"cui::vulkan::new_canvas_pass","file":"src/vulkan/canvas_pass.c3:140:16","return_type":{"name":"CanvasPass?","uid":"cui::vulkan::CanvasPass"},"members":[{"name":"device","type":{"name":"Device","uid":"vk::Device"}},{"name":"allocator","type":{"name":"MemoryAllocator*","uid":"vk::MemoryAllocator"}},{"name":"queue","type":{"name":"DeviceQueue","uid":"vk::DeviceQueue"}},{"name":"color_format","type":{"name":"Format","uid":"vk::Format"}},{"name":"depth_format","type":{"name":"Format","uid":"vk::Format"}},{"name":"window_size","type":{"name":"Vec2","uid":"std::math::vector::Vec2"}}],"docs":{"text":"Builds the buffers and texture array for a canvas pass.\n\n The pipeline itself is built lazily on the first `upload`, and rebuilt whenever\n the texture count changes, because the sampler-array binding is sized by it.","params":[{"name":"device","description":"The host's device. Borrowed \u2014 free destroys only what this pass created."},{"name":"allocator","description":"The host's allocator. Borrowed, and must outlive the pass. It needs MEMORY_ALLOCATE_DEVICE_ADDRESS_BIT."},{"name":"queue","description":"A graphics queue, used for the one-shot uploads that move image data."},{"name":"color_format","description":"Format of the color attachment the pass will draw into."},{"name":"depth_format","description":"Format of the depth attachment, or FORMAT_UNDEFINED when the host's pass has none. cui never tests or writes depth; this only has to match the pass it is recorded into."},{"name":"window_size","description":"Logical size of the surface, in the same pixels the Ui lays out in."}]}},{"name":"update_atlas_image","kind":"function","uid":"cui::vulkan::update_atlas_image","file":"src/vulkan/render_state.c3:213:10","return_type":{"name":"void?"},"members":[{"name":"image","type":{"name":"Image","uid":"vk::Image"}},{"name":"pixels","type":{"name":"char[]"}},{"name":"width","type":{"name":"uint"}},{"name":"height","type":{"name":"uint"}},{"name":"first","type":{"name":"bool"}},{"name":"allocator","type":{"name":"MemoryAllocator*","uid":"vk::MemoryAllocator"}},{"name":"queue","type":{"name":"DeviceQueue","uid":"vk::DeviceQueue"}}],"docs":{"text":"(Re)uploads the full pixel contents of an atlas image created by `load_atlas`.\n `first` selects the source barrier: UNDEFINED right after creation, otherwise\n the shader-read layout every update leaves the image in."}},{"name":"new","kind":"function","uid":"cui::vulkan::new","file":"src/vulkan/renderer.c3:197:14","return_type":{"name":"Renderer?","uid":"cui::vulkan::Renderer"},"members":[{"name":"window_size","type":{"name":"Vec2","uid":"std::math::vector::Vec2"},"default_value":"{800, 600}"},{"name":"enable_debug","type":{"name":"bool"},"default_value":"false"},{"name":"loop_mode","type":{"name":"LoopMode","uid":"cui::vulkan::LoopMode"},"default_value":"CONTINUOUS"},{"name":"clear_color","type":{"name":"float[4]"},"default_value":"{0.0, 0.0, 0.0, 1.0}"},{"name":"quit_on_escape","type":{"name":"bool"},"default_value":"true"},{"name":"title","type":{"name":"String"},"default_value":"DEFAULT_TITLE"}],"docs":{"text":"Opens a window and brings up the whole Vulkan stack for it: instance, device,\n swapchain, buffers and pipeline.","return":"The renderer, ready for frame(). Set its scene/scene_ctx fields to draw under the UI.","params":[{"name":"window_size","description":"The window content size in points; also the root constraints for the Ui. On a retina display the framebuffer is larger by the backing scale \u2014 everything renders at the display's native pixel density."},{"name":"enable_debug","description":"Turn on the Vulkan validation layers and the debug messenger."},{"name":"loop_mode","description":"Whether frame() redraws continuously or sleeps until input arrives."},{"name":"clear_color","description":"RGBA the color attachment is cleared to each frame."},{"name":"quit_on_escape","description":"Whether ESCAPE ends the frame loop. Clear it when the app binds ESCAPE itself \u2014 a 3D viewport usually wants it for cancel/deselect."},{"name":"title","description":"The window title \u2014 what the title bar, the task switcher and the dock show. Read once here; there is no setter, so a host with a document name in the title has to rebuild the window to change it."}]}},{"name":"is_mouse_key","kind":"function","uid":"cui::vulkan::is_mouse_key","file":"src/vulkan/renderer.c3:626:9","return_type":{"name":"bool"},"members":[{"name":"key","type":{"name":"EventKey","uid":"c3w::EventKey"}}],"docs":{"text":"Whether a c3w event key is really a mouse button. The EventMap of c3w mixes\n keyboard keys and mouse buttons; buttons feed `InputFrame.buttons`, everything\n else becomes a `cui::Key`.","return":"True for mouse buttons and wheel events.","params":[{"name":"key","description":"The c3w event key."}]}},{"name":"cursor_shape","kind":"function","uid":"cui::vulkan::cursor_shape","file":"src/vulkan/renderer.c3:648:21","return_type":{"name":"CursorShape","uid":"c3w::CursorShape"},"members":[{"name":"cursor","type":{"name":"Cursor","uid":"cui::Cursor"}}],"docs":{"text":"Maps a `cui::Cursor` to the c3w shape the window manager understands.","return":"The matching c3w cursor shape.","params":[{"name":"cursor","description":"The cursor cui resolved for this frame."}]}}],"methods":[{"name":"adopt","kind":"method","uid":"cui::vulkan::CanvasPass.adopt","file":"src/vulkan/canvas_pass.c3:227:20","return_type":{"name":"void"},"members":[{"name":"self","type":{"name":"CanvasPass*","uid":"cui::vulkan::CanvasPass"},"is_ref":true},{"name":"allocator","type":{"name":"MemoryAllocator*","uid":"vk::MemoryAllocator"}}],"docs":{"text":"Re-points the pass and its buffers at `allocator`.\n\n Every `vk::Memory` captures the allocator address it was created from, so a\n host that builds its allocator inside a struct and returns that struct by value\n leaves those pointers dangling \u2014 freeing through one reads a garbage device.\n `Renderer` does exactly that, and calls this at the top of every frame.\n\n A host whose allocator never moves does not need this."}},{"name":"upload","kind":"method","uid":"cui::vulkan::CanvasPass.upload","file":"src/vulkan/canvas_pass.c3:259:21","return_type":{"name":"void?"},"members":[{"name":"self","type":{"name":"CanvasPass*","uid":"cui::vulkan::CanvasPass"},"is_ref":true},{"name":"ui","type":{"name":"Ui*","uid":"cui::Ui"}},{"name":"window_size","type":{"name":"Vec2","uid":"std::math::vector::Vec2"}}],"docs":{"text":"Flush the Ui and move everything that changed to the GPU.\n\n Call once per submitted frame, outside a render pass \u2014 it may idle the GPU to\n grow a buffer, and it may rebuild the pipeline when the texture count changed.\n\n Not safe to call until the host has waited for the frame `CANVAS_SLOTS`\n submissions back: this writes mapped memory with no barrier of any kind, and\n the copy it advances to is only free because that frame has finished with it.\n Calling it twice for one submitted frame breaks the same guarantee, since the\n second call moves on to a copy that is still in flight.\n\n This calls `ui.flush()` itself, bracketed by the two glyph-atlas syncs it has\n to sit between: the atlas texture must exist before the first `Painter.text`\n caches a drawing with its handle, and glyphs baked during paint must reach the\n GPU before the draw that samples them. Getting that order wrong is the classic\n embedding bug, so the order is not the host's to get wrong.","params":[{"name":"ui","description":"The Ui to flush and upload."},{"name":"window_size","description":"Logical surface size. Re-uploads the uniform block when it changes."}]}},{"name":"record","kind":"method","uid":"cui::vulkan::CanvasPass.record","file":"src/vulkan/canvas_pass.c3:335:21","return_type":{"name":"void?"},"members":[{"name":"self","type":{"name":"CanvasPass*","uid":"cui::vulkan::CanvasPass"},"is_ref":true},{"name":"command_buffer","type":{"name":"CommandBuffer","uid":"vk::CommandBuffer"}},{"name":"extent","type":{"name":"Extent2D","uid":"vk::Extent2D"}}],"docs":{"text":"Record the interface into a command buffer, inside an already-begun render pass.\n\n Binds its own pipeline, pushes its own descriptors and push constants, and sets\n no dynamic state beyond what it is given \u2014 the host's viewport and scissor are\n used as they stand, so scissoring the UI to a sub-rect is the host's call.\n\n A frame with nothing to draw records nothing.","params":[{"name":"command_buffer","description":"Inside a begun render pass whose attachments match the formats this pass was created with."},{"name":"extent","description":"Unused today; taken so a host that scissors per pass has somewhere obvious to say so, and so the signature matches SceneRecorder."}]}},{"name":"load_image","kind":"method","uid":"cui::vulkan::CanvasPass.load_image","file":"src/vulkan/canvas_pass.c3:384:29","return_type":{"name":"Texture?","uid":"cui::Texture"},"members":[{"name":"self","type":{"name":"CanvasPass*","uid":"cui::vulkan::CanvasPass"},"is_ref":true},{"name":"path","type":{"name":"String"}}],"docs":{"text":"Uploads an image file (png/jpg) to the GPU and returns the handle to reference\n it with (`RectStyle.texture` / `CircleStyle.texture`).\n\n Textures can be loaded at any time; ones loaded between frames become valid on\n the next `upload`, which rebuilds the pipeline for the new sampler count.","return":"The texture handle.","params":[{"name":"path","description":"Path to a png or jpg file."}]}},{"name":"load_pixels","kind":"method","uid":"cui::vulkan::CanvasPass.load_pixels","file":"src/vulkan/canvas_pass.c3:402:29","return_type":{"name":"Texture?","uid":"cui::Texture"},"members":[{"name":"self","type":{"name":"CanvasPass*","uid":"cui::vulkan::CanvasPass"},"is_ref":true},{"name":"rgba","type":{"name":"char[]"}},{"name":"width","type":{"name":"uint"}},{"name":"height","type":{"name":"uint"}}],"docs":{"text":"Uploads raw RGBA8 pixels (a generated atlas, say) and returns the handle to\n reference them with.","return":"The texture handle.","params":[{"name":"rgba","description":"Tightly packed RGBA8 pixels, width * height * 4 bytes."},{"name":"width","description":"Image width in pixels."},{"name":"height","description":"Image height in pixels."}]}},{"name":"free","kind":"method","uid":"cui::vulkan::CanvasPass.free","file":"src/vulkan/canvas_pass.c3:414:20","return_type":{"name":"void"},"members":[{"name":"self","type":{"name":"CanvasPass*","uid":"cui::vulkan::CanvasPass"},"is_ref":true}],"docs":{"text":"Destroys everything this pass created. The device, queue and allocator are the\n host's and are left alone."}},{"name":"sync_text","kind":"method","uid":"cui::vulkan::CanvasPass.sync_text","file":"src/vulkan/canvas_pass.c3:451:21","return_type":{"name":"void?"},"members":[{"name":"self","type":{"name":"CanvasPass*","uid":"cui::vulkan::CanvasPass"},"is_ref":true},{"name":"ui","type":{"name":"Ui*","uid":"cui::Ui"}},{"name":"creating","type":{"name":"bool"}}],"docs":{"text":"Keeps the GPU copy of the Ui's glyph atlas in step with the CPU one.\n\n Before `flush` (with `creating` true): once the Ui has fonts, the atlas texture\n is created up front \u2014 paint caches drawings with the texture handle baked in,\n so the handle must exist before the first `Painter.text` runs. After `flush`\n (`creating` false): re-upload the pixels whenever glyph baking marked them\n dirty, so glyphs painted this frame are sampled this frame.","params":[{"name":"ui","description":"The Ui whose text system to sync."},{"name":"creating","description":"True for the pre-flush texture-creation step."}]}},{"name":"rebuild_pipeline","kind":"method","uid":"cui::vulkan::CanvasPass.rebuild_pipeline","file":"src/vulkan/canvas_pass.c3:478:21","return_type":{"name":"void?"},"members":[{"name":"self","type":{"name":"CanvasPass*","uid":"cui::vulkan::CanvasPass"},"is_ref":true}],"docs":{"text":"(Re)creates the descriptor layout and pipeline for the current texture count.\n\n Runs before the first frame and again whenever `load_image` grew the texture\n array; the GPU is idled first, since in-flight frames still use the old\n pipeline."}},{"name":"ensure_capacity","kind":"method","uid":"cui::vulkan::CanvasPass.ensure_capacity","file":"src/vulkan/canvas_pass.c3:557:21","return_type":{"name":"void?"},"members":[{"name":"self","type":{"name":"CanvasPass*","uid":"cui::vulkan::CanvasPass"},"is_ref":true},{"name":"buffer","type":{"name":"Memory*","uid":"vk::Memory"}},{"name":"needed","type":{"name":"sz","uid":"std::core::sz"}}],"docs":{"text":"Grows a device-address buffer to fit `needed` bytes, doubling so growth is rare.\n\n The GPU is idled first: frames in flight may still read the old buffer. The\n address is re-pushed every frame, so nothing else needs to know it moved.","params":[{"name":"buffer","description":"The buffer to grow in place. Freed and reallocated when it is too small."},{"name":"needed","description":"The size the next upload needs, in bytes."}]}},{"name":"createDepthTexture","kind":"method","uid":"cui::vulkan::DescriptorImageInfo.createDepthTexture","file":"src/vulkan/render_state.c3:280:30","return_type":{"name":"void?"},"members":[{"name":"self","type":{"name":"DescriptorImageInfo*","uid":"vk::DescriptorImageInfo"},"is_ref":true},{"name":"allocator","type":{"name":"MemoryAllocator*","uid":"vk::MemoryAllocator"}},{"name":"queue","type":{"name":"DeviceQueue","uid":"vk::DeviceQueue"}},{"name":"size","type":{"name":"Vec2","uid":"std::math::vector::Vec2"}},{"name":"format","type":{"name":"Format","uid":"vk::Format"}},{"name":"out_image","type":{"name":"Image*","uid":"vk::Image"},"default_value":"null"}],"docs":{"params":[{"name":"out_image","description":"Receives the created image, which the caller then owns: a DescriptorImageInfo carries only the sampler and the view, so nothing else can destroy it."}]}},{"name":"free","kind":"method","uid":"cui::vulkan::RenderState.free","file":"src/vulkan/render_state.c3:387:21","return_type":{"name":"void"},"members":[{"name":"self","type":{"name":"RenderState","uid":"cui::vulkan::RenderState"}},{"name":"device","type":{"name":"Device","uid":"vk::Device"}}],"docs":null},{"name":"build","kind":"method","uid":"cui::vulkan::RenderState.build","file":"src/vulkan/render_state.c3:393:29","return_type":{"name":"RenderState?","uid":"cui::vulkan::RenderState"},"members":[{"name":"self","type":{"name":"RenderState*","uid":"cui::vulkan::RenderState"},"is_ref":true},{"name":"device","type":{"name":"Device","uid":"vk::Device"}}],"docs":null},{"name":"loadPath","kind":"method","uid":"cui::vulkan::List{DescriptorImageInfo}.loadPath","file":"src/vulkan/render_state.c3:15:27","return_type":{"name":"void?"},"members":[{"name":"self","type":{"name":"List{DescriptorImageInfo}*","uid":"std::collections::list::List{DescriptorImageInfo}"},"is_ref":true},{"name":"path","type":{"name":"String"}},{"name":"allocator","type":{"name":"MemoryAllocator*","uid":"vk::MemoryAllocator"}},{"name":"queue","type":{"name":"DeviceQueue","uid":"vk::DeviceQueue"}},{"name":"out_image","type":{"name":"Image*","uid":"vk::Image"},"default_value":"null"}],"docs":{"params":[{"name":"out_image","description":"Receives the created image, which the caller then owns: a DescriptorImageInfo carries only the sampler and the view, so nothing else can destroy it."}]}},{"name":"load_rgba","kind":"method","uid":"cui::vulkan::List{DescriptorImageInfo}.load_rgba","file":"src/vulkan/render_state.c3:35:27","return_type":{"name":"void?"},"members":[{"name":"self","type":{"name":"List{DescriptorImageInfo}*","uid":"std::collections::list::List{DescriptorImageInfo}"},"is_ref":true},{"name":"rgba","type":{"name":"char[]"}},{"name":"width","type":{"name":"uint"}},{"name":"height","type":{"name":"uint"}},{"name":"allocator","type":{"name":"MemoryAllocator*","uid":"vk::MemoryAllocator"}},{"name":"queue","type":{"name":"DeviceQueue","uid":"vk::DeviceQueue"}},{"name":"out_image","type":{"name":"Image*","uid":"vk::Image"},"default_value":"null"}],"docs":{"params":[{"name":"out_image","description":"Receives the created image, which the caller then owns: a DescriptorImageInfo carries only the sampler and the view, so nothing else can destroy it."}]}},{"name":"load_atlas","kind":"method","uid":"cui::vulkan::List{DescriptorImageInfo}.load_atlas","file":"src/vulkan/render_state.c3:155:27","return_type":{"name":"void?"},"members":[{"name":"self","type":{"name":"List{DescriptorImageInfo}*","uid":"std::collections::list::List{DescriptorImageInfo}"},"is_ref":true},{"name":"pixels","type":{"name":"char[]"}},{"name":"width","type":{"name":"uint"}},{"name":"height","type":{"name":"uint"}},{"name":"allocator","type":{"name":"MemoryAllocator*","uid":"vk::MemoryAllocator"}},{"name":"queue","type":{"name":"DeviceQueue","uid":"vk::DeviceQueue"}},{"name":"out_image","type":{"name":"Image*","uid":"vk::Image"}}],"docs":{"text":"Creates the dynamic glyph-atlas texture: single-channel R8 with linear\n filtering (an SDF must be sampled with interpolation), TRANSFER_DST so its\n contents can be re-uploaded as glyphs are baked in. The vk::Image is returned\n through `out_image` for those later `update_atlas_image` calls."}},{"name":"create_swapchain","kind":"method","uid":"cui::vulkan::Renderer.create_swapchain","file":"src/vulkan/renderer.c3:469:19","return_type":{"name":"void?"},"members":[{"name":"self","type":{"name":"Renderer*","uid":"cui::vulkan::Renderer"},"is_ref":true}],"docs":{"text":"Build the swapchain, its image views and the depth attachment at `self.extent`.\n\n Everything here is sized by that extent and by nothing else, which is what makes\n a resize `destroy_swapchain` + this. The per-image semaphores and command\n buffers are NOT built here: they are sized by `swapchain_image_count`, which is\n settled once in `new`.\n\n **The caller owns the ordering.** On a rebuild the device must be idle and the\n previous swapchain already destroyed; at creation the allocator must exist, since\n the depth image's memory comes from it."}},{"name":"destroy_swapchain","kind":"method","uid":"cui::vulkan::Renderer.destroy_swapchain","file":"src/vulkan/renderer.c3:532:18","return_type":{"name":"void"},"members":[{"name":"self","type":{"name":"Renderer*","uid":"cui::vulkan::Renderer"},"is_ref":true}],"docs":{"text":"Destroy everything `create_swapchain` made, leaving the lists empty and ready to\n be filled again.\n\n **The device must be idle.** Every object here can be in flight in a frame that\n has been submitted, and none of them is reference-counted by the driver."}},{"name":"load_image","kind":"method","uid":"cui::vulkan::Renderer.load_image","file":"src/vulkan/renderer.c3:554:27","return_type":{"name":"Texture?","uid":"cui::Texture"},"members":[{"name":"self","type":{"name":"Renderer*","uid":"cui::vulkan::Renderer"},"is_ref":true},{"name":"path","type":{"name":"String"}}],"docs":{"text":"Uploads an image file (png/jpg) to the GPU and returns the handle to reference\n it with (`RectStyle.texture` / `CircleStyle.texture`).\n\n Forwards to the CanvasPass, which is where the texture array lives.","return":"The texture handle.","params":[{"name":"path","description":"Path to a png or jpg file."}]}},{"name":"load_pixels","kind":"method","uid":"cui::vulkan::Renderer.load_pixels","file":"src/vulkan/renderer.c3:573:27","return_type":{"name":"Texture?","uid":"cui::Texture"},"members":[{"name":"self","type":{"name":"Renderer*","uid":"cui::vulkan::Renderer"},"is_ref":true},{"name":"rgba","type":{"name":"char[]"}},{"name":"width","type":{"name":"uint"}},{"name":"height","type":{"name":"uint"}}],"docs":{"text":"Uploads raw RGBA8 pixels (a generated atlas, say) and returns the handle to\n reference them with.","return":"The texture handle.","params":[{"name":"rgba","description":"Tightly packed RGBA8 pixels, width * height * 4 bytes."},{"name":"width","description":"Image width in pixels."},{"name":"height","description":"Image height in pixels."}]}},{"name":"free","kind":"method","uid":"cui::vulkan::Renderer.free","file":"src/vulkan/renderer.c3:584:18","return_type":{"name":"void"},"members":[{"name":"self","type":{"name":"Renderer*","uid":"cui::vulkan::Renderer"},"is_ref":true}],"docs":{"text":"Idles the GPU, then tears down everything `new` created: buffers, textures,\n swapchain, pipeline, device, window. The Ui is separate \u2014 free it with\n `Ui.free`."}},{"name":"frame","kind":"method","uid":"cui::vulkan::Renderer.frame","file":"src/vulkan/renderer.c3:683:19","return_type":{"name":"bool?"},"members":[{"name":"self","type":{"name":"Renderer*","uid":"cui::vulkan::Renderer"},"is_ref":true},{"name":"ui","type":{"name":"Ui*","uid":"cui::Ui"}}],"docs":{"text":"Runs one frame: poll input, dispatch to the widgets, flush the Ui, record the\n canvas and present.\n\n The app owns the loop; per-frame logic goes in the body, reading `ui.input`\n directly:\n\n     `while (renderer.frame(ui)!!)`\n     `{`\n     `    // app/game logic \u2014 mutations made here render on the next call`\n     `}`\n\n In ON_DEMAND mode the call blocks for input when nothing scheduled a frame, so\n the loop body only runs when frames do \u2014 a game simulation that must tick every\n iteration wants CONTINUOUS.","return":"False when the user asked to quit (ESCAPE or window close).","params":[{"name":"ui","description":"The Ui to drive. Its size tracks the window across resizes."}]}},{"name":"surface_extent","kind":"method","uid":"cui::vulkan::Renderer.surface_extent","file":"src/vulkan/renderer.c3:973:23","return_type":{"name":"Extent2D?","uid":"vk::Extent2D"},"members":[{"name":"self","type":{"name":"Renderer*","uid":"cui::vulkan::Renderer"},"is_ref":true}],"docs":{"text":"The window's framebuffer size right now, in physical pixels.\n\n Read off the surface rather than off the window, because it is the surface the\n swapchain has to agree with and the two can disagree for a frame while a resize\n settles.\n\n A surface that declines to say \u2014 Wayland answers `0xFFFFFFFF`, meaning \"whatever\n the swapchain asks for\" \u2014 gets the extent already in use, so the caller sees no\n change and nothing is rebuilt. Resizing there needs the window's own size, which\n c3w does not report.","return":"The surface's current extent, or the one in use where it has no answer."}},{"name":"rebuild_surface","kind":"method","uid":"cui::vulkan::Renderer.rebuild_surface","file":"src/vulkan/renderer.c3:1001:19","return_type":{"name":"void?"},"members":[{"name":"self","type":{"name":"Renderer*","uid":"cui::vulkan::Renderer"},"is_ref":true},{"name":"ui","type":{"name":"Ui*","uid":"cui::Ui"}}],"docs":{"text":"Rebuild the swapchain for the window's current size and re-lay the interface out\n in it.\n\n The one path a resize takes, whether it was noticed by the poll at the top of\n `frame()` or reported as `ERROR_OUT_OF_DATE_KHR` by the acquire or the present.\n The device is idled first: every image and view about to be destroyed can be in\n flight.\n\n `pixel_ratio` is kept rather than re-sampled, and the logical size derived from\n it, so `Ui.size` and the framebuffer stay two views of one number. A window\n dragged onto a display of a different density therefore keeps the density it was\n opened at \u2014 the layer's `contentsScale` is set once too, so that is the honest\n answer rather than a stale one.\n\n **Only callable between frames.** Nothing may be recorded or in flight against\n the swapchain this replaces; `frame()`'s three call sites are all outside a\n command buffer.","params":[{"name":"ui","description":"Re-laid out at the new logical size, and asked for the frame that redraws into the new images."}]}},{"name":"request_screenshot","kind":"method","uid":"cui::vulkan::Renderer.request_screenshot","file":"src/vulkan/renderer.c3:1049:18","return_type":{"name":"void"},"members":[{"name":"self","type":{"name":"Renderer*","uid":"cui::vulkan::Renderer"},"is_ref":true},{"name":"path","type":{"name":"String"}}],"docs":{"text":"Write the next completed frame to `path` as a PNG.\n\n The grab is serviced inside the next `frame()`, between the render pass ending\n and the present, because a presentable image may only be touched between\n vkAcquireNextImageKHR and vkQueuePresentKHR.\n\n This reads the rendered image rather than grabbing the OS window, so the result\n is exact: native framebuffer resolution, no title bar, no compositor colour\n management, and identical frame for frame. That is what makes it usable for\n before/after comparison and for checking a render from a script.\n\n One request is outstanding at a time; a second call before the first is\n serviced replaces it. `path` is copied.","params":[{"name":"path","description":"Where to write the PNG. Copied, so a temporary is fine."}]}},{"name":"record_screenshot_copy","kind":"method","uid":"cui::vulkan::Renderer.record_screenshot_copy","file":"src/vulkan/renderer.c3:1062:25","return_type":{"name":"Memory?","uid":"vk::Memory"},"members":[{"name":"self","type":{"name":"Renderer*","uid":"cui::vulkan::Renderer"},"is_ref":true},{"name":"command_buffer","type":{"name":"CommandBuffer","uid":"vk::CommandBuffer"}},{"name":"image_index","type":{"name":"uint"}}],"docs":{"text":"Record the image-to-buffer copy into the frame's own command buffer.\n\n The image arrives in COLOR_ATTACHMENT_OPTIMAL and is handed back in it, so\n frame()'s usual present barrier still applies unchanged."}},{"name":"write_screenshot","kind":"method","uid":"cui::vulkan::Renderer.write_screenshot","file":"src/vulkan/renderer.c3:1128:19","return_type":{"name":"void?"},"members":[{"name":"self","type":{"name":"Renderer*","uid":"cui::vulkan::Renderer"},"is_ref":true},{"name":"readback","type":{"name":"Memory","uid":"vk::Memory"}},{"name":"path","type":{"name":"String"}}],"docs":{"text":"Swizzle the mapped copy into RGBA and write the PNG."}}],"types":[{"name":"CanvasPass","kind":"struct","uid":"cui::vulkan::CanvasPass","file":"src/vulkan/canvas_pass.c3:42:8","members":[{"name":"camera","type":{"name":"Camera","uid":"cui::camera::Camera"}},{"name":"device","type":{"name":"Device","uid":"vk::Device"}},{"name":"queue","type":{"name":"DeviceQueue","uid":"vk::DeviceQueue"}},{"name":"allocator","type":{"name":"MemoryAllocator*","uid":"vk::MemoryAllocator"}},{"name":"canvas_buffers","type":{"name":"Memory[2]","uid":"vk::Memory"}},{"name":"transform_buffers","type":{"name":"Memory[2]","uid":"vk::Memory"}},{"name":"clip_buffers","type":{"name":"Memory[2]","uid":"vk::Memory"}},{"name":"uniform_buffers","type":{"name":"Memory[2]","uid":"vk::Memory"}},{"name":"slot","type":{"name":"uint"}},{"name":"drawings_revision","type":{"name":"uint"}},{"name":"transforms_revision","type":{"name":"uint"}},{"name":"clips_revision","type":{"name":"uint"}},{"name":"drawings_in_slot","type":{"name":"uint[2]"}},{"name":"transforms_in_slot","type":{"name":"uint[2]"}},{"name":"clips_in_slot","type":{"name":"uint[2]"}},{"name":"textures","type":{"name":"DescriptorImages","uid":"cui::vulkan::DescriptorImages"}},{"name":"texture_images","type":{"name":"ImageList","uid":"vk::ImageList"}},{"name":"atlas_image","type":{"name":"Image","uid":"vk::Image"}},{"name":"pipeline","type":{"name":"RenderState","uid":"cui::vulkan::RenderState"}},{"name":"descriptor_layout","type":{"name":"DescriptorSetLayout","uid":"vk::DescriptorSetLayout"}},{"name":"pipeline_texture_count","type":{"name":"sz","uid":"std::core::sz"}},{"name":"color_format","type":{"name":"Format","uid":"vk::Format"}},{"name":"depth_format","type":{"name":"Format","uid":"vk::Format"}},{"name":"uniform_size","type":{"name":"Vec2","uid":"std::math::vector::Vec2"}},{"name":"draw_count","type":{"name":"sz","uid":"std::core::sz"}}],"docs":{"text":"A cui interface as a single render pass contribution.\n\n Create with `new_canvas_pass`, feed with `upload`, draw with `record`, release\n with `free`. Textures come from `load_image` / `load_pixels`."}},{"name":"DescriptorImages","kind":"alias","uid":"cui::vulkan::DescriptorImages","file":"src/vulkan/render_state.c3:8:7","base_type":{"name":"List{DescriptorImageInfo}","uid":"std::collections::list::List{DescriptorImageInfo}"},"members":[],"docs":null},{"name":"ShaderStageConfig","kind":"struct","uid":"cui::vulkan::ShaderStageConfig","file":"src/vulkan/render_state.c3:360:8","members":[{"name":"spirv","type":{"name":"char[]"}},{"name":"entry","type":{"name":"ZString","uid":"std::core::string::ZString"}},{"name":"stage","type":{"name":"ShaderStageFlagBits","uid":"vk::ShaderStageFlagBits"}}],"docs":null},{"name":"RenderState","kind":"struct","uid":"cui::vulkan::RenderState","file":"src/vulkan/render_state.c3:366:8","members":[{"name":"shaders","type":{"name":"ShaderStageConfig[]","uid":"cui::vulkan::ShaderStageConfig"}},{"name":"descriptor_layout","type":{"name":"DescriptorSetLayout","uid":"vk::DescriptorSetLayout"}},{"name":"pipeline_layout","type":{"name":"PipelineLayout","uid":"vk::PipelineLayout"}},{"name":"pipeline","type":{"name":"Pipeline","uid":"vk::Pipeline"}},{"name":"topology","type":{"name":"PrimitiveTopology","uid":"vk::PrimitiveTopology"}},{"name":"polygon_mode","type":{"name":"PolygonMode","uid":"vk::PolygonMode"}},{"name":"cull_mode","type":{"name":"CullModeFlagBits","uid":"vk::CullModeFlagBits"}},{"name":"front_face","type":{"name":"FrontFace","uid":"vk::FrontFace"}},{"name":"enable_depth","type":{"name":"bool"}},{"name":"color_attachments","type":{"name":"Format[]","uid":"vk::Format"}},{"name":"depth_format","type":{"name":"Format","uid":"vk::Format"}},{"name":"blend_attachments","type":{"name":"PipelineColorBlendAttachmentState[]","uid":"vk::PipelineColorBlendAttachmentState"}},{"name":"dynamic_states","type":{"name":"DynamicState[]","uid":"vk::DynamicState"}},{"name":"push_constants","type":{"name":"PushConstantRange[]","uid":"vk::PushConstantRange"}}],"docs":null},{"name":"FILE_NOT_FOUND","kind":"fault","uid":"cui::vulkan::FILE_NOT_FOUND","file":"src/vulkan/render_state.c3:10:10","members":[],"docs":null},{"name":"SceneRecorder","kind":"alias","uid":"cui::vulkan::SceneRecorder","file":"src/vulkan/renderer.c3:97:7","return_type":{"name":"void?"},"members":[{"name":"ctx","type":{"name":"void*"}},{"name":"cmd","type":{"name":"CommandBuffer","uid":"vk::CommandBuffer"}},{"name":"extent","type":{"name":"Extent2D","uid":"vk::Extent2D"}}],"docs":null},{"name":"Renderer","kind":"struct","uid":"cui::vulkan::Renderer","file":"src/vulkan/renderer.c3:105:8","members":[{"name":"canvas","type":{"name":"CanvasPass","uid":"cui::vulkan::CanvasPass"}},{"name":"window_size","type":{"name":"Vec2","uid":"std::math::vector::Vec2"}},{"name":"extent","type":{"name":"Extent2D","uid":"vk::Extent2D"}},{"name":"pixel_ratio","type":{"name":"float"}},{"name":"window","type":{"name":"Window","uid":"c3w::Window"}},{"name":"frame_clock","type":{"name":"Clock","uid":"std::time::Clock"}},{"name":"applied_cursor","type":{"name":"Cursor","uid":"cui::Cursor"}},{"name":"key_scratch","type":{"name":"List{Key}","uid":"std::collections::list::List{Key}"}},{"name":"loop_mode","type":{"name":"LoopMode","uid":"cui::vulkan::LoopMode"}},{"name":"scene","type":{"name":"SceneRecorder","uid":"cui::vulkan::SceneRecorder"}},{"name":"scene_ctx","type":{"name":"void*"}},{"name":"clear_color","type":{"name":"float[4]"}},{"name":"quit_on_escape","type":{"name":"bool"}},{"name":"instance","type":{"name":"Instance","uid":"vk::Instance"}},{"name":"debug_messenger","type":{"name":"DebugUtilsMessengerEXT","uid":"vk::DebugUtilsMessengerEXT"}},{"name":"physical_device","type":{"name":"PhysicalDevice","uid":"vk::PhysicalDevice"}},{"name":"graphics_queue","type":{"name":"DeviceQueue","uid":"vk::DeviceQueue"}},{"name":"device","type":{"name":"Device","uid":"vk::Device"}},{"name":"allocator","type":{"name":"MemoryAllocator","uid":"vk::MemoryAllocator"}},{"name":"depth_texture","type":{"name":"DescriptorImageInfo","uid":"vk::DescriptorImageInfo"}},{"name":"depth_image","type":{"name":"Image","uid":"vk::Image"}},{"name":"wait_semaphores","type":{"name":"SemaphoreList","uid":"vk::SemaphoreList"}},{"name":"signal_semaphores","type":{"name":"SemaphoreList","uid":"vk::SemaphoreList"}},{"name":"frame_fences","type":{"name":"FenceList","uid":"vk::FenceList"}},{"name":"depth_format","type":{"name":"Format","uid":"vk::Format"}},{"name":"command_pool","type":{"name":"CommandPool","uid":"vk::CommandPool"}},{"name":"command_buffers","type":{"name":"CommandBufferList","uid":"vk::CommandBufferList"}},{"name":"surface","type":{"name":"SurfaceKHR","uid":"vk::SurfaceKHR"}},{"name":"swapchain","type":{"name":"SwapchainKHR","uid":"vk::SwapchainKHR"}},{"name":"swapchain_views","type":{"name":"ImageViewList","uid":"vk::ImageViewList"}},{"name":"swapchain_images","type":{"name":"ImageList","uid":"vk::ImageList"}},{"name":"surface_format","type":{"name":"SurfaceFormatKHR","uid":"vk::SurfaceFormatKHR"}},{"name":"swapchain_usage","type":{"name":"ImageUsageFlags","uid":"vk::ImageUsageFlags"}},{"name":"swapchain_image_count","type":{"name":"uint"}},{"name":"frame_index","type":{"name":"uint"}},{"name":"enable_debug","type":{"name":"bool"}},{"name":"screenshot_path","type":{"name":"String"}},{"name":"screenshot_pending","type":{"name":"bool"}},{"name":"screenshot_supported","type":{"name":"bool"}}],"docs":{"text":"The window, the Vulkan device and everything the frame loop needs \u2014 plus one\n `CanvasPass`, which owns everything about drawing the interface itself.\n\n Create with `new`, release with `free`."}},{"name":"LoopMode","kind":"enum","uid":"cui::vulkan::LoopMode","file":"src/vulkan/renderer.c3:66:6","base_type":{"name":"int"},"members":[{"name":"CONTINUOUS","type":{"name":"LoopMode","uid":"cui::vulkan::LoopMode"},"docs":null},{"name":"ON_DEMAND","type":{"name":"LoopMode","uid":"cui::vulkan::LoopMode"},"docs":null}],"docs":{"text":"How the reference frame loop paces itself.\n\n - CONTINUOUS \u2014 redraw every frame, poll input, run at the refresh rate of the\n   display (FIFO present) forever. Lowest latency; a core stays busy. Right when\n   something is always animating.\n - ON_DEMAND \u2014 after a frame, if nothing scheduled another (`ui.frame_requested`\n   is clear), block for input: the thread sleeps at 0% CPU until the user does\n   something. Right for mostly-static desktop UIs. A running animation keeps\n   scheduling frames, so it still plays smoothly; the loop only sleeps once\n   everything settles."}},{"name":"SCREENSHOT_UNSUPPORTED","kind":"fault","uid":"cui::vulkan::SCREENSHOT_UNSUPPORTED","file":"src/vulkan/renderer.c3:1030:10","members":[],"docs":null}],"variables":[{"name":"SYSTEM_VULKAN","kind":"constant","uid":"cui::vulkan::SYSTEM_VULKAN","file":"src/vulkan/vendored.c3:38:12","visibility":"private","type":{"name":"bool"},"is_const":true,"value":"false","members":[],"docs":{"text":"The opt-out, for using a Vulkan of your own instead of the one vulkan.c3l\n ships. Build with `-D SYSTEM_VULKAN` (or add the feature to project.json) and\n cui stops looking for bundled candidates: `vk::init()` falls back to the\n platform default loader names, and the installed loader finds an installed\n driver exactly as it normally would."}},{"name":"CANVAS_SLOTS","kind":"constant","uid":"cui::vulkan::CANVAS_SLOTS","file":"src/vulkan/canvas_pass.c3:118:7","is_const":true,"value":"2","members":[],"docs":{"text":"How many copies of each host-visible buffer the pass rotates through.\n\n These buffers are mapped and written with a plain memcpy, and the shader reads\n them by device address for the whole of a queued frame. Writing the one copy a\n frame still on the GPU is reading tears it: the draw picks up some entries from\n the frame being submitted and some from the frame before, and a `Drawing` whose\n `kind` arrived from its successor is a glyph painted as a filled rect \u2014 white\n flecks over text and borders, worst where the display list is largest and the\n frames come fastest. So each upload goes to a different copy from the last.\n\n Two suffices for a host that keeps two frames in flight, which is what\n `Renderer` does. The contract a host has to keep, whatever its depth:\n\n - one `upload` per submitted frame, and\n - before calling it, wait for the frame CANVAS_SLOTS submissions back.\n\n With N copies, the frame that last wrote the copy `upload` is about to write is\n the one N submissions ago; waiting for it is what makes the copy free. A host\n that keeps more frames in flight than this must raise it to match."}},{"name":"INITIAL_DRAWINGS","kind":"constant","uid":"cui::vulkan::INITIAL_DRAWINGS","file":"src/vulkan/canvas_pass.c3:123:7","is_const":true,"value":"64","members":[],"docs":null},{"name":"INITIAL_TRANSFORMS","kind":"constant","uid":"cui::vulkan::INITIAL_TRANSFORMS","file":"src/vulkan/canvas_pass.c3:124:7","is_const":true,"value":"16","members":[],"docs":null},{"name":"INITIAL_CLIPS","kind":"constant","uid":"cui::vulkan::INITIAL_CLIPS","file":"src/vulkan/canvas_pass.c3:125:7","is_const":true,"value":"16","members":[],"docs":null},{"name":"MAX_FRAMES_IN_FLIGHT","kind":"constant","uid":"cui::vulkan::MAX_FRAMES_IN_FLIGHT","file":"src/vulkan/renderer.c3:32:7","is_const":true,"value":"2","members":[],"docs":null},{"name":"DEFAULT_TITLE","kind":"constant","uid":"cui::vulkan::DEFAULT_TITLE","file":"src/vulkan/renderer.c3:37:7","is_const":true,"value":"cui","members":[],"docs":null},{"name":"MAX_FRAME_DT","kind":"constant","uid":"cui::vulkan::MAX_FRAME_DT","file":"src/vulkan/renderer.c3:52:13","type":{"name":"float"},"is_const":true,"value":"0.1","members":[],"docs":{"text":"Upper bound on a frame delta, in seconds. A stall \u2014 or waking from an on-demand\n sleep after minutes idle \u2014 must not hand animations one enormous step. Also the\n usual spiral-of-death guard."}}]},"cui::widgets":{"is_generic":false,"docs":{"text":"Dialogs: a titled panel floating over the interface, dragged by its bar and\n dismissed from its own close button \u2014 an about box, a preferences sheet, a key\n reference.\n\n It escapes its parent's rect the same way a dropdown does: hit testing recurses\n into children without clipping to the parent, so the panel is simply a child\n bigger than the element holding it (see menu.c3). What a dialog adds over a\n PopupPanel is the chrome and the behaviour a window has and a menu does not \u2014\n a bar to move it by, a close button, ESC, and the option of blocking everything\n behind it.\n\n The content is a builder rather than children: `Dialog.body` is the\n `ViewBuilder` shape `AreaView` takes, called each time the dialog opens. The\n subtree it returns is released wholesale on close, so anything the content must\n remember across a close belongs on the app (reached with `ui.inherit`) \u2014 the\n composite rule from build.md.\n\n Data is borrowed like everywhere else here: the title string and the style must\n outlive the widget."},"functions":[{"name":"confirm_body","kind":"function","uid":"cui::widgets::confirm_body","file":"src/widgets/confirm_dialog.c3:242:13","visibility":"local","return_type":{"name":"Element*","uid":"cui::Element"},"members":[{"name":"ui","type":{"name":"Ui*","uid":"cui::Ui"}},{"name":"ctx","type":{"name":"any"}}],"docs":{"text":"The content: the question, then the two answers.\n\n Asserted rather than checked: `ConfirmDialog.build` is the only thing that\n sets this, and it passes its own element. A cast that fails here means the\n widget was rewired, not that a caller got something wrong.","params":[{"name":"ctx","description":"The ConfirmDialog's element, which is how the row reaches the callbacks."}]}},{"name":"wrap_line","kind":"function","uid":"cui::widgets::wrap_line","file":"src/widgets/confirm_dialog.c3:289:11","visibility":"local","return_type":{"name":"String"},"members":[{"name":"ui","type":{"name":"Ui*","uid":"cui::Ui"}},{"name":"text","type":{"name":"String"}},{"name":"font","type":{"name":"FontId","uid":"cui::FontId"}},{"name":"size","type":{"name":"float"}},{"name":"width","type":{"name":"float"}}],"docs":{"text":"The longest prefix of `text` that fits in `width`, broken at a space.\n\n Falls back to the whole of the first word when even that word is too wide: a\n line that cannot be made to fit is better overflowing than looped over\n forever, and there is nothing else to break at.","return":"A prefix of the text, never empty unless the text itself is."}},{"name":"confirm_dismissed","kind":"function","uid":"cui::widgets::confirm_dismissed","file":"src/widgets/confirm_dialog.c3:313:9","visibility":"local","return_type":{"name":"void"},"members":[{"name":"ui","type":{"name":"Ui*","uid":"cui::Ui"}},{"name":"ctx","type":{"name":"any"}}],"docs":nu ition folded together.\n\n **Guarded on the focus**, and that guard is the whole safety of it \u2014\n `Input.text` is per-frame global state and is not routed to anybody, so a field\n that did not check would type along with whichever one the user is really in."}},{"name":"tick_repeat","kind":"method","uid":"cui::widgets::TextField.tick_repeat","file":"src/widgets/text_field.c3:404:19","return_type":{"name":"void"},"members":[{"name":"self","type":{"name":"TextField*","uid":"cui::widgets::TextField"},"is_ref":true},{"name":"elem","type":{"name":"Element*","uid":"cui::Element"}},{"name":"dt","type":{"name":"float"}}],"docs":{"text":"Advances the auto-repeat clock and fires the repeats that are due.\n\n The field runs this clock itself because cui reports key edges, not repeats:\n `on_key` sees one down per press however long it is held. What it repeats is\n whatever `apply` did for the press, re-read from the live modifier state, so\n adding Shift partway through a held arrow starts extending the selection from\n there.\n\n **Asks for a frame while a key is held.** An embedder in ON_DEMAND mode parks\n the thread when nothing is scheduled, and a held key generates no events to\n wake it \u2014 without this the repeat would stall between its own ticks."}},{"name":"on_key","kind":"method","uid":"cui::widgets::TextField.on_key","file":"src/widgets/text_field.c3:440:19","return_type":{"name":"bool"},"members":[{"name":"self","type":{"name":"TextField*","uid":"cui::widgets::TextField"},"is_ref":true},{"name":"elem","type":{"name":"Element*","uid":"cui::Element"}},{"name":"event","type":{"name":"KeyEvent","uid":"cui::KeyEvent"}}],"docs":{"text":"Editing keys, and the refusal that keeps the rest of the application out.\n\n Everything is consumed except ESC and TAB. The keys this switch does not name\n are not ignored \u2014 they are swallowed, because they are about to arrive as text\n in `update` and an application that also keeps them as shortcuts would act on\n them twice. See the note at the top of this file.","return":"True for every key except ESC and TAB, whether or not it did anything."}},{"name":"apply","kind":"method","uid":"cui::widgets::TextField.apply","file":"src/widgets/text_field.c3:478:19","return_type":{"name":"bool"},"members":[{"name":"self","type":{"name":"TextField*","uid":"cui::widgets::TextField"},"is_ref":true},{"name":"elem","type":{"name":"Element*","uid":"cui::Element"}},{"name":"key","type":{"name":"Key","uid":"cui::Key"}}],"docs":{"text":"Runs one editing key, whether it was just pressed or is repeating.\n\n Shift is read from the frame rather than passed in, so a repeat follows the\n modifier as it is now: adding Shift to a held arrow starts extending the\n selection, letting go of it goes back to moving the caret.","return":"True if this was a key the field edits with; false is a key that will arrive as text instead."}},{"name":"delete_key","kind":"method","uid":"cui::widgets::TextField.delete_key","file":"src/widgets/text_field.c3:512:19","return_type":{"name":"void"},"members":[{"name":"self","type":{"name":"TextField*","uid":"cui::widgets::TextField"},"is_ref":true},{"name":"key","type":{"name":"Key","uid":"cui::Key"}}],"docs":null},{"name":"move_caret","kind":"method","uid":"cui::widgets::TextField.move_caret","file":"src/widgets/text_field.c3:535:19","return_type":{"name":"void"},"members":[{"name":"self","type":{"name":"TextField*","uid":"cui::widgets::TextField"},"is_ref":true},{"name":"key","type":{"name":"Key","uid":"cui::Key"}},{"name":"extend","type":{"name":"bool"}}],"docs":{"text":"One caret movement.","params":[{"name":"extend","description":"Keep the anchor, growing or shrinking the selection; false collapses it onto the caret."}]}},{"name":"on_mouse","kind":"method","uid":"cui::widgets::TextField.on_mouse","file":"src/widgets/text_field.c3:591:19","return_type":{"name":"bool"},"members":[{"name":"self","type":{"name":"TextField*","uid":"cui::widgets::TextField"},"is_ref":true},{"name":"
