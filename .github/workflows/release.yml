name: Release

on:
  push:
    tags:
      - "v*" # e.g. v0.1.0 — releases are cut from tags, not from every push
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to (re)build the release from, e.g. v0.1.0"
        required: true

env:
  C3C_VERSION: v0.8.3
  # The four libraries a consumer installs next to cui.c3l -- cui names them in
  # manifest.json "dependencies" and vendors none of them.
  #
  # window, image and font are plain source repos, each already a .c3l at its
  # root, and a consumer adds them as submodules. CI has nothing to add a
  # submodule to, so it clones -- same tree, and c3c reads a .c3l directory just
  # as happily as a zip.
  WINDOW_C3_REPO: https://github.com/tonis2/Window.c3.git
  IMAGE_C3_REPO: https://github.com/tonis2/image.c3.git
  FONT_C3_REPO: https://github.com/tonis2/font.c3.git
  # vk is the exception: its release carries the prebuilt macOS loader + driver
  # dylibs, which are not in the repo, so a clone would not do. It finds them
  # itself, which is why cui.c3l ships neither.
  VULKAN_C3L_URL: https://github.com/tonis2/Vulkan.c3/releases/download/latest/vulkan.c3l

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "name=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "name=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.tag.outputs.name }}

      - name: Build cui.c3l
        # Nothing is compiled or downloaded here: a release is just a zip of the
        # files that were tested as-is -- manifest.json plus src/, and that is
        # all. cui vendors nothing.
        #
        # c3w, image, font and vk are named in manifest.json "dependencies" and
        # installed by the consumer next to cui.c3l. They used to be submodules
        # zipped in under lib/, and the manifest compiled them from there. That
        # meant a project already using c3w or image -- an engine, say --
        # compiled those modules twice and collided, and every consumer was
        # pinned to whichever commit cui happened to hold.
        #
        # One artifact serves every platform, and every byte of it is source:
        # nothing links against Vulkan -- the vk bindings dlopen the loader at
        # runtime. The macOS loader + driver dylibs are vulkan.c3l's to ship. It
        # locates them relative to its own sources (vk::c3l_root, from the
        # compile-time $$FILEPATH), so a copy inside cui.c3l would sit somewhere
        # that macro never looks.
        run: |
          set -e
          # project.json is excluded on purpose: it is how cui builds *itself*
          # (its test targets, against the lib/ submodules). A consumer builds
          # through manifest.json, and a stray project.json in the tree is
          # confusing at best.
          zip -qr cui.c3l manifest.json LICENSE README.md src -x '*.git*'

          # No dependency may ride along -- vendoring is the bug this layout
          # removes, and 3 MB of Vulkan loader + driver is the worst case of it.
          # A developer running this same command locally has lib/ populated;
          # CI does not. The guard covers both.
          if unzip -l cui.c3l | grep -iE ' lib/|\.dylib|\.a$|\.lib$'; then
            echo "cui.c3l must carry only its own sources"; exit 1
          fi

          # The manifest is only as good as the paths behind it: a missing source
          # tree here is a broken release that would otherwise reach the verify
          # job as a confusing compile error.
          for p in manifest.json src/shaders/shader.spv; do
            unzip -l cui.c3l | grep -q " $p" || { echo "missing from artifact: $p"; exit 1; }
          done

      - name: Upload cui.c3l
        uses: actions/upload-artifact@v4
        with:
          name: cui.c3l
          path: cui.c3l
          if-no-files-found: error

  # Prove the artifact builds on every platform before publishing it, against the
  # released vulkan.c3l a consumer would actually pair it with -- so a mismatch
  # between the two fails the release instead of shipping a .c3l nobody can build
  # against. Building is the whole test -- the runners have no GPU, so nothing
  # is run. No Vulkan SDK is installed on any runner: nothing links against
  # Vulkan, which is itself part of what is being verified.
  verify:
    needs: package
    strategy:
      fail-fast: true
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Fetch cui.c3l
        uses: actions/download-artifact@v4
        with:
          name: cui.c3l
          path: consumer/lib

      - name: Fetch the dependencies cui names
        # This is the install a README reader performs, run verbatim: if cui's
        # manifest names a library the consumer cannot get, the release fails
        # here rather than in someone's project.
        shell: bash
        run: |
          set -e
          git clone --depth 1 "$WINDOW_C3_REPO" consumer/lib/window.c3l
          git clone --depth 1 "$IMAGE_C3_REPO"  consumer/lib/image.c3l
          git clone --depth 1 "$FONT_C3_REPO"   consumer/lib/font.c3l
          curl -fsSL "$VULKAN_C3L_URL" -o consumer/lib/vulkan.c3l

      - name: Install C3
        shell: bash
        run: |
          case "${{ runner.os }}" in
            Linux)   curl -fsSL "https://github.com/c3lang/c3c/releases/download/${C3C_VERSION}/c3-linux.tar.gz" -o c3.tgz && tar xzf c3.tgz ;;
            macOS)   curl -fsSL "https://github.com/c3lang/c3c/releases/download/${C3C_VERSION}/c3-macos.zip"    -o c3.zip && unzip -q c3.zip ;;
            Windows) curl -fsSL "https://github.com/c3lang/c3c/releases/download/${C3C_VERSION}/c3-windows.zip"  -o c3.zip && unzip -q c3.zip ;;
          esac
          chmod +x c3/c3c || true
          echo "$PWD/c3" >> "$GITHUB_PATH"

      - name: Consumer project depending on cui and what cui depends on
        shell: bash
        run: |
          mkdir -p consumer/src
          # A dependency is resolved by the manifest's "provides", not by the
          # file name: vulkan.c3l provides "vk" and window.c3l provides "c3w".
          #
          # All five are listed even though cui's manifest already names four of
          # them, because c3c 0.8 does not pull a transitive dependency in on its
          # own -- it only checks that a library the manifest names is among the
          # ones the project listed. Drop "font" here and the build stops with
          # "Required library 'font' could not be found". Keep this list and the
          # README's in step.
          cat > consumer/project.json <<'EOF'
          {
            "langrev": "1",
            "warnings": [ "no-unused" ],
            "dependency-search-paths": [ "lib" ],
            "dependencies": [ "cui", "vk", "c3w", "image", "font" ],
            "sources": [ "src/**" ],
            "output": "build",
            "targets": { "smoke": { "type": "executable" } }
          }
          EOF
          # Referencing the renderer forces vk and c3w to compile -- with no Vulkan
          # SDK on the runner, which is exactly what is being verified.
          cat > consumer/src/main.c3 <<'EOF'
          module smoke;
          import cui;
          import cui::widgets;
          import cui::vulkan;

          fn int main()
          {
          	void* renderer_entry = (void*)&cui::vulkan::new;
          	Constraints c = { .min = { 0, 0 }, .max = { 320, 240 } };
          	Rectangle r = { .size = { 10, 10 } };
          	return renderer_entry == null ? 1 : (int)cui::clamp_size(r.size, c).x;
          }
          EOF

      - name: Build against cui.c3l
        shell: bash
        working-directory: consumer
        run: c3c build smoke

      - name: No Vulkan dylib dependency (macOS)
        if: runner.os == 'macOS'
        working-directory: consumer
        run: |
          # The loader is dlopened at runtime, never linked, so a macOS app must
          # not reference any Vulkan dylib -- the loader + driver vulkan.c3l
          # bundles are found through its own candidate paths instead.
          if otool -L build/smoke | grep -iE 'vulkan|moltenvk'; then
            echo "unexpected Vulkan dylib dependency"; exit 1
          fi
          echo "self-contained: no Vulkan dylib dependency"

  release:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the release, and push the regenerated docs

    steps:
      - name: Resolve tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "name=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "name=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Build the docs from the tagged commit. c3w, image and font live in
          # lib/*.c3l as submodules and docgen has to compile them; vk is not a
          # submodule and is downloaded in the next step. Full history so the
          # docs commit can land on main.
          ref: ${{ steps.tag.outputs.name }}
          submodules: recursive
          fetch-depth: 0

      - name: Fetch cui.c3l
        uses: actions/download-artifact@v4
        with:
          name: cui.c3l

      - name: Install C3
        run: |
          curl -fsSL "https://github.com/c3lang/c3c/releases/download/${C3C_VERSION}/c3-linux.tar.gz" -o c3.tar.gz
          tar xzf c3.tar.gz
          echo "$PWD/c3" >> "$GITHUB_PATH"

      - name: Fetch vulkan.c3l
        # vk is not a submodule (see the packaging job), but docgen still has to
        # compile src/vulkan/*.c3, so install it the same way a consumer does.
        # c3c reads a .c3l as a zip, so the downloaded file needs no unpacking.
        run: curl -fsSL "$VULKAN_C3L_URL" -o lib/vulkan.c3l

      - name: Publish docs to main
        # The tag checkout is a detached HEAD, so the docs commit is made on main
        # explicitly. GitHub Pages serves main's /docs folder.
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git checkout -B main origin/main
          mkdir -p docs
          cp "$RUNNER_TEMP/index.html" docs/index.html
          if [ -n "$(git status --porcelain docs)" ]; then
            git add docs
            git commit -m "docs: API reference for ${{ steps.tag.outputs.name }} [skip ci]"
            git push origin main
          else
            echo "docs unchanged"
          fi

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.name }}
          name: ${{ steps.tag.outputs.name }}
          files: cui.c3l
          generate_release_notes: true
