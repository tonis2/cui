Style"}}],"docs":null},{"name":"mount","kind":"method","uid":"cui::widgets::FileBrowser.mount","file":"src/widgets/file_browser.c3:156:21","return_type":{"name":"void"},"members":[{"name":"self","type":{"name":"FileBrowser*","uid":"cui::widgets::FileBrowser"},"is_ref":true},{"name":"elem","type":{"name":"Element*","uid":"cui::Element"}}],"docs":null},{"name":"unmount","kind":"method","uid":"cui::widgets::FileBrowser.unmount","file":"src/widgets/file_browser.c3:179:21","return_type":{"name":"void"},"members":[{"name":"self","type":{"name":"FileBrowser*","uid":"cui::widgets::FileBrowser"},"is_ref":true},{"name":"elem","type":{"name":"Element*","uid":"cui::Element"}}],"docs":null},{"name":"drop_entries","kind":"method","uid":"cui::widgets::FileBrowser.drop_entries","file":"src/widgets/file_browser.c3:186:21","return_type":{"name":"void"},"members":[{"name":"self","type":{"name":"FileBrowser*","uid":"cui::widgets::FileBrowser"},"is_ref":true}],"docs":null},{"name":"go_to","kind":"method","uid":"cui::widgets::FileBrowser.go_to","file":"src/widgets/file_browser.c3:206:21","return_type":{"name":"void"},"members":[{"name":"self","type":{"name":"FileBrowser*","uid":"cui::widgets::FileBrowser"},"is_ref":true},{"name":"elem","type":{"name":"Element*","uid":"cui::Element"}},{"name":"directory","type":{"name":"String"}}],"docs":{"text":"List `directory` and show it, dropping the selection.\n\n A missing or unreadable directory lists as empty rather than raising: a browser\n is how a user recovers from a bad path, so it has to survive being pointed at\n one. The parent row is still offered, which is what gets them back out.\n\n **`directory` may be a view into this browser's own buffer** \u2014 walking up hands\n in a slice of the very string being replaced, which is `activate`'s only way of\n saying \"the folder above this one\". It is copied before anything is cleared, so\n callers need not know.","params":[{"name":"directory","description":"A trailing separator is trimmed. Relative paths are listed as given."}]}},{"name":"rescan","kind":"method","uid":"cui::widgets::FileBrowser.rescan","file":"src/widgets/file_browser.c3:234:21","return_type":{"name":"void"},"members":[{"name":"self","type":{"name":"FileBrowser*","uid":"cui::widgets::FileBrowser"},"is_ref":true}],"docs":{"text":"Re-read the current directory. Directories first, each group in name order.\n\n The caller owns nothing: names are copied into the browser's own allocator and\n released by the next rescan or by `unmount`."}},{"name":"path_of","kind":"method","uid":"cui::widgets::FileBrowser.path_of","file":"src/widgets/file_browser.c3:289:23","return_type":{"name":"String"},"members":[{"name":"self","type":{"name":"FileBrowser*","uid":"cui::widgets::FileBrowser"},"is_ref":true},{"name":"row","type":{"name":"int"}}],"docs":{"text":"The absolute path of row `row`, or an empty string for the parent row and for a\n row that does not exist.\n\n The parent has no path of its own here because it is not an entry \u2014 it is a\n move, and `activate` is where it is made.\n\n The string is temporary: it lives in the temp allocator and is gone at the end\n of the current scope."}},{"name":"entry_at_name","kind":"method","uid":"cui::widgets::FileBrowser.entry_at_name","file":"src/widgets/file_browser.c3:303:20","return_type":{"name":"int"},"members":[{"name":"self","type":{"name":"FileBrowser*","uid":"cui::widgets::FileBrowser"},"is_ref":true},{"name":"name","type":{"name":"String"}}],"docs":{"text":"Which row lists an entry of this name, or -1 for none.\n\n Names, not paths \u2014 how a caller says \"select the file I just wrote\" without\n knowing where the listing put it, and how a test says \"click the models\n folder\" without depending on what else is beside it."}},{"name":"rows","kind":"method","uid":"cui::widgets::FileBrowser.rows","file":"src/widgets/file_browser.c3:315:20","return_type":{"name":"usz","uid":"std::core::usz"},"members":[{"name":"self","type":{"name":"FileBrowser*","uid":"cui::widgets::FileBrowser"},"is_ref":true}],"docs":{"text":"How many rows the listing has, the parent row included."}},{"name":"count","kind":"method","uid":"cui::widgets::FileBrowser.count","file":"src/widgets/file_browser.c3:319:20","return_type":{"name":"usz","uid":"std::core::usz"},"members":[{"name":"self","type":{"name":"FileBrowser*","uid":"cui::widgets::FileBrowser"},"is_ref":true}],"docs":null},{"name":"entry_index","kind":"method","uid":"cui::widgets::FileBrowser.entry_index","file":"src/widgets/file_browser.c3:326:20","return_type":{"name":"usz","uid":"std::core::usz"},"members":[{"name":"self","type":{"name":"FileBrowser*","uid":"cui::widgets::FileBrowser"},"is_ref":true},{"name":"row","type":{"name":"int"}}],"docs":{"text":"A row's index into `entries`, or `count()` \u2014 one past the end \u2014 for the parent\n row and for a row that is not there. Callers test against `count()` rather than\n against a magic number, so there is nothing to keep in step."}},{"name":"activate","kind":"method","uid":"cui::widgets::FileBrowser.activate","file":"src/widgets/file_browser.c3:341:21","return_type":{"name":"void"},"members":[{"name":"self","type":{"name":"FileBrowser*","uid":"cui::widgets::FileBrowser"},"is_ref":true},{"name":"elem","type":{"name":"Element*","uid":"cui::Element"}},{"name":"row","type":{"name":"int"}}],"docs":{"text":"Do what row `row` is for: walk into a directory, go up from the parent row, or\n hand a file to `on_choose`.\n\n Selecting and activating are separate on purpose \u2014 a single click must not\n leave the directory the user is reading."}},{"name":"layout","kind":"method","uid":"cui::widgets::FileBrowser.layout","file":"src/widgets/file_browser.c3:361:21","return_type":{"name":"Vec2","uid":"std::math::vector::Vec2"},"members":[{"name":"self","type":{"name":"FileBrowser*","uid":"cui::widgets::FileBrowser"},"is_ref":true},{"name":"elem","type":{"name":"Element*","uid":"cui::Element"}},{"name":"constraints","type":{"name":"Constraints","uid":"cui::Constraints"}}],"docs":null},{"name":"paint","kind":"method","uid":"cui::widgets::FileBrowser.paint","file":"src/widgets/file_browser.c3:367:21","return_type":{"name":"void"},"members":[{"name":"self","type":{"name":"FileBrowser*","uid":"cui::widgets::FileBrowser"},"is_ref":true},{"name":"elem","type":{"name":"Element*","uid":"cui::Element"}},{"name":"painter","type":{"name":"Painter*","uid":"cui::Painter"}}],"docs":null},{"name":"row_at","kind":"method","uid":"cui::widgets::FileBrowser.row_at","file":"src/widgets/file_browser.c3:432:20","return_type":{"name":"int"},"members":[{"name":"self","type":{"name":"FileBrowser*","uid":"cui::widgets::FileBrowser"},"is_ref":true},{"name":"elem","type":{"name":"Element*","uid":"cui::Element"}},{"name":"pos","type":{"name":"Vec2","uid":"std::math::vector::Vec2"}}],"docs":{"text":"Which row a point is in, or -1 for none. Shared by paint's hover highlight and\n `on_mouse`, so the two cannot disagree about where a row starts."}},{"name":"on_mouse","kind":"method","uid":"cui::widgets::FileBrowser.on_mouse","file":"src/widgets/file_browser.c3:441:21","return_type":{"name":"bool"},"members":[{"name":"self","type":{"name":"FileBrowser*","uid":"cui::widgets::FileBrowser"},"is_ref":true},{"name":"elem","type":{"name":"Element*","uid":"cui::Element"}},{"name":"event","type":{"name":"MouseEvent","uid":"cui::MouseEvent"}}],"docs":null},{"name":"on_hover","kind":"method","uid":"cui::widgets::FileBrowser.on_hover","file":"src/widgets/file_browser.c3:478:21","return_type":{"name":"void"},"members":[{"name":"self","type":{"name":"FileBrowser*","uid":"cui::widgets::FileBrowser"},"is_ref":true},{"name":"elem","type":{"name":"Element*","uid":"cui::Element"}},{"name":"entered","type":{"name":"bool"}}],"docs":null},{"name":"on_key","kind":"method","uid":"cui::widgets::FileBrowser.on_key","file":"src/widgets/file_browser.c3:492:21","return_type":{"name":"bool"},"members":[{"name":"self","type":{"name":"FileBrowser*","uid":"cui::widgets::FileBrowser"},"is_ref":true},{"name":"elem","type":{"name":"Element*","uid":"cui::Element"}},{"name":"event","type":{"name":"KeyEvent","uid":"cui::KeyEvent"}}],"docs":{"text":"Arrow keys move the selection, Return activates it.\n\n Everything else is declined, so a dialog's ESC and an application's shortcuts\n still reach them \u2014 unlike `TextField`, a browser is not typing anything and has\n no claim on the keyboard beyond these three."}}],"types":[{"name":"DialogStyle","kind":"struct","uid":"cui::widgets::DialogStyle","file":"src/widgets/dialog.c3:32:8","members":[{"name":"panel_color","type":{"name":"Color","uid":"cui::Color"}},{"name":"panel_border","type":{"name":"Color","uid":"cui::Color"}},{"name":"title_color","type":{"name":"Color","uid":"cui::Color"}},{"name":"text_color","type":{"name":"Color","uid":"cui::Color"}},{"name":"dim_color","type":{"name":"Color","uid":"cui::Color"}},{"name":"hover_color","type":{"name":"Color","uid":"cui::Color"}},{"name":"scrim_color","type":{"name":"Color","uid":"cui::Color"}},{"name":"font","type":{"name":"FontId","uid":"cui::FontId"}},{"name":"text_size","type":{"name":"float"}},{"name":"title_height","type":{"name":"float"}},{"name":"pad_x","type":{"name":"float"}},{"name":"pad_y","type":{"name":"float"}},{"name":"radius","type":{"name":"float"}},{"name":"shadow","type":{"name":"float"}},{"name":"min_width","type":{"name":"float"}}],"docs":{"text":"One look for a dialog. Pass a complete style or none at all: a zero\n `title_height` means \"use DEFAULT_DIALOG_STYLE wholesale\", and a partially\n filled style is not merged field-by-field \u2014 the MenuStyle convention."}},{"name":"ViewBuilderCtx","kind":"alias","uid":"cui::widgets::ViewBuilderCtx","file":"src/widgets/dialog.c3:104:7","return_type":{"name":"Element*","uid":"cui::Element"},"members":[{"name":"ui","type":{"name":"Ui*","uid":"cui::Ui"}},{"name":"ctx","type":{"name":"any"}}],"docs":null},{"name":"OnDialogClose","kind":"alias","uid":"cui::widgets::OnDialogClose","file":"src/widgets/dialog.c3:108:7","return_type":{"name":"void"},"members":[{"name":"ui","type":{"name":"Ui*","uid":"cui::Ui"}},{"name":"ctx","type":{"name":"any"}}],"docs":null},{"name":"Dialog","kind":"struct","uid":"cui::widgets::Dialog","file":"src/widgets/dialog.c3:139:8","interfaces":[{"name":"Widget","uid":"cui::Widget"}],"members":[{"name":"title","type":{"name":"String"}},{"name":"body","type":{"name":"ViewBuilder","uid":"cui::widgets::ViewBuilder"}},{"name":"body_ctx","type":{"name":"ViewBuilderCtx","uid":"cui::widgets::ViewBuilderCtx"}},{"name":"ctx","type":{"name":"any"}},{"name":"style","type":{"name":"DialogStyle","uid":"cui::widgets::DialogStyle"}},{"name":"open","type":{"name":"bool"}},{"name":"modal","type":{"name":"bool"}},{"name":"close_outside","type":{"name":"bool"}},{"name":"on_close","type":{"name":"OnClick","uid":"cui::widgets::OnClick"}},{"name":"on_close_ctx","type":{"name":"OnDialogClose","uid":"cui::widgets::OnDialogClose"}},{"name":"at","type":{"name":"Vec2","uid":"std::math::vector::Vec2"}},{"name":"placed","type":{"name":"bool"}}],"docs":{"text":"A floating titled panel.\n\n Mount one wherever it should sit in the paint order \u2014 later siblings still\n paint over it, so a dialog built before an app's menu bar keeps that bar's\n dropdowns on top \u2014 and toggle it with `set_open` / `toggle`. Closed it is a\n zero-size element that paints nothing and cannot be hit, so a dialog can live\n in the tree from startup and cost a layout call per frame it changes.\n\n Placement: centred on its screen (`Element.media`, so a dialog inside a split\n pane centres on the pane) until it is dragged, then wherever it was left,\n always clamped to stay on that screen. Because the panel is placed against the\n element's `absolute` \u2014 the previous emit's value \u2014 a dialog whose own element\n moves lags one frame behind it; mount it somewhere that does not move, as\n popups here already are.\n\n Modal (`modal`) makes the element itself the backdrop: it covers what it\n blocks, dims it with `scrim_color`, and swallows the presses that land on it.\n Non-modal, the rest of the window stays live and the dialog is just on top.\n\n Keys: ESC closes an open dialog. Focus moves here when it opens, which is what\n puts ESC in reach; every other key is declined and bubbles to whatever the app\n keeps its shortcuts on, so a dialog does not take the keyboard hostage.\n\n Note for anyone adding state: this widget implements `paint`, so\n `request_paint` does NOT route to `request_build` on it (see\n `Element.request_paint`). Anything that changes what the dialog *contains* has\n to request a build \u2014 `set_open` does."}},{"name":"DialogFrame","kind":"struct","uid":"cui::widgets::DialogFrame","file":"src/widgets/dialog.c3:321:8","interfaces":[{"name":"Widget","uid":"cui::Widget"}],"members":[{"name":"style","type":{"name":"DialogStyle","uid":"cui::widgets::DialogStyle"}},{"name":"min_width","type":{"name":"float"}}],"docs":{"text":"The panel: background, border, shadow, and the title bar stacked over the body.\n Internal \u2014 Dialog builds it.\n\n A widget of its own rather than a PopupPanel wrapping a Column, because the\n width is negotiated in both directions: the body is measured first, the bar is\n then stretched to whatever the body needs, and both are floored by the minimum\n the bar's own title and button need. A Column would leave the bar wrapping its\n text in the middle of a wide panel.\n\n It consumes clicks on its chrome for the reason PopupPanel does, with a sharper\n edge here: a press that fell through the panel would reach the modal backdrop\n underneath and dismiss the dialog the user was aiming at."}},{"name":"DialogTitleBar","kind":"struct","uid":"cui::widgets::DialogTitleBar","file":"src/widgets/dialog.c3:380:8","interfaces":[{"name":"Widget","uid":"cui::Widget"}],"members":[{"name":"title","type":{"name":"String"}},{"name":"style","type":{"name":"DialogStyle","uid":"cui::widgets::DialogStyle"}},{"name":"host","type":{"name":"Element*","uid":"cui::Element"}},{"name":"dragging","type":{"name":"bool"}},{"name":"grab","type":{"name":"Vec2","uid":"std::math::vector::Vec2"}}],"docs":{"text":"The bar across the top: the title, the close button in it, and the grip the\n whole dialog moves by. Internal.\n\n A drag writes the position onto the Dialog rather than onto this element. The\n position belongs to the dialog \u2014 it is what the panel is clamped and re-placed\n from, and it has to survive the rebuild that this bar does not."}},{"name":"DialogCloseButton","kind":"struct","uid":"cui::widgets::DialogCloseButton","file":"src/widgets/dialog.c3:473:8","interfaces":[{"name":"Widget","uid":"cui::Widget"}],"members":[{"name":"style","type":{"name":"DialogStyle","uid":"cui::widgets::DialogStyle"}},{"name":"host","type":{"name":"Element*","uid":"cui::Element"}},{"name":"hovered","type":{"name":"bool"}}],"docs":{"text":"The \u00d7 at the right end of the title bar. Internal."}},{"name":"ConfirmButtonStyle","kind":"struct","uid":"cui::widgets::ConfirmButtonStyle","file":"src/widgets/confirm_dialog.c3:38:8","members":[{"name":"fill","type":{"name":"Color","uid":"cui::Color"}},{"name":"hover","type":{"name":"Color","uid":"cui::Color"}},{"name":"press","type":{"name":"Color","uid":"cui::Color"}},{"name":"accent","type":{"name":"Color","uid":"cui::Color"}},{"name":"text","type":{"name":"Color","uid":"cui::Color"}},{"name":"accent_text","type":{"name":"Color","uid":"cui::Color"}},{"name":"font","type":{"name":"FontId","uid":"cui::FontId"}},{"name":"text_size","type":{"name":"float"}},{"name":"height","type":{"name":"float"}},{"name":"pad_x","type":{"name":"float"}},{"name":"gap","type":{"name":"float"}},{"name":"radius","type":{"name":"float"}}],"docs":{"text":"How the two buttons look. Zero `height` means the defaults wholesale, the\n MenuStyle convention \u2014 a partially filled style is not merged field by field."}},{"name":"ConfirmDialog","kind":"struct","uid":"cui::widgets::ConfirmDialog","file":"src/widgets/confirm_dialog.c3:94:8","interfaces":[{"name":"Widget","uid":"cui::Widget"}],"members":[{"name":"title","type":{"name":"String"}},{"name":"confirm_label","type":{"name":"String"}},{"name":"decline_label","type":{"name":"String"}},{"name":"style","type":{"name":"DialogStyle","uid":"cui::widgets::DialogStyle"}},{"name":"buttons","type":{"name":"ConfirmButtonStyle","uid":"cui::widgets::ConfirmButtonStyle"}},{"name":"message","type":{"name":"DString","uid":"std::core::dstring::DString"}},{"name":"on_confirm","type":{"name":"OnClick","uid":"cui::widgets::OnClick"}},{"name":"on_decline","type":{"name":"OnClick","uid":"cui::widgets::OnClick"}},{"name":"open_when_built","type":{"name":"bool"}},{"name":"answering","type":{"name":"bool"}}],"docs":{"text":"The panel. Everything but `message`, `on_confirm` and `on_decline` is\n configured where the node is declared; those three arrive with the question.\n\n Strings are borrowed as everywhere else here \u2014 except `message`, which is\n copied, because the whole point is that it comes from a temporary."}},{"name":"ConfirmActions","kind":"struct","uid":"cui::widgets::ConfirmActions","file":"src/widgets/confirm_dialog.c3:330:8","visibility":"local","interfaces":[{"name":"Widget","uid":"cui::Widget"}],"members":[{"name":"host","type":{"name":"Element*","uid":"cui::Element"}},{"name":"style","type":{"name":"ConfirmButtonStyle","uid":"cui::widgets::ConfirmButtonStyle"}},{"name":"font","type":{"name":"FontId","uid":"cui::FontId"}},{"name":"lit","type":{"name":"int"}},{"name":"held","type":{"name":"int"}},{"name":"decline_x","type":{"name":"float"}},{"name":"decline_w","type":{"name":"float"}},{"name":"confirm_x","type":{"name":"float"}},{"name":"confirm_w","type":{"name":"float"}}],"docs":{"text":"The two buttons, painted and hit-tested by one widget.\n\n Not a Row of `Button`s, for the reason this whole file exists: `OnClick` is a\n bare function pointer, so a Button cannot tell its handler which dialog it\n belongs to. One widget holding `host` can, which is the idiom\n `DialogCloseButton` already uses."}},{"name":"OnRow","kind":"alias","uid":"cui::widgets::OnRow","file":"src/widgets/tree.c3:30:7","return_type":{"name":"void"},"members":[{"name":"ui","type":{"name":"Ui*","uid":"cui::Ui"}},{"name":"row","type":{"name":"usz","uid":"std::core::usz"}}],"docs":null},{"name":"TreeStyle","kind":"struct","uid":"cui::widgets::TreeStyle","file":"src/widgets/tree.c3:32:8","members":[{"name":"text","type":{"name":"Color","uid":"cui::Color"}},{"name":"selected","type":{"name":"Color","uid":"cui::Color"}},{"name":"selected_text","type":{"name":"Color","uid":"cui::Color"}},{"name":"hover","type":{"name":"Color","uid":"cui::Color"}},{"name":"trailing","type":{"name":"Color","uid":"cui::Color"}},{"name":"mark","type":{"name":"Color","uid":"cui::Color"}},{"name":"row_height","type":{"name":"float"}},{"name":"text_size","type":{"name":"float"}},{"name":"padding","type":{"name":"float"}},{"name":"indent","type":{"name":"float"}},{"name":"radius","type":{"name":"Vec4","uid":"std::math::vector::Vec4"}}],"docs":null},{"name":"TreeRow","kind":"struct","uid":"cui::widgets::TreeRow","file":"src/widgets/tree.c3:78:8","members":[{"name":"label","type":{"name":"String"}},{"name":"trailing","type":{"name":"String"}},{"name":"depth","type":{"name":"usz","uid":"std::core::usz"}},{"name":"expandable","type":{"name":"bool"}},{"name":"expanded","type":{"name":"bool"}}],"docs":{"text":"One row.\n\n `label` and `trailing` are borrowed and must outlive the widget. `trailing` is\n drawn right-aligned and skipped when empty \u2014 a count beside a category, or\n nothing.\n\n `expanded` is only read when `expandable` is set, and only decides which way the\n disclosure mark points. Nothing is hidden by it here; see this file's header."}},{"name":"Tree","kind":"struct","uid":"cui::widgets::Tree","file":"src/widgets/tree.c3:94:8","interfaces":[{"name":"Widget","uid":"cui::Widget"}],"members":[{"name":"rows","type":{"name":"TreeRow[]","uid":"cui::widgets::TreeRow"}},{"name":"selected","type":{"name":"usz","uid":"std::core::usz"}},{"name":"on_select","type":{"name":"OnRow","uid":"cui::widgets::OnRow"}},{"name":"on_toggle","type":{"name":"OnRow","uid":"cui::widgets::OnRow"}},{"name":"style","type":{"name":"TreeStyle","uid":"cui::widgets::TreeStyle"}},{"name":"lit","type":{"name":"int"}}],"docs":{"text":"An indented list of rows with one selected.\n\n `selected` is a position in `rows`, or past its end for none \u2014 which is what a\n zero-initialised Tree with no rows is, so nothing is selected until something\n says so."}},{"name":"OnSubmit","kind":"alias","uid":"cui::widgets::OnSubmit","file":"src/widgets/text_field.c3:39:7","return_type":{"name":"void"},"members":[{"name":"ui","type":{"name":"Ui*","uid":"cui::Ui"}},{"name":"text","type":{"name":"String"}}],"docs":null},{"name":"OnChange","kind":"alias","uid":"cui::widgets::OnChange","file":"src/widgets/text_field.c3:56:7","return_type":{"name":"void"},"members":[{"name":"ui","type":{"name":"Ui*","uid":"cui::Ui"}},{"name":"text","type":{"name":"String"}}],"docs":null},{"name":"TextFieldStyle","kind":"struct","uid":"cui::widgets::TextFieldStyle","file":"src/widgets/text_field.c3:71:8","members":[{"name":"background","type":{"name":"Color","uid":"cui::Color"}},{"name":"border","type":{"name":"Color","uid":"cui::Color"}},{"name":"border_focused","type":{"name":"Color","uid":"cui::Color"}},{"name":"text","type":{"name":"Color","uid":"cui::Color"}},{"name":"placeholder","type":{"name":"Color","uid":"cui::Color"}},{"name":"caret","type":{"name":"Color","uid":"cui::Color"}},{"name":"selection","type":{"name":"Color","uid":"cui::Color"}},{"name":"border_width","type":{"name":"float"}},{"name":"border_radius","type":{"name":"Vec4","uid":"std::math::vector::Vec4"}},{"name":"padding","type":{"name":"Vec2","uid":"std::math::vector::Vec2"}},{"name":"text_size","type":{"name":"float"}},{"name":"caret_width","type":{"name":"float"}}],"docs":{"text":"How a TextField draws. A zero style takes `DEFAULT_TEXT_FIELD_STYLE` whole, the\n all-or-nothing rule `DialogStyle` uses: a partially filled style is not merged\n field by field, because \"the caller left this at zero\" and \"the caller wants\n zero here\" are the same value and cannot be told apart."}},{"name":"TextField","kind":"struct","uid":"cui::widgets::TextField","file":"src/widgets/text_field.c3:110:8","interfaces":[{"name":"Widget","uid":"cui::Widget"}],"members":[{"name":"text","type":{"name":"DString","uid":"std::core::dstring::DString"}},{"name":"placeholder","type":{"name":"String"}},{"name":"on_submit","type":{"name":"OnSubmit","uid":"cui::widgets::OnSubmit"}},{"name":"on_change","type":{"name":"OnChange","uid":"cui::widgets::OnChange"}},{"name":"style","type":{"name":"TextFieldStyle","uid":"cui::widgets::TextFieldStyle"}},{"name":"caret","type":{"name":"usz","uid":"std::core::usz"}},{"name":"anchor","type":{"name":"usz","uid":"std::core::usz"}},{"name":"width","type":{"name":"float"}},{"name":"focused","type":{"name":"bool"}},{"name":"dragging","type":{"name":"bool"}},{"name":"repeat_key","type":{"name":"Key","uid":"cui::Key"}},{"name":"repeat_delay","type":{"name":"float"}}],"docs":null},{"name":"Rectangle","kind":"struct","uid":"cui::widgets::Rectangle","file":"src/widgets/basic.c3:26:8","interfaces":[{"name":"Widget","uid":"cui::Widget"}],"members":[{"name":"size","type":{"name":"Vec2","uid":"std::math::vector::Vec2"}},{"name":"style","type":{"name":"RectStyle","uid":"cui::RectStyle"}}],"docs":{"text":"Leaf with a preferred size and an SDF rect style: fill, border and per-corner\n radii. The workhorse for cards, chips, bars and dividers.\n\n It has no sizing method at all \u2014 the worked example of the size-field\n convention: the `size` field is picked up by the node macros, a set component\n is pixels and a zero component fills the parent, per axis."}},{"name":"Column","kind":"struct","uid":"cui::widgets::Column","file":"src/widgets/basic.c3:112:8","interfaces":[{"name":"Widget","uid":"cui::Widget"}],"members":[{"name":"gap","type":{"name":"float"}},{"name":"size","type":{"name":"Vec2","uid":"std::math::vector::Vec2"}},{"name":"main_align","type":{"name":"MainAlign","uid":"cui::widgets::MainAlign"}},{"name":"cross_align","type":{"name":"CrossAlign","uid":"cui::widgets::CrossAlign"}}],"docs":{"text":"Stacks children vertically with a gap between them.\n\n By default it wraps its content; a non-zero `size` fixes that axis, and the\n alignments distribute whatever slack the fixed size (or the incoming\n constraints) creates. A wrap-content Column has no slack, so alignment only\n shows when something forces it bigger than its children."}},{"name":"Row","kind":"struct","uid":"cui::widgets::Row","file":"src/widgets/basic.c3:186:8","interfaces":[{"name":"Widget","uid":"cui::Widget"}],"members":[{"name":"gap","type":{"name":"float"}},{"name":"size","type":{"name":"Vec2","uid":"std::math::vector::Vec2"}},{"name":"main_align","type":{"name":"MainAlign","uid":"cui::widgets::MainAlign"}},{"name":"cross_align","type":{"name":"CrossAlign","uid":"cui::widgets::CrossAlign"}}],"docs":{"text":"Stacks children left to right with a gap between them \u2014 the horizontal twin of\n Column, with the same wrap-content and alignment rules."}},{"name":"Insets","kind":"struct","uid":"cui::widgets::Insets","file":"src/widgets/basic.c3:254:8","members":[{"name":"left","type":{"name":"float"}},{"name":"top","type":{"name":"float"}},{"name":"right","type":{"name":"float"}},{"name":"bottom","type":{"name":"float"}}],"docs":{"text":"Per-edge insets in pixels."}},{"name":"Padding","kind":"struct","uid":"cui::widgets::Padding","file":"src/widgets/basic.c3:277:8","interfaces":[{"name":"Widget","uid":"cui::Widget"}],"members":[{"name":"insets","type":{"name":"Insets","uid":"cui::widgets::Insets"}}],"docs":{"text":"Insets around a single child; sizes itself to child + insets. Takes one child\n and ignores any others."}},{"name":"Stack","kind":"struct","uid":"cui::widgets::Stack","file":"src/widgets/basic.c3:314:8","interfaces":[{"name":"Widget","uid":"cui::Widget"}],"members":[{"name":"size","type":{"name":"Vec2","uid":"std::math::vector::Vec2"}}],"docs":{"text":"Absolute container: children are positioned by `Element.set_offset` and sized by\n their own layout under loose constraints. The escape hatch from the\n constraint-driven containers \u2014 and the base for overlays, badges and anything\n animated by moving a handle."}},{"name":"Clip","kind":"struct","uid":"cui::widgets::Clip","file":"src/widgets/basic.c3:345:8","interfaces":[{"name":"Widget","uid":"cui::Widget"}],"members":[{"name":"radii","type":{"name":"Vec4","uid":"std::math::vector::Vec4"}}],"docs":{"text":"Clips the subtree of its single child \u2014 including anything that subtree\n overflows \u2014 to its own bounds, optionally rounded. Sizes itself to the child.\n\n The clip is resolved per fragment in the shader, so rounded corners get the same\n antialiasing as shape edges. Hit testing is gated by the rect: a point in a\n clipped-away rounded corner still hits (corners are visual only, like\n transforms)."}},{"name":"Anchored","kind":"struct","uid":"cui::widgets::Anchored","file":"src/widgets/basic.c3:381:8","interfaces":[{"name":"Widget","uid":"cui::Widget"}],"members":[{"name":"h","type":{"name":"CrossAlign","uid":"cui::widgets::CrossAlign"}},{"name":"v","type":{"name":"CrossAlign","uid":"cui::widgets::CrossAlign"}},{"name":"margin","type":{"name":"Vec2","uid":"std::math::vector::Vec2"}}],"docs":{"text":"Pins a single child to a corner, edge or center of whatever space this widget\n is offered, with a margin from the anchored edges. It fills that space itself\n (transparently \u2014 the pointer passes through to what is underneath, though the\n child stays interactive), so the child's position follows every relayout: an\n overlay anchored END/START sits at the top-right of its pane however the pane\n resizes, where a hand-set offset would have to be recomputed by hand."}},{"name":"Scroll","kind":"struct","uid":"cui::widgets::Scroll","file":"src/widgets/basic.c3:453:8","interfaces":[{"name":"Widget","uid":"cui::Widget"}],"members":[{"name":"size","type":{"name":"Vec2","uid":"std::math::vector::Vec2"}},{"name":"scroll_offset","type":{"name":"float"}},{"name":"step","type":{"name":"float"}},{"name":"radii","type":{"name":"Vec4","uid":"std::math::vector::Vec4"}},{"name":"thumb_color","type":{"name":"Color","uid":"cui::Color"}},{"name":"content_extent","type":{"name":"float"}}],"docs":{"text":"A clipped viewport over one child laid out with unbounded height.\n\n Vertical only \u2014 the platform wheel reports a single vertical delta. Takes\n exactly ONE node child (the content); `children[1]` is an internal\n scrollbar-indicator overlay mounted on first layout, so do not append to a\n Scroll.\n\n Wheel events over the viewport move the content; at either end the event is left\n unconsumed, so an enclosing Scroll can take over."}},{"name":"ScrollThumb","kind":"struct","uid":"cui::widgets::ScrollThumb","file":"src/widgets/basic.c3:469:8","interfaces":[{"name":"Widget","uid":"cui::Widget"}],"members":[{"name":"color","type":{"name":"Color","uid":"cui::Color"}},{"name":"visible","type":{"name":"bool"}}],"docs":{"text":"The indicator: a pill at the right edge of the viewport, sized and placed by the\n owning Scroll. Non-interactive \u2014 it shows the scroll position, it does not take\n drags. Mounted internally by Scroll; apps never build one."}},{"name":"OnClick","kind":"alias","uid":"cui::widgets::OnClick","file":"src/widgets/basic.c3:596:7","return_type":{"name":"void"},"members":[{"name":"ui","type":{"name":"Ui*","uid":"cui::Ui"}}],"docs":null},{"name":"Button","kind":"struct","uid":"cui::widgets::Button","file":"src/widgets/basic.c3:606:8","interfaces":[{"name":"Widget","uid":"cui::Widget"}],"members":[{"name":"size","type":{"name":"Vec2","uid":"std::math::vector::Vec2"}},{"name":"style","type":{"name":"RectStyle","uid":"cui::RectStyle"}},{"name":"hover_style","type":{"name":"RectStyle","uid":"cui::RectStyle"}},{"name":"press_style","type":{"name":"RectStyle","uid":"cui::RectStyle"}},{"name":"on_click","type":{"name":"OnClick","uid":"cui::widgets::OnClick"}},{"name":"hovered","type":{"name":"bool"}},{"name":"held","type":{"name":"bool"}},{"name":"label","type":{"name":"String"}},{"name":"label_style","type":{"name":"TextStyle","uid":"cui::TextStyle"}}],"docs":{"text":"A clickable rect with hover and press styles.\n\n Also the worked example of the Widget event callbacks: `on_hover` / `on_mouse`\n mutate state and `request_paint`; `on_click` fires when a left press is released\n inside, and `on_hover` also asks for the hand. And of a widget with no\n `layout` at all: the `size` field sizes it and children fill it."}},{"name":"OnToggle","kind":"alias","uid":"cui::widgets::OnToggle","file":"src/widgets/basic.c3:740:7","return_type":{"name":"void"},"members":[{"name":"ui","type":{"name":"Ui*","uid":"cui::Ui"}},{"name":"checked","type":{"name":"bool"}}],"docs":null},{"name":"CheckboxStyle","kind":"struct","uid":"cui::widgets::CheckboxStyle","file":"src/widgets/basic.c3:748:8","members":[{"name":"color","type":{"name":"Color","uid":"cui::Color"}},{"name":"hover_color","type":{"name":"Color","uid":"cui::Color"}},{"name":"checked_color","type":{"name":"Color","uid":"cui::Color"}},{"name":"mark","type":{"name":"Color","uid":"cui::Color"}},{"name":"text_color","type":{"name":"Color","uid":"cui::Color"}},{"name":"border_radius","type":{"name":"Vec4","uid":"std::math::vector::Vec4"}},{"name":"font","type":{"name":"FontId","uid":"cui::FontId"}},{"name":"text_size","type":{"name":"float"}},{"name":"box","type":{"name":"float"}},{"name":"gap","type":{"name":"float"}},{"name":"thickness","type":{"name":"float"}}],"docs":{"text":"How a Checkbox is drawn.\n\n The MenuStyle convention: a zero `box` means \"use DEFAULT_CHECKBOX_STYLE\n wholesale\", and a partly filled style is not merged field by field."}},{"name":"Checkbox","kind":"struct","uid":"cui::widgets::Checkbox","file":"src/widgets/basic.c3:798:8","interfaces":[{"name":"Widget","uid":"cui::Widget"}],"members":[{"name":"label","type":{"name":"String"}},{"name":"checked","type":{"name":"bool"}},{"name":"on_change","type":{"name":"OnToggle","uid":"cui::widgets::OnToggle"}},{"name":"style","type":{"name":"CheckboxStyle","uid":"cui::widgets::CheckboxStyle"}},{"name":"size","type":{"name":"Vec2","uid":"std::math::vector::Vec2"}},{"name":"hovered","type":{"name":"bool"}},{"name":"held","type":{"name":"bool"}}],"docs":{"text":"A tick box with its label beside it: the boolean sibling of Button.\n\n     `@node((Checkbox) { .label = \"Export rig\", .checked = true, .on_change = &rig_toggled });`\n\n **The box flips itself and then says so.** `on_change` is told the new state\n rather than asked for it, and the widget has already repainted by the time the\n callback runs. That is what makes a tick respond to the click that made it,\n without the caller having to rebuild the subtree around it \u2014 cui has no\n mechanism that would do that on its own. A caller keeping the answer somewhere\n of its own passes it back in as `checked` the next time the panel is built, and\n that copy wins.\n\n **Only the box and the label are clickable**, not the width they were offered:\n the widget sizes itself to its own ink unless `size` says otherwise, so a tick\n in a wide Column does not turn the empty half of the row into a target."}},{"name":"Label","kind":"struct","uid":"cui::widgets::Label","file":"src/widgets/basic.c3:907:8","interfaces":[{"name":"Widget","uid":"cui::Widget"}],"members":[{"name":"text","type":{"name":"String"}},{"name":"font","type":{"name":"FontId","uid":"cui::FontId"}},{"name":"size","type":{"name":"float"}},{"name":"color","type":{"name":"Color","uid":"cui::Color"}}],"docs":{"text":"A single line of SDF text, sized by its font metrics: width = the kerned\n advance of the string, height = ascent - descent. Load a font first with\n `Ui.load_font`; see `cui::TextStyle` for the field semantics.\n\n     ui.@node((Label){ .text = \"Hello\", .size = 20, .color = { 1, 1, 1, 1 } })\n\n A label is **transparent to the pointer**: it is decoration, and its rect is\n usually much larger than the ink in it. Overlay one on a viewport or put one\n inside a Button and the clicks, hover and cursor go to what is underneath, as\n they would in Flutter. Wrap it in a Button (or any widget with `on_mouse`) to\n make text clickable."}},{"name":"MainAlign","kind":"enum","uid":"cui::widgets::MainAlign","file":"src/widgets/basic.c3:50:6","base_type":{"name":"int"},"members":[{"name":"START","type":{"name":"MainAlign","uid":"cui::widgets::MainAlign"},"docs":null},{"name":"CENTER","type":{"name":"MainAlign","uid":"cui::widgets::MainAlign"},"docs":null},{"name":"END","type":{"name":"MainAlign","uid":"cui::widgets::MainAlign"},"docs":null},{"name":"SPACE_BETWEEN","type":{"name":"MainAlign","uid":"cui::widgets::MainAlign"},"docs":null}],"docs":{"text":"How a Column or Row distributes slack along its MAIN axis (vertical for a\n Column, horizontal for a Row)."}},{"name":"CrossAlign","kind":"enum","uid":"cui::widgets::CrossAlign","file":"src/widgets/basic.c3:62:6","base_type":{"name":"int"},"members":[{"name":"START","type":{"name":"CrossAlign","uid":"cui::widgets::CrossAlign"},"docs":null},{"name":"CENTER","type":{"name":"CrossAlign","uid":"cui::widgets::CrossAlign"},"docs":null},{"name":"END","type":{"name":"CrossAlign","uid":"cui::widgets::CrossAlign"},"docs":null}],"docs":{"text":"How a Column or Row aligns children across its CROSS axis (horizontal for a\n Column, vertical for a Row)."}},{"name":"MenuStyle","kind":"struct","uid":"cui::widgets::MenuStyle","file":"src/widgets/menu.c3:26:8","members":[{"name":"bar_color","type":{"name":"Color","uid":"cui::Color"}},{"name":"bar_border","type":{"name":"Color","uid":"cui::Color"}},{"name":"panel_color","type":{"name":"Color","uid":"cui::Color"}},{"name":"panel_border","type":{"name":"Color","uid":"cui::Color"}},{"name":"hover_color","type":{"name":"Color","uid":"cui::Color"}},{"name":"open_color","type":{"name":"Color","uid":"cui::Color"}},{"name":"text_color","type":{"name":"Color","uid":"cui::Color"}},{"name":"dim_color","type":{"name":"Color","uid":"cui::Color"}},{"name":"font","type":{"name":"FontId","uid":"cui::FontId"}},{"name":"text_size","type":{"name":"float"}},{"name":"bar_height","type":{"name":"float"}},{"name":"item_height","type":{"name":"float"}},{"name":"pad_x","type":{"name":"float"}}],"docs":{"text":"One look shared by MenuBar and Select. Pass a complete style or none at all: a\n zero `bar_height` means \"use DEFAULT_MENU_STYLE wholesale\", and a partially\n filled style is not merged field-by-field."}},{"name":"MenuItemFlags","kind":"bitstruct","uid":"cui::widgets::MenuItemFlags","file":"src/widgets/menu.c3:81:11","base_type":{"name":"char"},"members":[{"name":"checked","type":{"name":"bool"},"bit_range":[0,0]},{"name":"disabled","type":{"name":"bool"},"bit_range":[1,1]}],"docs":{"text":"The live state of a dropdown entry, polled through MenuItem.state whenever the\n dropdown is (re)built \u2014 so a check mark set by a keyboard shortcut is already\n right the next time the menu opens, without anyone pushing updates into menu\n data."}},{"name":"MenuQuery","kind":"alias","uid":"cui::widgets::MenuQuery","file":"src/widgets/menu.c3:91:7","return_type":{"name":"MenuItemFlags","uid":"cui::widgets::MenuItemFlags"},"members":[{"name":"ui","type":{"name":"Ui*","uid":"cui::Ui"}}],"docs":null},{"name":"OnSelect","kind":"alias","uid":"cui::widgets::OnSelect","file":"src/widgets/menu.c3:96:7","return_type":{"name":"void"},"members":[{"name":"ui","type":{"name":"Ui*","uid":"cui::Ui"}},{"name":"index","type":{"name":"usz","uid":"std::core::usz"}}],"docs":null},{"name":"MenuItem","kind":"struct","uid":"cui::widgets::MenuItem","file":"src/widgets/menu.c3:105:8","members":[{"name":"label","type":{"name":"String"}},{"name":"shortcut","type":{"name":"String"}},{"name":"on_select","type":{"name":"OnClick","uid":"cui::widgets::OnClick"}},{"name":"state","type":{"name":"MenuQuery","uid":"cui::widgets::MenuQuery"}},{"name":"checked","type":{"name":"bool"}},{"name":"disabled","type":{"name":"bool"}},{"name":"separator","type":{"name":"bool"}}],"docs":{"text":"One dropdown entry. `on_select` receives the Ui, like Button.on_click \u2014 the\n handler reaches the app through `ui.inherit`. When `state` is set it overrides\n the two bools each time the dropdown opens; without it they are read as-is.\n\n A `separator` entry is a divider and every other field is ignored."}},{"name":"Menu","kind":"struct","uid":"cui::widgets::Menu","file":"src/widgets/menu.c3:119:8","members":[{"name":"title","type":{"name":"String"}},{"name":"items","type":{"name":"MenuItem[]","uid":"cui::widgets::MenuItem"}}],"docs":{"text":"One title on the bar and the items under it."}},{"name":"PopupPanel","kind":"struct","uid":"cui::widgets::PopupPanel","file":"src/widgets/menu.c3:137:8","interfaces":[{"name":"Widget","uid":"cui::Widget"}],"members":[{"name":"style","type":{"name":"RectStyle","uid":"cui::RectStyle"}},{"name":"insets","type":{"name":"Insets","uid":"cui::widgets::Insets"}},{"name":"shadow","type":{"name":"float"}},{"name":"shadow_color","type":{"name":"Color","uid":"cui::Color"}}],"docs":{"text":"A floating panel: background, border, drop shadow, insets around one child,\n sized to that child. MenuBar and Select put their lists on one; a dialog or a\n tooltip would use the same widget.\n\n It consumes clicks on its own chrome (padding, separator gaps): a popup is\n above whatever is behind it, and a click that hits its background must not fall\n through to a close-catcher underneath and dismiss the popup mid-aim."}},{"name":"MenuBar","kind":"struct","uid":"cui::widgets::MenuBar","file":"src/widgets/menu.c3:208:8","interfaces":[{"name":"Widget","uid":"cui::Widget"}],"members":[{"name":"menus","type":{"name":"Menu[]","uid":"cui::widgets::Menu"}},{"name":"style","type":{"name":"MenuStyle","uid":"cui::widgets::MenuStyle"}},{"name":"open","type":{"name":"usz","uid":"std::core::usz"}},{"name":"arming","type":{"name":"bool"}},{"name":"armed_at","type":{"name":"Vec2","uid":"std::math::vector::Vec2"}}],"docs":{"text":"An application menu bar: a row of titles, one dropdown open at a time.\n\n A composite. Closed, it builds just the row of titles; open, it builds a\n window-filling Stack holding the titles row and the dropdown panel \u2014 and that\n Stack is itself the click-catcher: a press anywhere that no title or item\n claims bubbles to MenuBar.on_mouse, which closes the menu and consumes the\n press. So while a menu is open the rest of the window is dead, exactly like a\n native menu, and the click that dismisses it does not also act on what it\n landed on. Titles stay live above the catcher, which is what makes clicking\n another title switch menus, and hovering one slide over, Blender-style.\n\n The element reports the BAR's size from layout \u2014 {available width, bar height}\n \u2014 never the built subtree's. The open-state subtree is window-sized, and an\n element that big would win every hit test everywhere even while closed.\n\n The dropdown is placed against the bar's screen (`Element.media`), not simply\n hung under its title: a bar inside a pane too short for the whole menu slides\n it up over itself rather than letting the last items fall off the pane's\n bottom edge, where a clipping pane would cut them off.\n\n Keys: ESC closes an open menu; everything else is declined so it bubbles past\n the bar to whatever the app keeps its shortcuts on.\n\n Ids for tests and tooling: every title and item element is stamped with its own\n title/label via with_id, so `ui.find_id(\"Undo\")` resolves while its menu is\n open."}},{"name":"MenuTitle","kind":"struct","uid":"cui::widgets::MenuTitle","file":"src/widgets/menu.c3:408:8","interfaces":[{"name":"Widget","uid":"cui::Widget"}],"members":[{"name":"title","type":{"name":"String"}},{"name":"style","type":{"name":"MenuStyle","uid":"cui::widgets::MenuStyle"}},{"name":"index","type":{"name":"usz","uid":"std::core::usz"}},{"name":"bar","type":{"name":"Element*","uid":"cui::Element"}},{"name":"hovered","type":{"name":"bool"}}],"docs":{"text":"One title on the bar. Internal \u2014 MenuBar builds these.\n\n Press toggles its own menu. Hover, while any menu is open, switches to this one\n without a click; the released element under the pointer is rebuilt, hover\n re-enters the fresh title, and the highlight carries over."}},{"name":"MenuItemRow","kind":"struct","uid":"cui::widgets::MenuItemRow","file":"src/widgets/menu.c3:478:8","interfaces":[{"name":"Widget","uid":"cui::Widget"}],"members":[{"name":"item","type":{"name":"MenuItem","uid":"cui::widgets::MenuItem"}},{"name":"style","type":{"name":"MenuStyle","uid":"cui::widgets::MenuStyle"}},{"name":"width","type":{"name":"float"}},{"name":"bar","type":{"name":"Element*","uid":"cui::Element"}},{"name":"hovered","type":{"name":"bool"}}],"docs":{"text":"One dropdown entry. Internal \u2014 MenuBar builds these with the polled flags\n already folded in."}},{"name":"MenuSeparator","kind":"struct","uid":"cui::widgets::MenuSeparator","file":"src/widgets/menu.c3:574:8","interfaces":[{"name":"Widget","uid":"cui::Widget"}],"members":[{"name":"style","type":{"name":"MenuStyle","uid":"cui::widgets::MenuStyle"}},{"name":"size","type":{"name":"Vec2","uid":"std::math::vector::Vec2"}}],"docs":{"text":"A divider between item groups. Internal."}},{"name":"Select","kind":"struct","uid":"cui::widgets::Select","file":"src/widgets/menu.c3:611:8","interfaces":[{"name":"Widget","uid":"cui::Widget"}],"members":[{"name":"options","type":{"name":"String[]"}},{"name":"selected","type":{"name":"usz","uid":"std::core::usz"}},{"name":"on_change","type":{"name":"OnSelect","uid":"cui::widgets::OnSelect"}},{"name":"style","type":{"name":"MenuStyle","uid":"cui::widgets::MenuStyle"}},{"name":"width","type":{"name":"float"}},{"name":"open","type":{"name":"bool"}}],"docs":{"text":"A dropdown selector: a button showing the current option; open, a popup list\n of all of them. The chosen index lives on the widget, and `on_change` fires\n with it \u2014 reach the app through `ui.inherit`, as everywhere in this file.\n\n Same escape-the-rect trick as MenuBar, with one wrinkle: a Select sits at an\n arbitrary place in the tree, so its close-catcher reaches the window origin by\n offsetting itself by -elem.absolute \u2014 a value from the previous emit, so it can\n be one frame stale. That is invisible in practice (the Select has not moved\n between the click that opened it and the next frame), and it is the price of a\n popup with no overlay layer in the core.\n\n Because it sits anywhere, the list is placed against the screen rather than\n simply hung below the head: near the bottom edge it opens upwards instead. See\n `Media.drop`.\n\n While open, the built subtree paints in this element's slot in the paint order:\n siblings painted later can still cover the popup. Keep an open Select out from\n under overlapping later siblings \u2014 in a plain form layout there are none."}},{"name":"SelectHead","kind":"struct","uid":"cui::widgets::SelectHead","file":"src/widgets/menu.c3:746:8","interfaces":[{"name":"Widget","uid":"cui::Widget"}],"members":[{"name":"text","type":{"name":"String"}},{"name":"style","type":{"name":"MenuStyle","uid":"cui::widgets::MenuStyle"}},{"name":"width","type":{"name":"float"}},{"name":"hovered","type":{"name":"bool"}}],"docs":{"text":"The closed face of a Select: box, current text, chevron. Internal, and inert \u2014\n its clicks are the composite's."}},{"name":"SelectOption","kind":"struct","uid":"cui::widgets::SelectOption","file":"src/widgets/menu.c3:789:8","interfaces":[{"name":"Widget","uid":"cui::Widget"}],"members":[{"name":"text","type":{"name":"String"}},{"name":"style","type":{"name":"MenuStyle","uid":"cui::widgets::MenuStyle"}},{"name":"width","type":{"name":"float"}},{"name":"index","type":{"name":"usz","uid":"std::core::usz"}},{"name":"chosen","type":{"name":"bool"}},{"name":"host","type":{"name":"Element*","uid":"cui::Element"}},{"name":"hovered","type":{"name":"bool"}}],"docs":{"text":"One option in an open Select. Internal."}},{"name":"SelectCatcher","kind":"struct","uid":"cui::widgets::SelectCatcher","file":"src/widgets/menu.c3:862:8","interfaces":[{"name":"Widget","uid":"cui::Widget"}],"members":[{"name":"host","type":{"name":"Element*","uid":"cui::Element"}}],"docs":{"text":"The click-anywhere-else-closes surface of an open Select. Internal. Its layout\n deliberately answers with the window size, ignoring the constraints it was\n offered \u2014 it is an overlay pretending the tree has an overlay layer, and its\n offset (set by Select.build) walks it back to the window origin."}},{"name":"AreaStyle","kind":"struct","uid":"cui::widgets::AreaStyle","file":"src/widgets/area.c3:52:8","members":[{"name":"strip_color","type":{"name":"Color","uid":"cui::Color"}},{"name":"strip_border","type":{"name":"Color","uid":"cui::Color"}},{"name":"tab_active","type":{"name":"Color","uid":"cui::Color"}},{"name":"hover_color","type":{"name":"Color","uid":"cui::Color"}},{"name":"text_color","type":{"name":"Color","uid":"cui::Color"}},{"name":"dim_color","type":{"name":"Color","uid":"cui::Color"}},{"name":"splitter_color","type":{"name":"Color","uid":"cui::Color"}},{"name":"font","type":{"name":"FontId","uid":"cui::FontId"}},{"name":"text_size","type":{"name":"float"}},{"name":"tab_height","type":{"name":"float"}},{"name":"pad_x","type":{"name":"float"}},{"name":"splitter_px","type":{"name":"float"}},{"name":"min_pane","type":{"name":"float"}}],"docs":{"text":"One look for the whole area system. Pass a complete style or none at all: a\n zero `tab_height` means \"use DEFAULT_AREA_STYLE wholesale\", and a partially\n filled style is not merged field-by-field (the MenuStyle convention)."}},{"name":"ViewBuilder","kind":"alias","uid":"cui::widgets::ViewBuilder","file":"src/widgets/area.c3:94:7","return_type":{"name":"Element*","uid":"cui::Element"},"members":[{"name":"ui","type":{"name":"Ui*","uid":"cui::Ui"}}],"docs":null},{"name":"AreaView","kind":"struct","uid":"cui::widgets::AreaView","file":"src/widgets/area.c3:99:8","members":[{"name":"name","type":{"name":"String"}},{"name":"build","type":{"name":"ViewBuilder","uid":"cui::widgets::ViewBuilder"}}],"docs":{"text":"One entry in the view registry: the tab label and the builder behind it."}},{"name":"AreaNode","kind":"struct","uid":"cui::widgets::AreaNode","file":"src/widgets/area.c3:109:8","members":[{"name":"first","type":{"name":"AreaNode*","uid":"cui::widgets::AreaNode"}},{"name":"second","type":{"name":"AreaNode*","uid":"cui::widgets::AreaNode"}},{"name":"axis","type":{"name":"SplitAxis","uid":"cui::widgets::SplitAxis"}},{"name":"ratio","type":{"name":"float"}},{"name":"active","type":{"name":"usz","uid":"std::core::usz"}}],"docs":{"text":"One node of the area tree. A null `first` marks a leaf showing a view; a split\n carries its two children, the axis and where the divider sits."}},{"name":"AreaLayout","kind":"struct","uid":"cui::widgets::AreaLayout","file":"src/widgets/area.c3:129:8","members":[{"name":"root","type":{"name":"AreaNode*","uid":"cui::widgets::AreaNode"}},{"name":"views","type":{"name":"AreaView[]","uid":"cui::widgets::AreaView"}},{"name":"style","type":{"name":"AreaStyle","uid":"cui::widgets::AreaStyle"}}],"docs":{"text":"The app-owned model an AreaHost renders: the node tree, the views every leaf\n offers as tabs, and the style. Operations here only mutate the tree \u2014 the\n caller (in practice AreaTabStrip) requests the rebuild that makes them\n visible."}},{"name":"AreaHost","kind":"struct","uid":"cui::widgets::AreaHost","file":"src/widgets/area.c3:262:8","interfaces":[{"name":"Widget","uid":"cui::Widget"}],"members":[{"name":"areas","type":{"name":"AreaLayout*","uid":"cui::widgets::AreaLayout"}},{"name":"size","type":{"name":"Vec2","uid":"std::math::vector::Vec2"}},{"name":"menu_node","type":{"name":"AreaNode*","uid":"cui::widgets::AreaNode"}},{"name":"menu_merge","type":{"name":"bool"}},{"name":"menu_at","type":{"name":"Vec2","uid":"std::math::vector::Vec2"}}],"docs":{"text":"The mount point: renders an AreaLayout inside its own rect. Sized by the\n `size` field (zero = fill). Structural changes \u2014 split, close, merge \u2014 rebuild\n from here; a tab switch rebuilds only its own pane.\n\n Also the owner of the context menu: a right press on a pane or a divider\n parks the target node here and rebuilds, and the open shape adds a\n window-sized catcher plus the popup over the pane tree \u2014 MenuBar's\n escape-the-rect trick. While the menu is open the catcher blankets every\n strip and divider, so nothing else can mutate the tree under the parked\n pointer, which is what keeps holding an AreaNode* across frames sound.\n\n The workspace is a screen of its own (see core/media.c3): a host under a window menu\n bar does not own the strip above it, and a popup that clamped itself to the\n window would be free to cover it."}},{"name":"AreaPane","kind":"struct","uid":"cui::widgets::AreaPane","file":"src/widgets/area.c3:385:8","interfaces":[{"name":"Widget","uid":"cui::Widget"}],"members":[{"name":"areas","type":{"name":"AreaLayout*","uid":"cui::widgets::AreaLayout"}},{"name":"node","type":{"name":"AreaNode*","uid":"cui::widgets::AreaNode"}},{"name":"host","type":{"name":"Element*","uid":"cui::Element"}}],"docs":{"text":"One composite per AreaNode. A leaf builds its tab strip over the active view's\n subtree; a split builds two nested panes and the divider between them. Nested\n panes are composites too, so the whole tree materializes in one build pass."}},{"name":"AreaSplit","kind":"struct","uid":"cui::widgets::AreaSplit","file":"src/widgets/area.c3:472:8","interfaces":[{"name":"Widget","uid":"cui::Widget"}],"members":[{"name":"node","type":{"name":"AreaNode*","uid":"cui::widgets::AreaNode"}},{"name":"style","type":{"name":"AreaStyle","uid":"cui::widgets::AreaStyle"}}],"docs":{"text":"The divider's owner: places the two panes and the handle from the node's ratio\n under TIGHT constraints, so each pane is exactly its share and a ratio change\n is a relayout away."}},{"name":"AreaSplitter","kind":"struct","uid":"cui::widgets::AreaSplitter","file":"src/widgets/area.c3:516:8","interfaces":[{"name":"Widget","uid":"cui::Widget"}],"members":[{"name":"node","type":{"name":"AreaNode*","uid":"cui::widgets::AreaNode"}},{"name":"style","type":{"name":"AreaStyle","uid":"cui::widgets::AreaStyle"}},{"name":"host","type":{"name":"Element*","uid":"cui::Element"}},{"name":"dragging","type":{"name":"bool"}},{"name":"hovered","type":{"name":"bool"}}],"docs":{"text":"The draggable divider. Consuming the press captures the pointer, so the drag\n keeps working however far it outruns this thin bar; the ratio is recomputed\n from the absolute pointer position against the parent split's rect. A right\n press opens the merge menu for the two sides this divider separates."}},{"name":"AreaTabStrip","kind":"struct","uid":"cui::widgets::AreaTabStrip","file":"src/widgets/area.c3:594:8","interfaces":[{"name":"Widget","uid":"cui::Widget"}],"members":[{"name":"areas","type":{"name":"AreaLayout*","uid":"cui::widgets::AreaLayout"}},{"name":"node","type":{"name":"AreaNode*","uid":"cui::widgets::AreaNode"}},{"name":"pane","type":{"name":"Element*","uid":"cui::Element"}},{"name":"lit","type":{"name":"int"}}],"docs":{"text":"One leaf's header: a tab per registered view. Selection state lives on the\n AreaNode, so the strip itself survives nothing and needs to survive nothing \u2014\n a tab switch rebuilds its pane. Structural changes are not the strip's job:\n splitting, closing and merging live in the right-click context menu."}},{"name":"AreaMenuEntry","kind":"struct","uid":"cui::widgets::AreaMenuEntry","file":"src/widgets/area.c3:726:8","visibility":"private","members":[{"name":"label","type":{"name":"String"}},{"name":"action","type":{"name":"AreaMenuAction","uid":"cui::widgets::AreaMenuAction"}},{"name":"disabled","type":{"name":"bool"}}],"docs":null},{"name":"AreaMenuRow","kind":"struct","uid":"cui::widgets::AreaMenuRow","file":"src/widgets/area.c3:741:8","interfaces":[{"name":"Widget","uid":"cui::Widget"}],"members":[{"name":"label","type":{"name":"String"}},{"name":"action","type":{"name":"AreaMenuAction","uid":"cui::widgets::AreaMenuAction"}},{"name":"disabled","type":{"name":"bool"}},{"name":"style","type":{"name":"AreaStyle","uid":"cui::widgets::AreaStyle"}},{"name":"width","type":{"name":"float"}},{"name":"host","type":{"name":"Element*","uid":"cui::Element"}},{"name":"hovered","type":{"name":"bool"}}],"docs":{"text":"One entry in the context menu. Carries its action and target-by-way-of-host\n directly \u2014 the no-closures answer to MenuItem's context-free callbacks, the\n same reasoning as the strip's zone codes."}},{"name":"AreaMenuCatcher","kind":"struct","uid":"cui::widgets::AreaMenuCatcher","file":"src/widgets/area.c3:828:8","interfaces":[{"name":"Widget","uid":"cui::Widget"}],"members":[{"name":"host","type":{"name":"Element*","uid":"cui::Element"}}],"docs":{"text":"The click-anywhere-else-closes surface under the popup \u2014 SelectCatcher for the\n area menu. Window-sized whatever it is offered; the host's build offsets it\n back to the window origin."}},{"name":"SplitAxis","kind":"enum","uid":"cui::widgets::SplitAxis","file":"src/widgets/area.c3:41:6","base_type":{"name":"int"},"members":[{"name":"HORIZONTAL","type":{"name":"SplitAxis","uid":"cui::widgets::SplitAxis"},"docs":null},{"name":"VERTICAL","type":{"name":"SplitAxis","uid":"cui::widgets::SplitAxis"},"docs":null}],"docs":{"text":"How a split divides its pane. HORIZONTAL puts the children side by side\n (a vertical divider between them), VERTICAL stacks them (a horizontal one) \u2014\n named for the axis the panes are laid out along, as Row and Column are."}},{"name":"AreaMenuAction","kind":"enum","uid":"cui::widgets::AreaMenuAction","file":"src/widgets/area.c3:717:6","base_type":{"name":"int"},"members":[{"name":"SPLIT_SIDE","type":{"name":"AreaMenuAction","uid":"cui::widgets::AreaMenuAction"},"docs":null},{"name":"SPLIT_STACK","type":{"name":"AreaMenuAction","uid":"cui::widgets::AreaMenuAction"},"docs":null},{"name":"CLOSE","type":{"name":"AreaMenuAction","uid":"cui::widgets::AreaMenuAction"},"docs":null},{"name":"MERGE_FIRST","type":{"name":"AreaMenuAction","uid":"cui::widgets::AreaMenuAction"},"docs":null},{"name":"MERGE_SECOND","type":{"name":"AreaMenuAction","uid":"cui::widgets::AreaMenuAction"},"docs":null}],"docs":{"text":"What a context menu row does to the parked node. Split and close are the\n pane's entries; the merge halves are the divider's, keeping the named child\n and freeing the other side whole."}},{"name":"Grid","kind":"struct","uid":"cui::widgets::Grid","file":"src/widgets/grid.c3:39:8","interfaces":[{"name":"Widget","uid":"cui::Widget"}],"members":[{"name":"cell","type":{"name":"Vec2","uid":"std::math::vector::Vec2"}},{"name":"gap_x","type":{"name":"float"}},{"name":"gap_y","type":{"name":"float"}},{"name":"size","type":{"name":"Vec2","uid":"std::math::vector::Vec2"}}],"docs":{"text":"A wrapping grid of equally sized cells.\n\n `cell` is required \u2014 a zero on either axis leaves nothing to divide the width\n by, and the grid lays out as a single column of collapsed children rather than\n failing, since a widget mid-build has nowhere to report to.\n\n `size` follows the same convention as Row and Column: zero on an axis wraps the\n content, non-zero fixes it *and* is what the children are offered."}},{"name":"OnChoose","kind":"alias","uid":"cui::widgets::OnChoose","file":"src/widgets/file_browser.c3:37:7","return_type":{"name":"void"},"members":[{"name":"ui","type":{"name":
