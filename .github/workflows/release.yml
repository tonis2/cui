name: Release

on:
  push:
    tags:
      - "v*" # e.g. v0.1.0 — releases are cut from tags, not from every push
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to (re)build the release from, e.g. v0.1.0"
        required: true

env:
  C3C_VERSION: v0.8.2
  # The Vulkan bindings a consumer installs next to cui.c3l. Vulkan.c3 publishes
  # a rolling "latest" release; it carries the macOS loader + driver dylibs and
  # finds them itself, which is why cui.c3l ships neither.
  VULKAN_C3L_URL: https://github.com/tonis2/Vulkan.c3/releases/download/latest/vulkan.c3l

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "name=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "name=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.tag.outputs.name }}
          submodules: recursive

      - name: Build cui.c3l
        # Nothing is compiled or downloaded here: a release is just a zip of the
        # files that were tested as-is. The checkout above already installed
        # c3w, image and font as submodules, so the artifact is the working tree
        # with the noise stripped out -- no staging copy, and no reshaping.
        #
        # The zip therefore has the SAME layout as a git clone, which is the
        # point: manifest.json names lib/window.c3l/... and lib/image.c3l/...,
        # and those paths resolve identically whether cui is consumed as a
        # downloaded zip or as a source submodule. (c3c reads a .c3l as either.)
        # An earlier layout flattened them into deps/, and a clone could not
        # build against its own manifest.
        #
        # One artifact serves every platform, and every byte of it is source:
        # nothing links against Vulkan -- the vk bindings dlopen the loader at
        # runtime. The macOS loader + driver dylibs are vulkan.c3l's to ship. It
        # locates them relative to its own sources (vk::c3l_root, from the
        # compile-time $$FILEPATH), so a copy inside cui.c3l would sit somewhere
        # that macro never looks; a consumer installs vulkan.c3l alongside this
        # artifact instead. That is also why vk is not a submodule: nothing in
        # this job should be able to sweep it in.
        run: |
          set -e
          # c3w, image and font are vendored in -- they are pure source with
          # nothing to find at runtime. vk is not: see above.
          #
          # Excluded: git metadata, each submodule's own project.json (a
          # consumer builds through manifest.json; a stray project.json in the
          # tree is confusing at best), and their test/docs/wasm trees, which are
          # 4x the artifact in image fixtures alone -- 712K vs 168K.
          # lib/vulkan.c3l is excluded rather than merely asserted against: CI
          # never has it, but a developer running this same command locally does
          # (building cui itself needs it there), and 3 MB of loader + driver is
          # exactly what must not ship. The guard below stays as the assertion.
          zip -qr cui.c3l manifest.json LICENSE README.md src lib \
            -x '*.git*' '*/project.json' '*/test/*' '*/docs/*' '*/wasm/*' 'lib/vulkan.c3l/*'

          # A vendored copy of either would be the bug this layout removes: the
          # bindings would compile from a path with no macos-aarch64/ beside it,
          # and the dylibs would be duplicated where nothing opens them. vk is no
          # longer a submodule, so this guard now catches a stray local download
          # rather than a packaging mistake -- keep it either way.
          if unzip -l cui.c3l | grep -iE 'vulkan\.c3l/|\.dylib'; then
            echo "cui.c3l must not carry the vk bindings or the Vulkan dylibs"; exit 1
          fi

          # The manifest is only as good as the paths behind it: a missing source
          # tree here is a broken release that would otherwise reach the verify
          # job as a confusing compile error.
          for p in manifest.json src/shaders/shader.spv lib/window.c3l/main.c3 \
                   lib/window.c3l/linux lib/window.c3l/darwin lib/window.c3l/win32 \
                   lib/image.c3l/src lib/font.c3l/src; do
            unzip -l cui.c3l | grep -q " $p" || { echo "missing from artifact: $p"; exit 1; }
          done

      - name: Upload cui.c3l
        uses: actions/upload-artifact@v4
        with:
          name: cui.c3l
          path: cui.c3l
          if-no-files-found: error

  # Prove the artifact builds on every platform before publishing it, against the
  # released vulkan.c3l a consumer would actually pair it with -- so a mismatch
  # between the two fails the release instead of shipping a .c3l nobody can build
  # against. Building is the whole test -- the runners have no GPU, so nothing
  # is run. No Vulkan SDK is installed on any runner: nothing links against
  # Vulkan, which is itself part of what is being verified.
  verify:
    needs: package
    strategy:
      fail-fast: true
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Fetch cui.c3l
        uses: actions/download-artifact@v4
        with:
          name: cui.c3l
          path: consumer/lib

      - name: Fetch vulkan.c3l
        shell: bash
        run: curl -fsSL "$VULKAN_C3L_URL" -o consumer/lib/vulkan.c3l

      - name: Install C3
        shell: bash
        run: |
          case "${{ runner.os }}" in
            Linux)   curl -fsSL "https://github.com/c3lang/c3c/releases/download/${C3C_VERSION}/c3-linux.tar.gz" -o c3.tgz && tar xzf c3.tgz ;;
            macOS)   curl -fsSL "https://github.com/c3lang/c3c/releases/download/${C3C_VERSION}/c3-macos.zip"    -o c3.zip && unzip -q c3.zip ;;
            Windows) curl -fsSL "https://github.com/c3lang/c3c/releases/download/${C3C_VERSION}/c3-windows.zip"  -o c3.zip && unzip -q c3.zip ;;
          esac
          chmod +x c3/c3c || true
          echo "$PWD/c3" >> "$GITHUB_PATH"

      - name: Consumer project depending on cui + vk
        shell: bash
        run: |
          mkdir -p consumer/src
          # "vk" is what vulkan.c3l provides -- c3c resolves a dependency by the
          # manifest's "provides", not by the file name.
          cat > consumer/project.json <<'EOF'
          {
            "langrev": "1",
            "warnings": [ "no-unused" ],
            "dependency-search-paths": [ "lib" ],
            "dependencies": [ "cui", "vk" ],
            "sources": [ "src/**" ],
            "output": "build",
            "targets": { "smoke": { "type": "executable" } }
          }
          EOF
          # Referencing the renderer forces vk and c3w to compile -- with no Vulkan
          # SDK on the runner, which is exactly what is being verified.
          cat > consumer/src/main.c3 <<'EOF'
          module smoke;
          import cui;
          import cui::widgets;
          import cui::vulkan;

          fn int main()
          {
          	void* renderer_entry = (void*)&cui::vulkan::new;
          	Constraints c = { .min = { 0, 0 }, .max = { 320, 240 } };
          	Rectangle r = { .size = { 10, 10 } };
          	return renderer_entry == null ? 1 : (int)cui::clamp_size(r.size, c).x;
          }
          EOF

      - name: Build against cui.c3l
        shell: bash
        working-directory: consumer
        run: c3c build smoke

      - name: No Vulkan dylib dependency (macOS)
        if: runner.os == 'macOS'
        working-directory: consumer
        run: |
          # The loader is dlopened at runtime, never linked, so a macOS app must
          # not reference any Vulkan dylib -- the loader + driver vulkan.c3l
          # bundles are found through its own candidate paths instead.
          if otool -L build/smoke | grep -iE 'vulkan|moltenvk'; then
            echo "unexpected Vulkan dylib dependency"; exit 1
          fi
          echo "self-contained: no Vulkan dylib dependency"

  release:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the release, and push the regenerated docs

    steps:
      - name: Resolve tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "name=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "name=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Build the docs from the tagged commit. c3w, image and font live in
          # lib/*.c3l as submodules and docgen has to compile them; vk is not a
          # submodule and is downloaded in the next step. Full history so the
          # docs commit can land on main.
          ref: ${{ steps.tag.outputs.name }}
          submodules: recursive
          fetch-depth: 0

      - name: Fetch cui.c3l
        uses: actions/download-artifact@v4
        with:
          name: cui.c3l

      - name: Install C3
        run: |
          curl -fsSL "https://github.com/c3lang/c3c/releases/download/${C3C_VERSION}/c3-linux.tar.gz" -o c3.tar.gz
          tar xzf c3.tar.gz
          echo "$PWD/c3" >> "$GITHUB_PATH"

      - name: Fetch vulkan.c3l
        # vk is not a submodule (see the packaging job), but docgen still has to
        # compile src/vulkan/*.c3, so install it the same way a consumer does.
        # c3c reads a .c3l as a zip, so the downloaded file needs no unpacking.
        run: curl -fsSL "$VULKAN_C3L_URL" -o lib/vulkan.c3l

      - name: Generate API docs
        run: |
          # docgen always writes ./docs.html, ignoring -o. Path mode ignores
          # project.json dependencies, so the libs are passed explicitly --
          # without them src/vulkan/renderer.c3 fails to compile and no page is
          # written at all. docgen then embeds EVERY compiled module: vk alone is
          # 5.3 MB of a 7 MB page, std another 2 MB, cui's own modules 120 KB.
          # There is no flag to exclude them, so trim the embedded JSON after.
          c3c docgen --libdir lib --lib vk --lib c3w --lib image --lib font src
          python3 scripts/trim_docs.py docs.html cui
          # Park it outside the worktree: the next step switches branches.
          cp docs.html "$RUNNER_TEMP/index.html"

      - name: Publish docs to main
        # The tag checkout is a detached HEAD, so the docs commit is made on main
        # explicitly. GitHub Pages serves main's /docs folder.
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git checkout -B main origin/main
          mkdir -p docs
          cp "$RUNNER_TEMP/index.html" docs/index.html
          if [ -n "$(git status --porcelain docs)" ]; then
            git add docs
            git commit -m "docs: API reference for ${{ steps.tag.outputs.name }} [skip ci]"
            git push origin main
          else
            echo "docs unchanged"
          fi

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.name }}
          name: ${{ steps.tag.outputs.name }}
          files: cui.c3l
          generate_release_notes: true
