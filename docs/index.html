s":[{"name":"elem","type":{"name":"Element*","uid":"cui::Element"}},{"name":"id","type":{"name":"String"}}],"docs":null},{"name":"child_slot","kind":"function","uid":"cui::child_slot","file":"src/core/ui.c3:1119:7","visibility":"private","return_type":{"name":"sz","uid":"std::core::sz"},"members":[{"name":"parent","type":{"name":"Element*","uid":"cui::Element"}},{"name":"child","type":{"name":"Element*","uid":"cui::Element"}}],"docs":{"text":"Where a child sits in its parent's list \u2014 the step `@walk` takes in place of a\n stack. Linear in the sibling count, which stays small in a UI tree; a parent\n with hundreds of children pays for it once per child.","return":"The index, or the child count if the two are not related."}},{"name":"vec2_eq","kind":"function","uid":"cui::vec2_eq","file":"src/core/ui.c3:1990:9","return_type":{"name":"bool"},"members":[{"name":"a","type":{"name":"Vec2","uid":"std::math::vector::Vec2"}},{"name":"b","type":{"name":"Vec2","uid":"std::math::vector::Vec2"}}],"docs":{"text":"Exact component-wise equality \u2014 what the layout cache compares sizes and\n constraints with.","return":"True when both components match exactly.","params":[{"name":"a","description":"First vector."},{"name":"b","description":"Second vector."}]}},{"name":"key_in","kind":"function","uid":"cui::key_in","file":"src/core/input.c3:546:9","return_type":{"name":"bool"},"members":[{"name":"keys","type":{"name":"Key[]","uid":"cui::Key"}},{"name":"key","type":{"name":"Key","uid":"cui::Key"}}],"docs":{"text":"Whether a key appears in a held-key set.","return":"True if the key is in the set.","params":[{"name":"keys","description":"The set to search."},{"name":"key","description":"The key to look for."}]}},{"name":"decode_rune","kind":"function","uid":"cui::decode_rune","file":"src/render/text.c3:291:9","visibility":"local","return_type":{"name":"uint"},"members":[{"name":"s","type":{"name":"String"}},{"name":"i","type":{"name":"usz*","uid":"std::core::usz"}}],"docs":null}],"methods":[{"name":"fraction","kind":"method","uid":"cui::Media.fraction","file":"src/core/media.c3:58:15","return_type":{"name":"Vec2","uid":"std::math::vector::Vec2"},"members":[{"name":"self","type":{"name":"Media","uid":"cui::Media"}},{"name":"share","type":{"name":"Vec2","uid":"std::math::vector::Vec2"}}],"docs":{"text":"A size expressed as a share of the screen: `media.fraction({ 0.5, 1.0 })` is\n half the width, full height.","return":"The size in pixels.","params":[{"name":"share","description":"Per axis, the multiplier \u2014 0.25 is a quarter of that axis."}]}},{"name":"clamp_rect","kind":"method","uid":"cui::Media.clamp_rect","file":"src/core/media.c3:78:15","return_type":{"name":"Vec2","uid":"std::math::vector::Vec2"},"members":[{"name":"self","type":{"name":"Media","uid":"cui::Media"}},{"name":"at","type":{"name":"Vec2","uid":"std::math::vector::Vec2"}},{"name":"size","type":{"name":"Vec2","uid":"std::math::vector::Vec2"}}],"docs":{"text":"The position closest to `at` where a rect of `size` still fits on this screen.\n\n Coordinates are absolute \u2014 the same space as `Element.absolute` \u2014 so a popup\n positioned in element-local coordinates converts in and back out:\n `media.clamp_rect(elem.absolute + local, size) - elem.absolute`.\n\n A rect larger than the screen is pinned to the top-left corner rather than\n centred or shrunk: the overflow has to go somewhere, and the corner is the end\n the reader starts at. Clipping or scrolling what is left over is the caller's.","return":"The top-left to place it at, in UI coordinates.","params":[{"name":"at","description":"The preferred top-left, in UI coordinates."},{"name":"size","description":"The rect's size."}]}},{"name":"drop","kind":"method","uid":"cui::Media.drop","file":"src/core/media.c3:104:15","return_type":{"name":"Vec2","uid":"std::math::vector::Vec2"},"members":[{"name":"self","type":{"name":"Media","uid":"cui::Media"}},{"name":"anchor","type":{"name":"Vec2","uid":"std::math::vector::Vec2"}},{"name":"anchor_height","type":{"name":"float"}},{"name":"size","type":{"name":"Vec2","uid":"std::math::vector::Vec2"}}],"docs":{"text":"Where to put a dropdown hanging off an anchor: under it when the panel fits\n there, above it when it does not and there is more room that way, and clamped\n onto the screen either way. What a menu bar's dropdown, a Select's list and a\n combo box all want.\n\n The flip is decided by which side has more room, not by preference. A bar at\n the top of its screen has nothing above it, so its menu stays below and only\n slides up \u2014 overlapping the bar instead of leaving the screen, the trade a\n native menu makes on a short display. A Select in the middle of a form flips,\n because there the room above is real.","return":"The top-left to place the panel at, in UI coordinates.","params":[{"name":"anchor","description":"Top-left of the thing the panel hangs off, in UI coordinates. Its x is the panel's preferred x."},{"name":"anchor_height","description":"How tall that thing is \u2014 where \"under it\" starts."},{"name":"size","description":"The panel's size."}]}},{"name":"media","kind":"method","uid":"cui::Ui.media","file":"src/core/media.c3:119:13","return_type":{"name":"Media","uid":"cui::Media"},"members":[{"name":"self","type":{"name":"Ui*","uid":"cui::Ui"},"is_ref":true}],"docs":{"text":"The window's own metrics \u2014 the screen every element sees until something\n between it and the root declares a smaller one.","return":"The root media: the Ui's size at the origin."}},{"name":"media","kind":"method","uid":"cui::Element.media","file":"src/core/media.c3:135:18","return_type":{"name":"Media","uid":"cui::Media"},"members":[{"name":"self","type":{"name":"Element*","uid":"cui::Element"},"is_ref":true}],"docs":{"text":"The screen this element is on: the nearest element publishing a `media_box` \u2014\n itself included, so a widget that declares a box also sizes against it \u2014 or the\n window when nothing on the way up publishes one.\n\n Walks parent pointers, so it costs the depth of the tree. That is nothing at\n the rate layout calls it, but a paint loop wanting it per drawing should hoist\n the call out.","return":"The metrics of the innermost screen containing this element."}},{"name":"constrain","kind":"method","uid":"cui::Constraints.constrain","file":"src/core/ui.c3:100:21","return_type":{"name":"Vec2","uid":"std::math::vector::Vec2"},"members":[{"name":"self","type":{"name":"Constraints","uid":"cui::Constraints"}},{"name":"wanted","type":{"name":"Vec2","uid":"std::math::vector::Vec2"}}],"docs":{"text":"Clamps a wanted size into this range \u2014 the usual last step of a `layout()`,\n since the size a layout returns must lie inside the constraints it was given.","return":"The wanted size, clamped to this constraint box.","params":[{"name":"wanted","description":"The size the widget would take if it could."}]}},{"name":"deflate","kind":"method","uid":"cui::Constraints.deflate","file":"src/core/ui.c3:117:28","return_type":{"name":"Constraints","uid":"cui::Constraints"},"members":[{"name":"self","type":{"name":"Constraints","uid":"cui::Constraints"}},{"name":"by","type":{"name":"Vec2","uid":"std::math::vector::Vec2"}}],"docs":{"text":"Shrinks both bounds by `by`, floored at zero \u2014 the constraints to hand a child\n when this widget keeps some of the space for itself: padding, a title bar, a\n border. Flooring matters: a widget padded harder than the room it was offered\n must hand its child an empty box, not a negative one.","return":"The remaining range, never negative.","params":[{"name":"by","description":"Total space to reserve on each axis (both edges together)."}]}},{"name":"fill","kind":"method","uid":"cui::Constraints.fill","file":"src/core/ui.c3:143:21","return_type":{"name":"Vec2","uid":"std::math::vector::Vec2"},"members":[{"name":"self","type":{"name":"Constraints","uid":"cui::Constraints"}},{"name":"size","type":{"name":"Vec2","uid":"std::math::vector::Vec2"}}],"docs":{"text":"Resolves a size the way the `size` field convention does: per axis, a set\n component is that many pixels and a zero component fills whatever was offered,\n clamped into range either way. `{ 0, 40 }` inside a 400px Column is 400\u00d740.\n\n This is the convention the built-in containers and the size-field shortcut both\n follow (see the Widget interface docs), so a hand-written `layout` that starts\n here behaves like the rest of the library instead of approximately like it.\n\n It clamps, which is what a widget's OWN size wants and not always what it wants\n to offer its children: under tight constraints the clamp wins, so a widget that\n must cap its children below a minimum it was handed \u2014 or publish a `media_box`\n smaller than the space it fills \u2014 has to write that cap out rather than call\n this. Column does, and says why.","return":"The resolved size, inside these constraints.","params":[{"name":"size","description":"The widget's wanted size, zero meaning \"fill\" on that axis."}]}},{"name":"dim","kind":"method","uid":"cui::Color.dim","file":"src/core/ui.c3:219:16","return_type":{"name":"Color","uid":"cui::Color"},"members":[{"name":"self","type":{"name":"Color"}},{"name":"amount","type":{"name":"float"}}],"docs":null},{"name":"provide","kind":"method","uid":"cui::Ui.provide","file":"src/core/ui.c3:552:12","return_type":{"name":"void"},"members":[{"name":"self","type":{"name":"Ui*","uid":"cui::Ui"},"is_ref":true},{"name":"value","type":{"name":"any"}}],"docs":{"text":"Makes a value reachable by type from anywhere in the tree.\n\n Every widget hook receives an `Element*`, and every element holds `Ui* ui`, so\n a value provided here is one hop away from any point in the tree without the\n embedder threading a pointer through the struct literal that built the widget.\n That is what lets this library ship *interactive* widgets at all: a Button has\n to call back into the app, and cui has no app type to name.\n\n This is not the way a widget should reach state it owns and mutates. A field\n of the right type is checked by the compiler; a lookup here is checked at\n runtime and raises NOT_PROVIDED when the embedder forgot. For a callback\n context or a theme \u2014 uniform across the tree, provided once at startup, read\n far more than written \u2014 that trade is fine, and the failure is loud on the\n first interaction. For the widget holding the document, take the pointer as a\n field and let a missing one fail to compile.\n\n Providing the same type twice is an override rather than a duplicate:\n `inherit` searches newest-first, so swapping a theme at runtime is a push.","params":[{"name":"value","description":"Borrowed \u2014 must outlive the Ui. Pass a pointer; it converts to any."}]}},{"name":"free","kind":"method","uid":"cui::Ui.free","file":"src/core/ui.c3:592:12","return_type":{"name":"void"},"members":[{"name":"self","type":{"name":"Ui*","uid":"cui::Ui"},"is_ref":true}],"docs":{"text":"Releases the tree (running every widget's `unmount`), the canvas and the Ui\n itself. Widget structs passed by pointer stay caller-owned."}},{"name":"record_watch","kind":"method","uid":"cui::Element.record_watch","file":"src/core/ui.c3:765:17","return_type":{"name":"void"},"members":[{"name":"self","type":{"name":"Element*","uid":"cui::Element"},"is_ref":true},{"name":"type","type":{"name":"typeid"}},{"name":"kind","type":{"name":"WatchKind","uid":"cui::WatchKind"}}],"docs":{"text":"Records one dependency, ignoring a repeat. Internal to `Element.watch`; the\n dedupe is what lets a paint loop call `watch` per item without overflowing.","params":[{"name":"type","description":"The provided type read."},{"name":"kind","description":"The hook that read it."}]}},{"name":"clear_watches","kind":"method","uid":"cui::Element.clear_watches","file":"src/core/ui.c3:785:17","return_type":{"name":"void"},"members":[{"name":"self","type":{"name":"Element*","uid":"cui::Element"},"is_ref":true},{"name":"kind","type":{"name":"WatchKind","uid":"cui::WatchKind"}}],"docs":{"text":"Drops the watches taken from one hook, leaving the other hooks' alone.\n\n Per kind rather than all at once because the hooks run on different schedules:\n a layout watch is declared once and then survives many paints, and clearing\n everything at the top of `paint` would delete it with no layout run coming to\n put it back.","params":[{"name":"kind","description":"The hook about to run."}]}},{"name":"with_id","kind":"method","uid":"cui::Element.with_id","file":"src/core/ui.c3:912:21","return_type":{"name":"Element*","uid":"cui::Element"},"members":[{"name":"self","type":{"name":"Element*","uid":"cui::Element"},"is_ref":true},{"name":"id","type":{"name":"String"}}],"docs":{"text":"Stamps a stable name onto an element and returns it, so it chains straight into\n a `@node` expression: `ui.@node((Dial){...}).with_id(\"dial\")`.","return":"The same element, for chaining.","params":[{"name":"id","description":"The name. Borrowed \u2014 it must outlive the element (a literal is ideal). Empty ids are never matched by find_id."}]}},{"name":"find_id","kind":"method","uid":"cui::Ui.find_id","file":"src/core/ui.c3:926:17","return_type":{"name":"Element*?","uid":"cui::Element"},"members":[{"name":"self","type":{"name":"Ui*","uid":"cui::Ui"},"is_ref":true},{"name":"id","type":{"name":"String"}}],"docs":{"text":"The element carrying this id \u2014 the id-keyed twin of `find`, and likewise the\n handle to hold when a callback reads and invalidates the same node.","return":"The element carrying the id.","params":[{"name":"id","description":"The name given with with_id."}]}},{"name":"find_id","kind":"method","uid":"cui::Element.find_id","file":"src/core/ui.c3:945:22","return_type":{"name":"Element*?","uid":"cui::Element"},"members":[{"name":"self","type":{"name":"Element*","uid":"cui::Element"},"is_ref":true},{"name":"id","type":{"name":"String"}}],"docs":{"text":"The element carrying this id within this subtree, this element included.\n\n The scoped twin of `Ui.find_id`, and what a composite uses to reach into the\n subtree it has just built: a detached subtree is not in `Ui.root` yet, so the\n tree-wide lookup cannot see it. It is also the narrower answer when ids repeat\n by design \u2014 one HUD per pane \u2014 since it searches only below here.","return":"The element carrying the id.","params":[{"name":"id","description":"The name given with with_id."}]}},{"name":"has_id","kind":"method","uid":"cui::Element.has_id","file":"src/core/ui.c3:958:17","return_type":{"name":"bool"},"members":[{"name":"self","type":{"name":"Element*","uid":"cui::Element"},"is_ref":true},{"name":"id","type":{"name":"String"}}],"docs":{"text":"Whether this element carries this name. An empty id never matches, so unkeyed\n elements stay invisible to a name-based pass.","params":[{"name":"id","description":"The name given with with_id."}]}},{"name":"attach_scoped","kind":"method","uid":"cui::Ui.attach_scoped","file":"src/core/ui.c3:1304:12","return_type":{"name":"void"},"members":[{"name":"self","type":{"name":"Ui*","uid":"cui::Ui"},"is_ref":true},{"name":"elem","type":{"name":"Element*","uid":"cui::Element"}}],"docs":{"text":"Plain parent/child wiring, matching `attach_node` \u2014 no request_layout walks:\n nothing built here is mounted yet (`@canvas` installs the root afterwards,\n which invalidates everything once). Internal to the DSL macros; not part of the\n widget-facing API.","params":[{"name":"elem","description":"The freshly built element to attach."}]}},{"name":"build","kind":"method","uid":"cui::Ui.build","file":"src/core/ui.c3:1323:12","return_type":{"name":"void"},"members":[{"name":"self","type":{"name":"Ui*","uid":"cui::Ui"},"is_ref":true},{"name":"root","type":{"name":"Element*","uid":"cui::Element"}}],"docs":{"text":"Installs a built tree as the UI root, releasing any previous root.","params":[{"name":"root","description":"The root of a tree built with ui.@node."}]}},{"name":"append","kind":"method","uid":"cui::Element.append","file":"src/core/ui.c3:1339:17","return_type":{"name":"void"},"members":[{"name":"self","type":{"name":"Element*","uid":"cui::Element"},"is_ref":true},{"name":"child","type":{"name":"Element*","uid":"cui::Element"}}],"docs":{"text":"Grafts a built subtree under a live element.","params":[{"name":"child","description":"The root of a detached subtree built with ui.@node."}]}},{"name":"attach_node","kind":"method","uid":"cui::Ui.attach_node","file":"src/core/ui.c3:1355:16","return_type":{"name":"Element*","uid":"cui::Element"},"members":[{"name":"self","type":{"name":"Ui*","uid":"cui::Ui"},"is_ref":true},{"name":"widget","type":{"name":"Widget","uid":"cui::Widget"}},{"name":"owned","type":{"name":"bool"}},{"name":"children","type":{"name":"Element*...","uid":"cui::Element"},"is_vararg":true}],"docs":{"text":"Allocates the element for a widget and wires the given children under it. The\n primitive behind every node macro.","return":"The new, detached element.","params":[{"name":"widget","description":"The widget behind the element."},{"name":"owned","description":"True when the widget is a heap copy the element must free on release."},{"name":"children","description":"Elements to attach, in order."}]}},{"name":"mount","kind":"method","uid":"cui::Ui.mount","file":"src/core/ui.c3:1384:16","return_type":{"name":"Element*","uid":"cui::Element"},"members":[{"name":"self","type":{"name":"Ui*","uid":"cui::Ui"},"is_ref":true},{"name":"widget","type":{"name":"Widget","uid":"cui::Widget"}},{"name":"parent","type":{"name":"Element*","uid":"cui::Element"},"default_value":"null"}],"docs":{"text":"Attaches a widget to the tree (as root when parent is null). The widget struct\n is owned by the caller and must outlive the element.","return":"The new element.","params":[{"name":"widget","description":"A pointer to a widget the caller keeps alive."},{"name":"parent","description":"The element to attach under; null makes it the root."}]}},{"name":"unmount","kind":"method","uid":"cui::Ui.unmount","file":"src/core/ui.c3:1411:12","return_type":{"name":"void"},"members":[{"name":"self","type":{"name":"Ui*","uid":"cui::Ui"},"is_ref":true},{"name":"element","type":{"name":"Element*","uid":"cui::Element"}}],"docs":{"text":"Removes an element (and its subtree) while the app runs. Widgets get their\n `unmount()` hook to free whatever they own; elements go back to the free-list.","params":[{"name":"element","description":"The element to remove."}]}},{"name":"release","kind":"method","uid":"cui::Ui.release","file":"src/core/ui.c3:1443:12","return_type":{"name":"void"},"members":[{"name":"self","type":{"name":"Ui*","uid":"cui::Ui"},"is_ref":true},{"name":"element","type":{"name":"Element*","uid":"cui::Element"}}],"docs":{"text":"Recycles an element and its subtree: unmount hooks fire, owned widgets and\n palette slots are freed, and the elements return to the free-list. Interactivity\n pointers into the subtree are cleared \u2014 a stale one would silently retarget\n whatever reuses the slot.","params":[{"name":"element","description":"The root of the subtree to release."}]}},{"name":"alloc_element","kind":"method","uid":"cui::Ui.alloc_element","file":"src/core/ui.c3:1472:16","return_type":{"name":"Element*","uid":"cui::Element"},"members":[{"name":"self","type":{"name":"Ui*","uid":"cui::Ui"},"is_ref":true}],"docs":{"text":"An element off the free-list, or a fresh one. `all_elements` keeps every\n allocation for final cleanup.","return":"A zeroed element owned by this Ui."}},{"name":"request_frame","kind":"method","uid":"cui::Ui.request_frame","file":"src/core/ui.c3:1490:12","return_type":{"name":"void"},"members":[{"name":"self","type":{"name":"Ui*","uid":"cui::Ui"},"is_ref":true}],"docs":{"text":"Schedules a frame. An on-demand render loop (one that sleeps when nothing is\n happening) wakes and draws when this is set. Every invalidation below calls it,\n so ordinary state changes schedule a frame for free; a continuous animation\n keeps calling it each frame itself \u2014 the analog of a Flutter Ticker\n re-scheduling \u2014 and simply stops when it's done, letting the loop sleep."}},{"name":"resize","kind":"method","uid":"cui::Ui.resize","file":"src/core/ui.c3:1515:12","return_type":{"name":"void"},"members":[{"name":"self","type":{"name":"Ui*","uid":"cui::Ui"},"is_ref":true},{"name":"size","type":{"name":"Vec2","uid":"std::math::vector::Vec2"}}],"docs":{"text":"The window changed size: re-lay the whole tree out against the new root\n constraints.\n\n The embedder's call, not a widget's \u2014 `Ui.size` is what `flush` offers the root\n and what `Ui.media` reports as the screen, so nothing below can decide it. The\n reference renderer calls this from `frame()` whenever the surface's extent moves;\n an embedder driving cui from its own loop calls it from whatever its window\n system reports a resize through.\n\n Unchanged is a no-op, so calling it every frame with the current size costs\n nothing and is the simplest way to stay in step with a window.\n\n Both passes are scheduled, not just layout: an element whose own size did not\n change can still have moved, and the canvas holds absolute coordinates, so a\n re-layout without a re-emit would leave those drawings where the old layout put\n them.","params":[{"name":"size","description":"The new root constraints \u2014 the window's size in logical pixels."}]}},{"name":"request_layout","kind":"method","uid":"cui::Element.request_layout","file":"src/core/ui.c3:1529:17","return_type":{"name":"void"},"members":[{"name":"self","type":{"name":"Element*","uid":"cui::Element"},"is_ref":true}],"docs":{"text":"Size or child structure changed: re-layout from here, repaint here. Ancestors\n are marked so the layout walk descends to this element; their own cached sizes\n still short-circuit if nothing about them changes."}},{"name":"request_build","kind":"method","uid":"cui::Element.request_build","file":"src/core/ui.c3:1549:17","return_type":{"name":"void"},"members":[{"name":"self","type":{"name":"Element*","uid":"cui::Element"},"is_ref":true}],"docs":{"text":"Composite state changed: drop the built subtree and re-run `build()` on the\n next flush \u2014 CUI's setState. The release is DEFERRED to the build pass, so this\n is safe to call from event handlers running inside the subtree it condemns\n (releasing immediately would free the very widget whose callback is on the\n stack). Rebuilding cascades: nested composites in the fresh subtree are built in\n the same pass, Flutter-style."}},{"name":"request_paint","kind":"method","uid":"cui::Element.request_paint","file":"src/core/ui.c3:1563:17","return_type":{"name":"void"},"members":[{"name":"self","type":{"name":"Element*","uid":"cui::Element"},"is_ref":true}],"docs":{"text":"Appearance changed but not size: only this element's `paint()` re-runs. On a\n build widget this routes to `request_build` \u2014 a composite has no paint of its\n own, so \"appearance changed\" can only mean \"regenerate the subtree\". That makes\n `@modify` work uniformly: mutate fields, and a leaf repaints while a composite\n rebuilds."}},{"name":"invalidate_watchers","kind":"method","uid":"cui::Ui.invalidate_watchers","file":"src/core/ui.c3:1603:12","return_type":{"name":"void"},"members":[{"name":"self","type":{"name":"Ui*","uid":"cui::Ui"},"is_ref":true},{"name":"element","type":{"name":"Element*","uid":"cui::Element"}},{"name":"type","type":{"name":"typeid"}}],"docs":{"text":"The tree walk behind `Ui.invalidate`. Public only because the macro above\n expands into it.","params":[{"name":"element","description":"Subtree root to visit."},{"name":"type","description":"The provided type that changed."}]}},{"name":"set_offset","kind":"method","uid":"cui::Element.set_offset","file":"src/core/ui.c3:1624:17","return_type":{"name":"void"},"members":[{"name":"self","type":{"name":"Element*","uid":"cui::Element"},"is_ref":true},{"name":"offset","type":{"name":"Vec2","uid":"std::math::vector::Vec2"}}],"docs":{"text":"Manual placement under an absolute container (Stack). Cheap: the subtree's\n cached drawings are re-emitted at the new origin, no `paint()` calls.","params":[{"name":"offset","description":"The new offset relative to the parent, in pixels."}]}},{"name":"set_cursor","kind":"method","uid":"cui::Element.set_cursor","file":"src/core/ui.c3:1655:17","return_type":{"name":"void"},"members":[{"name":"self","type":{"name":"Element*","uid":"cui::Element"},"is_ref":true},{"name":"cursor","type":{"name":"Cursor","uid":"cui::Cursor"}}],"docs":{"text":"Asks for a pointer shape while this element is hovered. Callable from any hook,\n and `on_hover` is where it usually belongs: most interactive widgets implement\n it already to light themselves up, and a shape is only ever wanted for the\n element the pointer is on.\n\n The shape is resolved at the end of every `process_input`, after that frame's\n events are dispatched, so a call from `on_mouse` \u2014 the same handle closing its\n hand on the press that starts a drag \u2014 takes effect on the frame that made it,\n not the one after. It sticks until something writes another: only the hovered\n element and its ancestors are ever asked, so there is nothing to clear on the\n way out, but a widget that changes shape must write the shape BACK. A handle\n that sets CLOSED_HAND on press has to set OPEN_HAND on release, wherever the\n pointer has wandered to by then.\n\n Hover fires on the deepest element under the pointer, never on its ancestors.\n A widget that wants to name the shape over its whole subtree \u2014 a viewport with\n an overlay on top of it \u2014 has no hover to hang that on and should declare it\n from `mount`, which runs once and needs no layout to live in. Resolution walks\n up from the hovered element, so one declaration answers for everything inside\n that does not ask for its own.","params":[{"name":"cursor","description":"The shape, or DEFAULT to defer to the ancestors."}]}},{"name":"request_focus","kind":"method","uid":"cui::Element.request_focus","file":"src/core/ui.c3:1674:17","return_type":{"name":"void"},"members":[{"name":"self","type":{"name":"Element*","uid":"cui::Element"},"is_ref":true}],"docs":{"text":"Directs key events to this element (a left click on an element whose widget\n implements `on_key` does the same automatically)."}},{"name":"set_transform","kind":"method","uid":"cui::Element.set_transform","file":"src/core/ui.c3:1687:17","return_type":{"name":"void"},"members":[{"name":"self","type":{"name":"Element*","uid":"cui::Element"},"is_ref":true},{"name":"transform","type":{"name":"Matrix4f","uid":"std::math::Matrix4f"}}],"docs":{"text":"Animation path: writes one matrix into the palette. The first call allocates a\n slot (forcing one re-emit so the subtree picks up the slot id); every call after\n that costs a 64-byte write plus a palette upload, regardless of how many\n drawings sit under this element.","params":[{"name":"transform","description":"The matrix applied to this element's subtree, in UI pixels."}]}},{"name":"alloc_transform_slot","kind":"method","uid":"cui::Ui.alloc_transform_slot","file":"src/core/ui.c3:1707:12","return_type":{"name":"uint"},"members":[{"name":"self","type":{"name":"Ui*","uid":"cui::Ui"},"is_ref":true}],"docs":{"text":"A palette slot off the free-list, or a fresh identity one.","return":"The slot index, for Element.transform_slot."}},{"name":"layout_child","kind":"method","uid":"cui::Element.layout_child","file":"src/core/ui.c3:1727:17","return_type":{"name":"Vec2","uid":"std::math::vector::Vec2"},"members":[{"name":"self","type":{"name":"Element*","uid":"cui::Element"},"is_ref":true},{"name":"index","type":{"name":"sz","uid":"std::core::sz"}},{"name":"constraints","type":{"name":"Constraints","uid":"cui::Constraints"}}],"docs":{"text":"Lays out one child under the given constraints and returns the size it took.\n The cache short-circuits this when the child is clean and the constraints are\n unchanged, so calling it for every child on every layout is the normal thing.","return":"The size the child chose.","params":[{"name":"index","description":"Index into this element's children."},{"name":"constraints","description":"The size range offered to the child."}]}},{"name":"place_child","kind":"method","uid":"cui::Element.place_child","file":"src/core/ui.c3:1740:17","return_type":{"name":"void"},"members":[{"name":"self","type":{"name":"Element*","uid":"cui::Element"},"is_ref":true},{"name":"index","type":{"name":"sz","uid":"std::core::sz"}},{"name":"offset","type":{"name":"Vec2","uid":"std::math::vector::Vec2"}}],"docs":{"text":"Positions a child relative to this element's origin. Call it after\n `layout_child`, from the same `layout()`.","params":[{"name":"index","description":"Index into this element's children."},{"name":"offset","description":"The child's origin relative to this element, in pixels."}]}},{"name":"layout_children","kind":"method","uid":"cui::Element.layout_children","file":"src/core/ui.c3:1755:17","return_type":{"name":"void"},"members":[{"name":"self","type":{"name":"Element*","uid":"cui::Element"},"is_ref":true},{"name":"constraints","type":{"name":"Constraints","uid":"cui::Constraints"}}],"docs":{"text":"Lays every child out under the same constraints, discarding the sizes and\n leaving the offsets alone \u2014 what a container that stacks its children in one\n place does, and what the framework itself does for a widget with no `layout`.\n\n For anything that positions children by measuring them, use `layout_child` per\n child and keep the size it returns.","params":[{"name":"constraints","description":"The range offered to each child."}]}},{"name":"flush","kind":"method","uid":"cui::Ui.flush","file":"src/core/ui.c3:1769:12","return_type":{"name":"void"},"members":[{"name":"self","type":{"name":"Ui*","uid":"cui::Ui"},"is_ref":true}],"docs":{"text":"Services whatever was invalidated since the last frame \u2014 build, then layout,\n then paint + emit \u2014 and leaves the result in `ui.canvas` for the renderer. Call\n once per frame, after `process_input` and after any app-side mutation. Returns\n immediately when nothing is pending, which is what lets an idle UI cost nothing."}},{"name":"build_element","kind":"method","uid":"cui::Ui.build_element","file":"src/core/ui.c3:1818:12","return_type":{"name":"void"},"members":[{"name":"self","type":{"name":"Ui*","uid":"cui::Ui"},"is_ref":true},{"name":"element","type":{"name":"Element*","uid":"cui::Element"}}],"docs":{"text":"Build pass: materialize composite widgets. Runs before layout, so `build` may\n freely append / request_layout \u2014 nothing is mid-pass yet. Recursing into\n children AFTER building the element means composites nested inside a freshly\n built subtree are built in the same pass, however deep they stack \u2014 so a rebuild\n regenerates its nested composites too, Flutter-style.\n\n A rebuild is a naive replace: the old subtree is released wholesale (unmount\n hooks fire, elements recycle) and `build()` runs fresh. The contract that makes\n this correct rather than lossy: build is a pure function of the composite's OWN\n fields \u2014 state that must survive a rebuild belongs on the composite (or above),\n not on widgets inside the built subtree. See build.md.","params":[{"name":"element","description":"The subtree root to build."}]}},{"name":"layout_element","kind":"method","uid":"cui::Ui.layout_element","file":"src/core/ui.c3:1850:12","return_type":{"name":"Vec2","uid":"std::math::vector::Vec2"},"members":[{"name":"self","type":{"name":"Ui*","uid":"cui::Ui"},"is_ref":true},{"name":"element","type":{"name":"Element*","uid":"cui::Element"}},{"name":"constraints","type":{"name":"Constraints","uid":"cui::Constraints"}}],"docs":{"text":"Layout pass: size one element under constraints, recursing through whatever its\n `layout()` asks for. Not dirty and same constraints means same size, so none of\n the subtree's layout code runs \u2014 that cache is what keeps a local change local.\n\n Also where `mount` fires, the first time an element is reached. Every element\n in the tree is reached by this walk before it can be painted or hit tested, so\n that is the earliest point at which a hook can see a wired parent chain.","return":"The size it took.","params":[{"name":"element","description":"The element to size."},{"name":"constraints","description":"The size range offered to it."}]}},{"name":"emit","kind":"method","uid":"cui::Ui.emit","file":"src/core/ui.c3:1928:12","return_type":{"name":"void"},"members":[{"name":"self","type":{"name":"Ui*","uid":"cui::Ui"},"is_ref":true},{"name":"element","type":{"name":"Element*","uid":"cui::Element"}},{"name":"origin","type":{"name":"Vec2","uid":"std::math::vector::Vec2"}},{"name":"inherited_slot","type":{"name":"uint"}},{"name":"inherited_clip","type":{"name":"uint"}}],"docs":{"text":"Paint + emit pass: repaint dirty elements into their local caches, then append\n every element's drawings to the canvas shifted to absolute coordinates, stamped\n with the transform slot and clip id in force. A moved-but-clean element re-emits\n from cache without its `paint()` running.","params":[{"name":"element","description":"The subtree root to emit."},{"name":"origin","description":"The parent's absolute origin, in UI pixels."},{"name":"inherited_slot","description":"The transform palette slot in force, 0 = identity."},{"name":"inherited_clip","description":"The clip entry in force, 0 = unclipped."}]}},{"name":"rect","kind":"method","uid":"cui::Painter.rect","file":"src/core/ui.c3:2042:17","return_type":{"name":"void"},"members":[{"name":"self","type":{"name":"Painter*","uid":"cui::Painter"},"is_ref":true},{"name":"pos","type":{"name":"Vec2","uid":"std::math::vector::Vec2"}},{"name":"size","type":{"name":"Vec2","uid":"std::math::vector::Vec2"}},{"name":"style","type":{"name":"RectStyle","uid":"cui::RectStyle"},"default_value":"{ }"}],"docs":{"text":"A (rounded) rectangle.","params":[{"name":"pos","description":"Top-left corner, local to the element."},{"name":"size","description":"Width and height in pixels."},{"name":"style","description":"Fill, border and corner radii."}]}},{"name":"circle","kind":"method","uid":"cui::Painter.circle","file":"src/core/ui.c3:2066:17","return_type":{"name":"void"},"members":[{"name":"self","type":{"name":"Painter*","uid":"cui::Painter"},"is_ref":true},{"name":"center","type":{"name":"Vec2","uid":"std::math::vector::Vec2"}},{"name":"radius","type":{"name":"float"}},{"name":"style","type":{"name":"CircleStyle","uid":"cui::CircleStyle"},"default_value":"{ }"}],"docs":{"text":"A circle.","params":[{"name":"center","description":"Center, local to the element."},{"name":"radius","description":"Radius in pixels."},{"name":"style","description":"Fill and border."}]}},{"name":"ellipse","kind":"method","uid":"cui::Painter.ellipse","file":"src/core/ui.c3:2079:17","return_type":{"name":"void"},"members":[{"name":"self","type":{"name":"Painter*","uid":"cui::Painter"},"is_ref":true},{"name":"center","type":{"name":"Vec2","uid":"std::math::vector::Vec2"}},{"name":"radii","type":{"name":"Vec2","uid":"std::math::vector::Vec2"}},{"name":"style","type":{"name":"CircleStyle","uid":"cui::CircleStyle"},"default_value":"{ }"}],"docs":{"text":"An axis-aligned ellipse.","params":[{"name":"center","description":"Center, local to the element."},{"name":"radii","description":"Horizontal and vertical radius in pixels."},{"name":"style","description":"Fill and border."}]}},{"name":"line","kind":"method","uid":"cui::Painter.line","file":"src/core/ui.c3:2105:17","return_type":{"name":"void"},"members":[{"name":"self","type":{"name":"Painter*","uid":"cui::Painter"},"is_ref":true},{"name":"from","type":{"name":"Vec2","uid":"std::math::vector::Vec2"}},{"name":"to","type":{"name":"Vec2","uid":"std::math::vector::Vec2"}},{"name":"thickness","type":{"name":"float"}},{"name":"color","type":{"name":"Color","uid":"cui::Color"}}],"docs":{"text":"A line segment with rounded caps.","params":[{"name":"from","description":"Start point, local to the element."},{"name":"to","description":"End point, local to the element."},{"name":"thickness","description":"Stroke width in pixels."},{"name":"color","description":"Stroke color."}]}},{"name":"arc","kind":"method","uid":"cui::Painter.arc","file":"src/core/ui.c3:2135:17","return_type":{"name":"void"},"members":[{"name":"self","type":{"name":"Painter*","uid":"cui::Painter"},"is_ref":true},{"name":"center","type":{"name":"Vec2","uid":"std::math::vector::Vec2"}},{"name":"radius","type":{"name":"float"}},{"name":"start","type":{"name":"float"}},{"name":"sweep","type":{"name":"float"}},{"name":"thickness","type":{"name":"float"}},{"name":"color","type":{"name":"Color","uid":"cui::Color"}}],"docs":{"text":"A stroked circular arc with rounded caps \u2014 progress rings and spinners.","params":[{"name":"center","description":"Center of the circle, local to the element."},{"name":"radius","description":"Radius of the arc's centerline, in pixels."},{"name":"start","description":"Start angle in radians (0 = +x, increasing clockwise)."},{"name":"sweep","description":"Angle spanned, in radians. 2\u03c0 or more draws the full ring."},{"name":"thickness","description":"Stroke width in pixels."},{"name":"color","description":"Stroke color."}]}},{"name":"rect_shadow","kind":"method","uid":"cui::Painter.rect_shadow","file":"src/core/ui.c3:2163:17","return_type":{"name":"void"},"members":[{"name":"self","type":{"name":"Painter*","uid":"cui::Painter"},"is_ref":true},{"name":"pos","type":{"name":"Vec2","uid":"std::math::vector::Vec2"}},{"name":"size","type":{"name":"Vec2","uid":"std::math::vector::Vec2"}},{"name":"blur","type":{"name":"float"}},{"name":"color","type":{"name":"Color","uid":"cui::Color"}},{"name":"border_radius","type":{"name":"Vec4","uid":"std::math::vector::Vec4"},"default_value":"{ }"}],"docs":{"text":"A soft drop shadow of a (rounded) rect: the edge fades over `blur` px each way.\n Paint it before the shape casting it; a border_radius of half the size makes it\n circular.","params":[{"name":"pos","description":"Top-left corner of the shape casting the shadow, local to the element."},{"name":"size","description":"Size of that shape, in pixels."},{"name":"blur","description":"Fade distance each way from the edge, in pixels."},{"name":"color","description":"Shadow color."},{"name":"border_radius","description":"Per-corner radii {TL, TR, BR, BL} of the shape."}]}},{"name":"key_down","kind":"method","uid":"cui::Input.key_down","file":"src/core/input.c3:248:15","return_type":{"name":"bool"},"members":[{"name":"self","type":{"name":"Input*","uid":"cui::Input"},"is_ref":true},{"name":"key","type":{"name":"Key","uid":"cui::Key"}}],"docs":{"text":"Whether a key is held right now \u2014 the level query, as against the edges\n delivered to `Widget.on_key`.","return":"True while the key is down.","params":[{"name":"key","description":"The key to test."}]}},{"name":"process_input","kind":"method","uid":"cui::Ui.process_input","file":"src/core/input.c3:291:12","return_type":{"name":"void"},"members":[{"name":"self","type":{"name":"Ui*","uid":"cui::Ui"},"is_ref":true},{"name":"frame","type":{"name":"InputFrame","uid":"cui::InputFrame"}},{"name":"dt","type":{"name":"float"}}],"docs":{"text":"Updates `ui.input`, hit-tests the tree and dispatches this frame of input to\n the widget callbacks (`on_mouse` / `on_hover` / `on_key`, with bubbling), then\n runs `update(dt)` on every widget implementing it.\n\n Call once per frame, before mutating the tree and before `Ui.flush`. Handlers\n may unmount elements from their own subtree; do not structurally modify\n unrelated parts of the tree from inside a handler.","params":[{"name":"frame","description":"What the embedder knows about input this frame, in UI coordinates."},{"name":"dt","description":"Seconds since the last frame \u2014 passed on to update()."}]}},{"name":"dispatch_mouse","kind":"method","uid":"cui::Ui.dispatch_mouse","file":"src/core/input.c3:422:16","return_type":{"name":"Element*","uid":"cui::Element"},"members":[{"name":"self","type":{"name":"Ui*","uid":"cui::Ui"},"is_ref":true},{"name":"element","type":{"name":"Element*","uid":"cui::Element"}},{"name":"event","type":{"name":"MouseEvent","uid":"cui::MouseEvent"}}],"docs":{"text":"Bubbles the event from `element` toward the root; each widget gets the position\n translated into its own local space.","return":"The element that consumed the event, or null if nobody did.","params":[{"name":"element","description":"The deepest element the event is aimed at \u2014 usually the hit-test result."},{"name":"event","description":"The event, with its absolute position set; the element-local pos is filled in per widget."}]}},{"name":"dispatch_key","kind":"method","uid":"cui::Ui.dispatch_key","file":"src/core/input.c3:441:12","return_type":{"name":"void"},"members":[{"name":"self","type":{"name":"Ui*","uid":"cui::Ui"},"is_ref":true},{"name":"event","type":{"name":"KeyEvent","uid":"cui::KeyEvent"}}],"docs":{"text":"Delivers a key edge to the focused element, bubbling toward the root until a\n widget consumes it. A no-op when nothing is focused.","params":[{"name":"event","description":"The key edge to deliver."}]}},{"name":"hit_test","kind":"method","uid":"cui::Ui.hit_test","file":"src/core/input.c3:465:16","return_type":{"name":"Element*","uid":"cui::Element"},"members":[{"name":"self","type":{"name":"Ui*","uid":"cui::Ui"},"is_ref":true},{"name":"point","type":{"name":"Vec2","uid":"std::math::vector::Vec2"}}],"docs":{"text":"The deepest element whose rect contains the point, searched in reverse paint\n order so the visually-topmost one wins \u2014 skipping any element that set\n `ignores_pointer` from its layout.\n\n Uses the absolute origins stored by the last emit. Two documented\n simplifications: transform-palette matrices (`set_transform`) are NOT applied to\n hit tests, and a clipping element gates by its rect only \u2014 a point in a\n clipped-away rounded corner still hits.","return":"The element under the point, or null.","params":[{"name":"point","description":"The position in UI coordinates."}]}},{"name":"hit_test_element","kind":"method","uid":"cui::Ui.hit_test_element","file":"src/core/input.c3:478:16","return_type":{"name":"Element*","uid":"cui::Element"},"members":[{"name":"self","type":{"name":"Ui*","uid":"cui::Ui"},"is_ref":true},{"name":"element","type":{"name":"Element*","uid":"cui::Element"}},{"name":"point","type":{"name":"Vec2","uid":"std::math::vector::Vec2"}}],"docs":{"text":"Hit-tests one subtree \u2014 the recursive half of `hit_test`.","return":"The deepest element in this subtree under the point, or null.","params":[{"name":"element","description":"The subtree root to test."},{"name":"point","description":"The position in UI coordinates."}]}},{"name":"update_focus","kind":"method","uid":"cui::Ui.update_focus","file":"src/core/input.c3:514:12","return_type":{"name":"void"},"members":[{"name":"self","type":{"name":"Ui*","uid":"cui::Ui"},"is_ref":true},{"name":"hit","type":{"name":"Element*","uid":"cui::Element"}}],"docs":{"text":"Focuses the deepest element at or above `hit` whose widget implements\n `on_key` \u2014 what a left press does automatically. Clears the focus when there is\n no such element.","params":[{"name":"hit","description":"The element under the pointer, or null."}]}},{"name":"tick","kind":"method","uid":"cui::Ui.tick","file":"src/core/input.c3:533:12","return_type":{"name":"void"},"members":[{"name":"self","type":{"name":"Ui*","uid":"cui::Ui"},"is_ref":true},{"name":"element","type":{"name":"Element*","uid":"cui::Element"}},{"name":"dt","type":{"name":"float"}}],"docs":{"text":"Runs the optional per-frame `update(dt)` hook on every widget in the subtree.","params":[{"name":"element","description":"The subtree root to tick."},{"name":"dt","description":"Seconds since the last frame."}]}},{"name":"init","kind":"method","uid":"cui::Canvas.init","file":"src/render/canvas.c3:104:16","return_type":{"name":"void"},"members":[{"name":"self","type":{"name":"Canvas*","uid":"cui::Canvas"},"is_ref":true}],"docs":{"text":"Seeds the identity transform and the no-clip entry in slot 0 of each list.\n Called by `new_ui`."}},{"name":"free","kind":"method","uid":"cui::Canvas.free","file":"src/render/canvas.c3:116:16","return_type":{"name":"void"},"members":[{"name":"self","type":{"name":"Canvas*","uid":"cui::Canvas"},"is_ref":true}],"docs":{"text":"Frees the three lists. Called by `Ui.free`."}},{"name":"init","kind":"method","uid":"cui::TextSystem.init","file":"src/render/text.c3:83:20","return_type":{"name":"void"},"members":[{"name":"self","type":{"name":"TextSystem*","uid":"cui::TextSystem"},"is_ref":true}],"docs":null},{"name":"free","kind":"method","uid":"cui::TextSystem.free","file":"src/render/text.c3:91:20","return_type":{"name":"void"},"members":[{"name":"self","type":{"name":"TextSystem*","uid":"cui::TextSystem"},"is_ref":true}],"docs":null},{"name":"load_font","kind":"method","uid":"cui::Ui.load_font","file":"src/render/text.c3:107:15","return_type":{"name":"FontId?","uid":"cui::FontId"},"members":[{"name":"self","type":{"name":"Ui*","uid":"cui::Ui"},"is_ref":true},{"name":"path","type":{"name":"String"}}],"docs":{"text":"Loads a TrueType font for `Painter.text` / the Label widget. Fonts stay\n loaded for the lifetime of the Ui.","return":"The FontId to reference the font with in text styles.","params":[{"name":"path","description":"Path to a .ttf file (or .ttc; the first font is used)."}]}},{"name":"load_font_bytes","kind":"method","uid":"cui::Ui.load_font_bytes","file":"src/render/text.c3:120:15","return_type":{"name":"FontId?","uid":"cui::FontId"},"members":[{"name":"self","type":{"name":"Ui*","uid":"cui::Ui"},"is_ref":true},{"name":"data","type":{"name":"char[]"}}],"docs":{"text":"Same as `load_font`, from font bytes already in memory (the bytes are copied).","return":"The FontId to reference the font with in text styles.","params":[{"name":"data","description":"Contents of a .ttf file."}]}},{"name":"measure","kind":"method","uid":"cui::TextSystem.measure","file":"src/render/text.c3:136:20","return_type":{"name":"Vec2","uid":"std::math::vector::Vec2"},"members":[{"name":"self","type":{"name":"TextSystem*","uid":"cui::TextSystem"},"is_ref":true},{"name":"font_id","type":{"name":"FontId","uid":"cui::FontId"}},{"name":"str","type":{"name":"String"}},{"name":"size","type":{"name":"float"},"default_value":"0"}],"docs":{"text":"Size of `str` at an em size: x = advance width of the run (kerning included),\n y = ascent - descent. What the Label widget sizes itself with.","return":"The measured size in pixels; zero when font_id is not loaded.","params":[{"name":"font_id","description":"The font to measure with."},{"name":"str","description":"UTF-8 text, single line."},{"name":"size","description":"Em size in px; 0 uses DEFAULT_TEXT_SIZE."}]}},{"name":"glyph","kind":"method","uid":"cui::TextSystem.glyph","file":"src/render/text.c3:164:25","return_type":{"name":"GlyphSlot","uid":"cui::GlyphSlot"},"members":[{"name":"self","type":{"name":"TextSystem*","uid":"cui::TextSystem"},"is_ref":true},{"name":"font_id","type":{"name":"FontId","uid":"cui::FontId"}},{"name":"glyph_index","type":{"name":"uint"}}],"docs":{"text":"The baked glyph for (font, glyph index), baking and packing it into the atlas\n on first request. `has_bitmap` is false for glyphs with no outline and when\n the atlas ran out of space (warned once; those glyphs simply don't draw)."}},{"name":"bake","kind":"method","uid":"cui::TextSystem.bake","file":"src/render/text.c3:173:25","return_type":{"name":"GlyphSlot","uid":"cui::GlyphSlot"},"members":[{"name":"self","type":{"name":"TextSystem*","uid":"cui::TextSystem"},"is_ref":true},{"name":"font_id","type":{"name":"FontId","uid":"cui::FontId"}},{"name":"glyph_index","type":{"name":"uint"}}],"docs":null},{"name":"text","kind":"method","uid":"cui::Painter.text","file":"src/render/text.c3:244:17","return_type":{"name":"Vec2","uid":"std::math::vector::Vec2"},"members":[{"name":"self","type":{"name":"Painter*","uid":"cui::Painter"},"is_ref":true},{"name":"pos","type":{"name":"Vec2","uid":"std::math::vector::Vec2"}},{"name":"str","type":{"name":"String"}},{"name":"style","type":{"name":"TextStyle","uid":"cui::TextStyle"},"default_value":"{ }"}],"docs":{"text":"A single line of SDF text. `pos` is the TOP-LEFT of the line box; the\n baseline sits at pos.y + ascent. Glyphs are kerned (legacy kern table;\n GPOS-only fonts get none) and baked into the shared atlas on first use.","return":"The size of the emitted run, as TextSystem.measure reports it.","params":[{"name":"pos","description":"Top-left of the line box, local to the element."},{"name":"str","description":"UTF-8 text; control characters render as missing glyphs."},{"name":"style","description":"Font, em size and color."}]}}],"macros":[{"name":"@is_widget","kind":"macro","uid":"cui::@is_widget","file":"src/core/ui.c3:313:12","return_type":{"name":"bool"},"is_at_macro":true,"members":[{"name":"#expr"}],"docs":{"text":"True when `#expr` can be attached as a widget: a struct implementing Widget,\n passed either by value or as a pointer. Used by the contracts on the node\n macros, so a bad argument is a compile-time error naming the actual problem.","return":"True if the expression is a Widget value or a pointer to one.","params":[{"name":"#expr","description":"The candidate widget expression."}]},"attributes":["@const"]},{"name":"@is_widget_type","kind":"macro","uid":"cui::@is_widget_type","file":"src/core/ui.c3:329:12","return_type":{"name":"bool"},"is_at_macro":true,"members":[{"name":"$Type"}],"docs":{"text":"True when `$Type` implements Widget \u2014 the type-keyed twin of `@is_widget`, for\n the lookup macros that take a type rather than a widget.","return":"True if $Type implements the Widget interface.","params":[{"name":"$Type","description":"The candidate widget type."}]},"attributes":["@const"]},{"name":"@detect_size_field","kind":"macro","uid":"cui::@detect_size_field","file":"src/core/ui.c3:663:12","visibility":"private","return_type":{"name":"void"},"is_at_macro":true,"members":[{"name":"$Type"},{"name":"element","type":{"name":"Element*","uid":"cui::Element"}}],"docs":{"text":"The compile-time half of the size-field convention: a widget whose struct\n carries a `Vec2 size` field and implements no `layout` is sized by that\n field, with no layout code written. This macro runs where the node macros\n still know the concrete type \u2014 the only place the field is visible at all,\n since the element stores the widget behind the type-erased interface \u2014 and\n plants a typed getter for the layout pass to call. The getter reads the live\n field every layout, so mutating `size` and requesting layout resizes the\n element.\n\n An explicit `layout` opts out entirely: those widgets are sized by their\n method and the field means whatever they say it means (the built-in\n containers all keep `layout`, which is why their \"0 = fill\" fields never\n collide with this).","params":[{"name":"$Type","description":"The concrete widget type."},{"name":"element","description":"The element just built for it."}]}},{"name":"@canvas","kind":"macro","uid":"cui::@canvas","file":"src/core/ui.c3:1192:12","return_type":{"name":"void"},"is_at_macro":true,"members":[{"name":"ui","type":{"name":"Ui*","uid":"cui::Ui"}},{"name":"@body","kind":"body_param","params":[]}],"docs":{"text":"Opens a build scope and installs what the body builds as the UI root. Inside\n the body `@tree` and `@node` need no ui and attach themselves to the enclosing\n node:\n\n     `@canvas(ui)`\n     `{`\n     `    @tree((Column){ .gap = 8.0 })`\n     `    {`\n     `        @node((Rectangle){ .size = {100, 40} });`\n     `        for (int i = 0; i < 4; i++) @node((Rectangle){ .size = {80, 20} });`\n     `    };`\n     `};`\n\n The single node built at the top level of the body becomes the UI root. Both\n inner macros return the `Element*`, so handles still chain \u2014\n `@node(...).with_id(\"card\")`, `Element* col = @tree(...) { ... };` \u2014 and plain\n statements (loops, locals, `set_offset` on a returned handle) mix freely into\n the bodies.","params":[{"name":"ui","description":"The Ui to build into."}]}},{"name":"@subtree","kind":"macro","uid":"cui::@subtree","file":"src/core/ui.c3:1219:16","return_type":{"name":"Element*","uid":"cui::Element"},"is_at_macro":true,"members":[{"name":"ui","type":{"name":"Ui*","uid":"cui::Ui"}},{"name":"@body","kind":"body_param","params":[]}],"docs":{"text":"The detached twin of `@canvas`: returns the body's single top-level node\n instead of installing it \u2014 the shape of a composite's `build()`:","return":"The single node built at the top level of the body, detached.","params":[{"name":"ui","description":"The Ui to build into \u2014 inside build(), elem.ui."}]}},{"name":"@tree","kind":"macro","uid":"cui::@tree","file":"src/core/ui.c3:1250:16","return_type":{"name":"Element*","uid":"cui::Element"},"is_at_macro":true,"members":[{"name":"widget"},{"name":"@body","kind":"body_param","params":[]}],"docs":{"text":"Container node: attaches to the enclosing scope (or becomes the body's root),\n then IS the enclosing scope for its own body. Children needing statements \u2014\n loops, locals, chained `set_offset`, nesting \u2014 belong in a `@tree` body; a row\n of plain leaves can ride as `@node` varargs instead.","return":"The element, attached.","params":[{"name":"widget","description":"The widget: a struct value (copied and owned) or a pointer to one (borrowed)."}]}},{"name":"@node","kind":"macro","uid":"cui::@node","file":"src/core/ui.c3:1281:16","return_type":{"name":"Element*","uid":"cui::Element"},"is_at_macro":true,"members":[{"name":"widget"}],"docs":{"text":"Leaf node: attaches to the enclosing scope (or becomes the body's root).\n\n Extra arguments are leaf WIDGETS (values or borrowed pointers, like the first)\n attached as children in order \u2014 a one-call subtree for the common row-of-leaves\n shape, without a `@tree` body:\n\n     `@node((Row){ .gap = 16.0 },`\n     `    (Button){ .on_click = &reset },`\n     `    (Button){ .on_click = &bump });`\n\n Unlike `ui.@node`'s varargs these never take `Element*` \u2014 an already-attached\n node passed here would attach twice, and the compiler rejects it (`Element*` is\n not a Widget).","return":"The element, attached, with any extra widgets attached under it as children.","params":[{"name":"widget","description":"The widget: a struct value (copied and owned) or a pointer to one (borrowed)."}]}}],"macro_methods":[{"name":"inherit","kind":"macro_method","uid":"cui::Ui.inherit","file":"src/core/ui.c3:579:10","members":[{"name":"self","type":{"name":"Ui*","uid":"cui::Ui"},"is_ref":true},{"name":"$Type"}],"docs":{"text":"The provided value of a type. See `Ui.provide`.\n\n Prefer `Element.inherit` at call sites; see the note there.\n\n A fault rather than a null, matching `find` / `find_id` above \u2014 this is the\n same kind of question (ask the tree for something that may not be there) and\n it should fail the same way. It also decides how the mistake reads: `!!` on a\n missing provider panics naming NOT_PROVIDED at the call site, where a returned\n null would segfault one line later inside the caller's own code, pointing at\n the wrong thing entirely.","return":"Pointer to the provided value.","params":[{"name":"$Type","description":"The provided type itself, not its pointer \u2014 inherit(AppState)."}]}},{"name":"@node","kind":"macro_method","uid":"cui::Ui.@node","file":"src/core/ui.c3:629:19","return_type":{"name":"Element*","uid":"cui::Element"},"is_at_macro":true,"members":[{"name":"self","type":{"name":"Ui*","uid":"cui::Ui"},"is_ref":true},{"name":"widget"}],"docs":{"text":"Declarative building: create an element for a widget together with its\n children, Flutter-style. Pass the widget as a VALUE (a struct literal \u2014 the\n element heap-copies and owns it) or as a POINTER (borrowed; the caller owns the\n struct and can mutate it, but must keep it alive). Children are elements built\n by nested `@node` calls. Attach the finished tree with `Ui.build`, or graft it\n onto a live element with `Element.append`.\n\n     ui.build(ui.@node((Column){ .gap = 8.0 },\n         ui.@node((Rectangle){ .size = {100, 40} }),\n         ui.@node((Rectangle){ .size = {100, 40} })));\n\n The scoped builder (`@canvas` / `@tree` / `@node`) is sugar over this and reads\n better for whole trees; this stays the detached primitive.","return":"The new, detached element.","params":[{"name":"widget","description":"The widget: a struct value (copied and owned) or a pointer to one (borrowed)."}]}},{"name":"widget_as","kind":"macro_method","uid":"cui::Element.widget_as","file":"src/core/ui.c3:689:15","members":[{"name":"self","type":{"name":"Element*","uid":"cui::Element"},"is_ref":true},{"name":"$Type"}],"docs":{"text":"The inverse of `@node`: recover the concrete widget behind an element as a\n typed pointer. An `Element*` is a stable handle to a tree node (it survives\n relayout and repaint), so holding one is CUI's equivalent of a Flutter\n GlobalKey \u2014 a callback that keeps it can read and mutate that widget's own\n state, then `request_paint()`, without a wrapper struct. Unchecked: the caller\n asserts $Type, the same assertion it made when it built the node.","return":"A pointer to the element's widget.","params":[{"name":"$Type","description":"The widget type this element was built with."}]}},{"name":"is_widget","kind":"macro_method","uid":"cui::Element.is_widget","file":"src/core/ui.c3:702:20","return_type":{"name":"bool"},"members":[{"name":"self","type":{"name":"Element*","uid":"cui::Element"},"is_ref":true},{"name":"$Type"}],"docs":{"text":"Whether this element's widget is exactly $Type \u2014 the test `@each` runs on\n every element, exposed for `@walk` bodies that sort several types out of one\n pass. Exact, not \"assignable to\": a widget is one concrete type here.","params":[{"name":"$Type","description":"The widget type to test for."}]}},{"name":"inherit","kind":"macro_method","uid":"cui::Element.inherit","file":"src/core/ui.c3:721:15","members":[{"name":"self","type":{"name":"Element*","uid":"cui::Element"},"is_ref":true},{"name":"$Type"}],"docs":{"text":"The embedder value of a type, as seen from this element. See `Ui.provide`.\n\n Prefer this over `elem.ui.inherit` even though they are the same call today.\n Every provider currently lives on the Ui, so the lookup cannot depend on where\n in the tree it was made \u2014 but a themed subtree or a scoped locale would put\n providers on elements, and this is the call that would then start walking\n parents. Written this way, that change is confined to this macro; written the\n other way it is every call site in every app.","return":"Pointer to the provided value.","params":[{"name":"$Type","description":"The provided type itself, not its pointer."}]}},{"name":"watch","kind":"macro_method","uid":"cui::Element.watch","file":"src/core/ui.c3:746:15","members":[{"name":"self","type":{"name":"Element*","uid":"cui::Element"},"is_ref":true},{"name":"$Type"}],"docs":{"text":"`inherit`, and a standing request to be invalidated when that value changes.\n\n The mover then names only what it wrote \u2014 `ui.invalidate(OrbitCamera)` \u2014 and\n every hook that read it re-runs, in the phase it read it from: a `paint` that\n watches repaints, a `layout` that watches re-layouts, a `build` that watches\n rebuilds. Nobody has to know who the readers are, which is the whole point:\n painting is cached per element, so the alternative is each writer naming the\n elements it believes are affected, and that list goes stale the moment a widget\n moves in the tree or a second pane appears.\n\n Watches are re-declared on every run of the hook and the previous run's are\n dropped, so a branch that stops reading a value stops being invalidated by it.\n\n ONLY counts inside `build`, `layout` and `paint` \u2014 the calls whose result is\n cached and therefore can go stale. From an event handler, `mount` or a free\n function this is exactly `inherit`: handlers run on every event already, so\n there is nothing to invalidate.","return":"Pointer to the provided value.","params":[{"name":"$Type","description":"The provided type itself, not its pointer."}]}},{"name":"@watching","kind":"macro_method","uid":"cui::Ui.@watching","file":"src/core/ui.c3:805:15","return_type":{"name":"void"},"is_at_macro":true,"members":[{"name":"self","type":{"name":"Ui*","uid":"cui::Ui"},"is_ref":true},{"name":"element","type":{"name":"Element*","uid":"cui::Element"}},{"name":"kind","type":{"name":"WatchKind","uid":"cui::WatchKind"}},{"name":"@body","kind":"body_param","params":[]}],"docs":{"text":"Runs one widget hook with `Element.watch` attributing to it: the previous run's\n watches of this kind are dropped first, and the cursor is restored afterwards\n so a nested dispatch (layout, which lays its children out from inside itself)\n hands attribution back to the outer one.","params":[{"name":"element","description":"The element whose hook is about to run."},{"name":"kind","description":"Which hook it is."}]}},{"name":"find","kind":"macro_method","uid":"cui::Ui.find","file":"src/core/ui.c3:843:10","members":[{"name":"self","type":{"name":"Ui*","uid":"cui::Ui"},"is_ref":true},{"name":"$Type"}],"docs":{"text":"Query the retained tree by widget type: the first element whose widget is\n exactly $Type, or a WIDGET_NOT_FOUND fault. The top-down analog of Flutter's\n findAncestorStateOfType. The returned `Element*` is a stable handle (valid\n across frames), and it is *the* thing to hold when a callback will both read\n and invalidate a widget: resolve it once here, then `widget_as` (a cast) and\n `request_paint` (a flag flip) are both search-free. That is the hot path \u2014 the\n `get_widget` / `request_paint` twins below each re-walk the tree, so pairing\n them to mutate-then-repaint one node walks it twice. Use those only for\n one-shots.","return":"The first element whose widget is $Type.","params":[{"name":"$Type","description":"The widget type to look for."}]}},{"name":"get_widget","kind":"macro_method","uid":"cui::Ui.get_widget","file":"src/core/ui.c3:876:10","members":[{"name":"self","type":{"name":"Ui*","uid":"cui::Ui"},"is_ref":true},{"name":"$Type"}],"docs":{"text":"One-shot convenience over `find`: hand back the widget pointer directly\n (`get_widget(Dial)` \u2192 `Dial*`), or re-raise WIDGET_NOT_FOUND. One tree walk \u2014\n right for reading a singleton's field. To mutate AND repaint, hold the\n `Element*` from `find` instead, so invalidation doesn't walk the tree a second\n time. A callback reaches this through a Ui it is handed \u2014 a Button passes its\n own element's ui to `on_click`, so no global and no app-threaded handle is\n needed. Acts on the first $Type in the tree, so it fits singletons (one Dial,\n one settings panel); name a node with `with_id` when several coexist.","return":"A pointer to the first $Type widget in the tree.","params":[{"name":"$Type","description":"The widget type to look for."}]}},{"name":"request_paint","kind":"macro_method","uid":"cui::Ui.request_paint","file":"src/core/ui.c3:889:10","members":[{"name":"self","type":{"name":"Ui*","uid":"cui::Ui"},"is_ref":true},{"name":"$Type"}],"docs":{"text":"One-shot invalidate by type: one tree walk, a no-op if absent. Same caveat \u2014 if\n you already hold the element, call `elem.request_paint()` and skip the walk.","params":[{"name":"$Type","description":"The widget type to repaint."}]}},{"name":"get_widget_id","kind":"macro_method","uid":"cui::Ui.get_widget_id","file":"src/core/ui.c3:986:10","members":[{"name":"self","type":{"name":"Ui*","uid":"cui::Ui"},"is_ref":true},{"name":"id","type":{"name":"String"}},{"name":"$Type"}],"docs":{"text":"One-shot twin keyed by id \u2014 same single-walk cost and same caveat: hold the\n `Element*` from `find_id` to mutate-then-repaint without a second walk. Still\n takes $Type: the id selects which node, the type says how to hand its widget\n back.","return":"A pointer to the widget of the element carrying the id.","params":[{"name":"id","description":"The name given with with_id."},{"name":"$Type","description":"The widget type of that node."}]}},{"name":"request_paint_id","kind":"macro_method","uid":"cui::Ui.request_paint_id","file":"src/core/ui.c3:997:10","members":[{"name":"self","type":{"name":"Ui*","uid":"cui::Ui"},"is_ref":true},{"name":"id","type":{"name":"String"}}],"docs":{"text":"One-shot invalidate by id: one tree walk, a no-op if absent.","params":[{"name":"id","description":"The name given with with_id."}]}},{"name":"@modify","kind":"macro_method","uid":"cui::Ui.@modify","file":"src/core/ui.c3:1021:15","return_type":{"name":"void"},"is_at_macro":true,"members":[{"name":"self","type":{"name":"Ui*","uid":"cui::Ui"},"is_ref":true},{"name":"$Type"},{"name":"@body","kind":"body_param","params":[{"name":"widget"}]}],"docs":{"text":"Walks the tree a single time, hands the body the typed widget, then\n `request_paint()`s the element, so\n\n     ui.@modify(Dial; d) { d.value = 0; };\n\n is the one-walk equal of `find` + `widget_as` + `request_paint`. The body runs\n only if the node exists (a silent no-op otherwise), and the invalidation is\n kind-aware: a painting widget repaints, a composite rebuilds its subtree\n (`request_paint` routes to `request_build`). For a change that resizes a\n non-composite widget (needing `request_layout`) hold the `Element*` from `find`\n and invalidate it yourself.","params":[{"name":"$Type","description":"The widget type to modify."}]}},{"name":"@modify_id","kind":"macro_method","uid":"cui::Ui.@modify_id","file":"src/core/ui.c3:1040:15","return_type":{"name":"void"},"is_at_macro":true,"members":[{"name":"self","type":{"name":"Ui*","uid":"cui::Ui"},"is_ref":true},{"name":"id","type":{"name":"String"}},{"name":"$Type"},{"name":"@body","kind":"body_param","params":[{"name":"widget"}]}],"docs":{"text":"The id-keyed twin of `@modify` \u2014 names the node instead of finding it by type\n (still passing $Type to type the widget):\n\n     ui.@modify_id(\"teal\", Rectangle; card) { card.style.color = red; };","params":[{"name":"id","description":"The name given with with_id."},{"name":"$Type","description":"The widget type of that node."}]}},{"name":"@walk","kind":"macro_method","uid":"cui::Ui.@walk","file":"src/core/ui.c3:1081:15","return_type":{"name":"void"},"is_at_macro":true,"members":[{"name":"self","type":{"name":"Ui*","uid":"cui::Ui"},"is_ref":true},{"name":"@body","kind":"body_param","params":[{"name":"elem"}]}],"docs":{"text":"Runs the body once for every element in the tree.\n\n     ui.@walk(; elem)\n     {\n         if (elem.is_widget(Viewport) || elem.has_id(\"hud\")) elem.request_paint();\n     };\n\n The unfiltered primitive under `@each` and `@each_id`. Reach for it when one\n pass has to answer several questions: three `@each` calls are three walks of\n the same tree, and testing an element costs far less than reaching it.\n\n Invalidation from the body is safe (it only sets flags); structural mutation\n of the tree is not \u2014 defer it with request_build like everything else."}},{"name":"@each","kind":"macro_method","uid":"cui::Ui.@each","file":"src/core/ui.c3:1133:15","return_type":{"name":"void"},"is_at_macro":true,"members":[{"name":"self","type":{"name":"Ui*","uid":"cui::Ui"},"is_ref":true},{"name":"$Type"},{"name":"@body","kind":"body_param","params":[{"name":"elem"}]}],"docs":{"text":"Runs the body for every element whose widget is exactly $Type.\n\n     ui.@each(Viewport; elem) { elem.request_paint(); };","params":[{"name":"$Type","description":"The widget type to visit."}]}},{"name":"@each_id","kind":"macro_method","uid":"cui::Ui.@each_id","file":"src/core/ui.c3:1148:15","return_type":{"name":"void"},"is_at_macro":true,"members":[{"name":"self","type":{"name":"Ui*","uid":"cui::Ui"},"is_ref":true},{"name":"id","type":{"name":"String"}},{"name":"@body","kind":"body_param","params":[{"name":"elem"}]}],"docs":{"text":"Runs the body for every element stamped with this id \u2014 the id-keyed twin of\n `@each`, for when one name is deliberately shared across duplicated subtrees.","params":[{"name":"id","description":"The name given with with_id."}]}},{"name":"invalidate","kind":"macro_method","uid":"cui::Ui.invalidate","file":"src/core/ui.c3:1589:10","members":[{"name":"self","type":{"name":"Ui*","uid":"cui::Ui"},"is_ref":true},{"name":"$Type"}],"docs":{"text":"A provided value changed: invalidate every element that watched it, each in the\n phase it was watched from. See `Element.watch`.\n\n Costs one walk of the tree \u2014 the same walk `emit` makes every frame anyway \u2014\n rather than keeping subscriber lists on the providers. Elements recycle through\n a free-list, so a stored `Element*` subscriber would have to be unsubscribed in\n `release`, and a missed one would invalidate whatever reused the slot.\n\n A no-op when nothing watched the type, including when nothing provided it: this\n does not check, so a writer may call it unconditionally.","params":[{"name":"$Type","description":"The provided type that changed, not its pointer."}]}}],"types":[{"name":"Media","kind":"struct","uid":"cui::Media","file":"src/core/media.c3:39:8","members":[{"name":"size","type":{"name":"Vec2","uid":"std::math::vector::Vec2"}},{"name":"origin","type":{"name":"Vec2","uid":"std::math::vector::Vec2"}},{"name":"pixel_ratio","type":{"name":"float"}}],"docs":{"text":"The metrics of one screen. Sizes and positions are in logical pixels, the same\n units as every other coordinate in cui.\n\n Freshness: `size` is what the box published on its way into the current layout\n pass and `origin` is where the emit pass last put it, so both are exact in\n `layout` and in `paint`, and in `build` \u2014 which runs before either \u2014 both are\n the previous frame's. Building against them is what `MenuBar` does to place a\n dropdown, and it is sound for the same reason offsetting a popup by a stale\n `absolute` is: a bar has not moved or changed size between the click that opens\n a menu and the frame that draws it. What is not sound is baking a media value\n into a subtree that then outlives the change \u2014 anything that has to keep up\n reads it where it is used."}},{"name":"Constraints","kind":"struct","uid":"cui::Constraints","file":"src/core/ui.c3:60:8","members":[{"name":"min","type":{"name":"Vec2","uid":"std::math::vector::Vec2"}},{"name":"max","type":{"name":"Vec2","uid":"std::math::vector::Vec2"}}],"docs":{"text":"The size range a parent offers a child: `layout()` must return a size within\n it. Tight constraints (`min == max`) force a size; loose ones (`min` zero) let\n the child pick."}},{"name":"DirtyFlags","kind":"bitstruct","uid":"cui::DirtyFlags","file":"src/core/ui.c3:155:11","base_type":{"name":"char"},"members":[{"name":"build","type":{"name":"bool"},"bit_range":[0,0]},{"name":"layout","type":{"name":"bool"},"bit_range":[1,1]},{"name":"paint","type":{"name":"bool"},"bit_range":[2,2]}],"docs":{"text":"What an element must recompute on the next flush. Set through the\n `request_*` methods, cleared by the passes that service them."}},{"name":"Watch","kind":"struct","uid":"cui::Watch","file":"src/core/ui.c3:177:8","members":[{"name":"type","type":{"name":"typeid"}},{"name":"kind","type":{"name":"WatchKind","uid":"cui::WatchKind"}}],"docs":{"text":"One recorded dependency: this element's `kind` hook read the provided value of\n `type` the last time it ran."}},{"name":"Color","kind":"distinct type","uid":"cui::Color","file":"src/core/ui.c3:198:9","base_type":{"name":"float[<4>]","uid":"std::math::vector::Vec4"},"members":[],"docs":{"text":"Linear RGBA, 0..1 per channel. Alpha 0 also means \"unset\" wherever a style\n field is optional (Button.hover_style, Scroll.thumb_color)."}},{"name":"Widget","kind":"interface","uid":"cui::Widget","file":"src/core/ui.c3:292:11","members":[{"name":"mount","type":{"name":"void"},"params":[{"name":"elem","type":{"name":"Element*","uid":"cui::Element"}}],"is_optional":true},{"name":"build","type":{"name":"Element*","uid":"cui::Element"},"params":[{"name":"elem","type":{"name":"Element*","uid":"cui::Element"}}],"is_optional":true},{"name":"layout","type":{"name":"Vec2","uid":"std::math::vector::Vec2"},"params":[{"name":"elem","type":{"name":"Element*","uid":"cui::Element"}},{"name":"constraints","type":{"name":"Constraints","uid":"cui::Constraints"}}],"is_optional":true},{"name":"paint","type":{"name":"void"},"params":[{"name":"elem","type":{"name":"Element*","uid":"cui::Element"}},{"name":"painter","type":{"name":"Painter*","uid":"cui::Painter"}}],"is_optional":true},{"name":"on_mouse","type":{"name":"bool"},"params":[{"name":"elem","type":{"name":"Element*","uid":"cui::Element"}},{"name":"event","type":{"name":"MouseEvent","uid":"cui::MouseEvent"}}],"is_optional":true},{"name":"on_hover","type":{"name":"void"},"params":[{"name":"elem","type":{"name":"Element*","uid":"cui::Element"}},{"name":"entered","type":{"name":"bool"}}],"is_optional":true},{"name":"on_key","type":{"name":"bool"},"params":[{"name":"elem","type":{"name":"Element*","uid":"cui::Element"}},{"name":"event","type":{"name":"KeyEvent","uid":"cui::KeyEvent"}}],"is_optional":true},{"name":"update","type":{"name":"void"},"params":[{"name":"elem","type":{"name":"Element*","uid":"cui::Element"}},{"name":"dt","type":{"name":"float"}}],"is_optional":true},{"name":"unmount","type":{"name":"void"},"params":[{"name":"elem","type":{"name":"Element*","uid":"cui::Element"}}],"is_optional":true}],"docs":{"text":"A widget is behavior attached to an Element. All methods are optional.\n\n Sizing in particular is two tiers, and most widgets never write sizing code\n at all. A struct carrying a `Vec2 size` field and no `layout` is sized by the\n field: per axis, a set component is that many pixels and a zero component\n fills what the parent offers \u2014 the same convention the built-in containers\n use, so `{ 0, 40 }` inside a 400px Column is a 400\u00d740 bar. Rectangle is the\n worked example. The field is read live on every layout, so mutating it and\n calling `request_layout` resizes the element. The detection happens in the\n node macros, where the concrete type is still visible; a widget handed to\n `Ui.mount` arrives type-erased, so give those a real `layout`. Everything the\n field cannot say \u2014 a size measured from content, or children to place \u2014\n is `layout`. A widget with neither fills whatever it is offered.\n\n The pointer shape is not a method either: `Element.set_cursor` can be called\n from any hook, and the natural one is `on_hover`, which most interactive\n widgets already implement to light themselves up. Button is the worked example.\n\n - `build` \u2014 compose this widget out of existing widgets: return a subtree made\n   with `elem.ui.@node` \u2014 the framework attaches it as the element's single\n   child on the flush after the element enters the tree (a build widget takes\n   no @node children of its own; the built subtree IS its content). With\n   `layout` omitted, the element sizes itself to the built subtree. After\n   mutating fields, call `elem.request_build()` (or use `ui.@modify`) to\n   regenerate the subtree. Must be pure: read own fields, produce nodes \u2014 state\n   that must survive a rebuild lives on the composite, not inside the built\n   subtree. See test/composite.c3 and build.md.\n - `mount` \u2014 the element entered the tree; runs once, just before its first\n   layout, with the parent chain already wired. The home for element properties\n   that never change: `elem.ignores_pointer`, `elem.clips` / `clip_radii`, and\n   `set_cursor` for a widget that speaks for its whole subtree. A property\n   computed from constraints or from mutable fields belongs in `layout`\n   instead, which re-runs; this does not. Not a safe place to acquire anything\n   that `unmount` must release: an element released before it was ever laid out\n   \u2014 a subtree built and replaced in the same frame \u2014 gets the `unmount` without\n   ever having got the `mount`. Allocate in `build` or on first use.\n - `layout` \u2014 given constraints, return own size; lay out children through\n   `elem.layout_child` / `elem.place_child`. A content-sized leaf is one line:\n   `return constraints.constrain(wanted);` \u2014 see Label. Omitted: a build widget\n   delegates to its built subtree; otherwise the size field or the fill default\n   decides, and children get loose constraints and keep their offsets. Reach\n   for `Constraints.loose` / `tight` / `deflate` / `fill` rather than writing\n   the ranges out by hand. Re-runs on every resize, which is what makes it the\n   place for the element properties `mount` cannot answer for: a `media_box`\n   sized from the constraints, a clip radius read from a mutable style.\n - `paint` \u2014 emit primitives in element-local coordinates. Omitted: the element\n   draws nothing itself (pure container).\n - `on_mouse` \u2014 press/release/move/scroll, hit-tested and bubbling: the deepest\n   element under the pointer gets it first; return true to consume. Consuming a\n   PRESS captures the mouse until that button releases.\n - `on_hover` \u2014 pointer entered (true) / left (false) this element.\n - `on_key` \u2014 key press/release edges, delivered to the focused element (left\n   click focuses; see `Element.request_focus`), bubbling like `on_mouse`.\n - `update` \u2014 called every frame with the frame's dt \u2014 for animations and\n   polling `ui.input`; mutate state then `request_paint()`.\n - `unmount` \u2014 free whatever the widget allocated; called whenever its element\n   leaves the tree, including when it leaves only to be rebuilt (which mounts\n   the new one again). Fires unconditionally, so it is the wider of the pair:\n   see the caveat on `mount`. The widget struct itself stays caller-owned.\n   Takes the element like every other hook, so a widget can still reach\n   `inherit` on the way out and release symmetrically with what it acquired.\n\n The built-in implementations (Rectangle, Column, Row, Stack, Padding, Clip,\n Scroll, Button) live in module `cui::widgets`; apps write their own against\n this interface."}},{"name":"SizeGetter","kind":"alias","uid":"cui::SizeGetter","file":"src/core/ui.c3:353:7","return_type":{"name":"Vec2","uid":"std::math::vector::Vec2"},"members":[{"name":"widget","type":{"name":"void*"}}],"docs":null},{"name":"Element","kind":"struct","uid":"cui::Element","file":"src/core/ui.c3:362:8","members":[{"name":"ui","type":{"name":"Ui*","uid":"cui::Ui"}},{"name":"widget","type":{"name":"Widget","uid":"cui::Widget"}},{"name":"id","type":{"name":"String"}},{"name":"parent","type":{"name":"Element*","uid":"cui::Element"}},{"name":"children","type":{"name":"List{Element*}","uid":"std::collections::list::List{Element*}"}},{"name":"last_constraints","type":{"name":"Constraints","uid":"cui::Constraints"}},{"name":"size","type":{"name":"Vec2","uid":"std::math::vector::Vec2"}},{"name":"offset","type":{"name":"Vec2","uid":"std::math::vector::Vec2"}},{"name":"absolute","type":{"name":"Vec2","uid":"std::math::vector::Vec2"}},{"name":"cursor","type":{"name":"Cursor","uid":"cui::Cursor"}},{"name":"auto_size","type":{"name":"SizeGetter","uid":"cui::SizeGetter"}},{"name":"mounted","type":{"name":"bool"}},{"name":"ignores_pointer","type":{"name":"bool"}},{"name":"local_drawings","type":{"name":"List{Drawing}","uid":"std::collections::list::List{Drawing}"}},{"name":"first_drawing","type":{"name":"sz","uid":"std::core::sz"}},{"name":"drawing_count","type":{"name":"sz","uid":"std::core::sz"}},{"name":"transform_slot","type":{"name":"uint"}},{"name":"clips","type":{"name":"bool"}},{"name":"clip_radii","type":{"name":"Vec4","uid":"std::math::vector::V
